<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Nar — Plataforma de cierre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:opsz,wght@12..30,400;12..30,500;12..30,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --stone:#F6F4F0; --stone-card:#FFFFFF;
    --ink:#211613; --ink-soft:#6E5F5A; --ink-faint:#A79A94;
    --oxblood:#58130E; --oxblood-deep:#3A0C08; --oxblood-soft:#F1E1DE;
    --gold:#9C7A3E; --gold-soft:#EFE6D3;
    --clay:#9C5A32; --clay-soft:#F2E1D2;
    --jade:#3E6B52; --jade-soft:#DEE9E2;
    --line:rgba(33,22,19,0.12); --line-strong:rgba(33,22,19,0.24);
    --shadow-card:0 1px 2px rgba(33,22,19,0.04), 0 8px 20px -12px rgba(33,22,19,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .app{background:var(--stone); color:var(--ink); font-family:'Inter',sans-serif; border-radius:18px; overflow:hidden; border:0.5px solid var(--line); box-shadow:var(--shadow-card);}
  .head-band{background:var(--oxblood-deep); color:var(--stone); padding:20px 26px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;}
  .brand-mark{display:flex; align-items:center; gap:14px;}
  .brand-mark img{height:38px; width:auto; display:block;}
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-text .name{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:21px; letter-spacing:0.5px;}
  .brand-text .tag{font-family:'Inter',sans-serif; font-size:10px; letter-spacing:2.2px; text-transform:uppercase; color:#D9B9A9; margin-top:2px;}
  .tabs{display:flex; gap:6px;}
  .tab-btn{background:transparent; border:1px solid rgba(255,255,255,0.28); color:#EBD9D2; padding:7px 16px; border-radius:24px; font-size:12.5px; cursor:pointer; font-family:'Inter',sans-serif; transition:background 0.15s;}
  .tab-btn:hover{background:rgba(255,255,255,0.08);}
  .tab-btn.active{background:var(--stone); color:var(--oxblood-deep); border-color:var(--stone);}
  .body-wrap{padding:24px 26px; min-height:400px;}
  .banner{background:var(--gold-soft); color:#5B4620; font-size:12px; padding:10px 14px; border-radius:10px; margin-bottom:18px; line-height:1.5;}
  .section-title{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:19px; margin:0 0 12px; color:var(--oxblood-deep);}
  .card{background:var(--stone-card); border:0.5px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow-card);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-row{display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .form-row label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft); flex:1; min-width:160px;}
  input, select, textarea{font-size:13px; padding:8px 10px; border:0.5px solid var(--line); border-radius:8px; background:var(--stone-card); color:var(--ink); font-family:'Inter',sans-serif; transition:border-color 0.15s;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--oxblood); box-shadow:0 0 0 3px var(--oxblood-soft);}
  textarea{width:100%; resize:vertical; min-height:36px;}
  .btn{padding:8px 16px; border-radius:24px; font-size:12.5px; cursor:pointer; border:1px solid var(--line-strong); background:var(--stone-card); color:var(--ink-soft); transition:all 0.15s; font-family:'Inter',sans-serif;}
  .btn:hover{border-color:var(--oxblood); color:var(--oxblood);}
  .btn.primary{background:var(--oxblood); color:#fff; border-color:var(--oxblood);}
  .btn.primary:hover{background:var(--oxblood-deep); color:#fff;}
  .btn.gold{background:var(--gold); color:#fff; border-color:var(--gold);}
  .btn.gold:hover{color:#fff; opacity:0.9;}
  .deal-card{border:0.5px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; background:var(--stone-card); cursor:pointer; transition:all 0.15s; box-shadow:var(--shadow-card);}
  .deal-card:hover{border-color:var(--oxblood); transform:translateY(-1px);}
  .deal-card.active{border-color:var(--oxblood); box-shadow:0 0 0 3px var(--oxblood-soft);}
  .deal-title{font-weight:600; font-size:14.5px;}
  .deal-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .badge{display:inline-block; font-size:10.5px; padding:3px 10px; border-radius:20px; background:var(--jade-soft); color:var(--jade); margin-top:6px; font-weight:500;}
  .badge.scn-trust{background:var(--gold-soft); color:#6B4E1E;}
  .badge.scn-transfer{background:var(--clay-soft); color:#7A3417;}
  .badge.scn-trust-termination{background:var(--oxblood-soft); color:var(--oxblood);}
  .doc-list{list-style:none; padding:0; margin:0;}
  .doc-item{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:0.5px solid var(--line); font-size:13px;}
  .doc-item:last-child{border-bottom:none;}
  .doc-check{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line-strong); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--jade); transition:all 0.15s;}
  .doc-check.done{background:var(--jade); border-color:var(--jade); color:#fff;}
  .doc-owner{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.4px; margin-right:6px;}
  .task-row{display:flex; gap:12px; padding:10px 0; border-bottom:0.5px solid var(--line); align-items:flex-start;}
  .progress-track{height:8px; border-radius:5px; background:var(--stone); overflow:hidden; margin:4px 0 14px;}
  .progress-fill{height:100%; border-radius:5px; background:var(--jade); transition:width 0.2s;}
  .task-row:last-child{border-bottom:none;}
  .task-stamp{flex-shrink:0; width:30px; height:30px; border-radius:50%; border:2px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-size:11px; cursor:pointer; background:var(--stone-card); color:var(--ink-faint);}
  .task-stamp.progress{border-color:var(--clay); color:var(--clay);}
  .task-stamp.done{border-color:var(--gold); color:var(--gold); background:var(--gold-soft);}
  .task-en{font-weight:500; font-size:13.5px;}
  .task-es{font-size:12px; color:var(--ink-soft); font-style:italic;}
  .sign-tag{font-size:10.5px; padding:2px 8px; border-radius:10px; background:var(--oxblood-soft); color:var(--oxblood); margin-left:6px; font-weight:500;}
  select.role-select{font-weight:500;}
  .empty{display:flex; flex-direction:column; align-items:center; justify-content:center; height:280px; color:var(--ink-faint); text-align:center; gap:8px;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
  .field-hint{font-size:11px; color:var(--ink-faint); margin-top:-4px; margin-bottom:8px;}
  .gate-wrap{min-height:420px; display:flex; align-items:center; justify-content:center; padding:40px 20px;}
  .gate-card{max-width:340px; width:100%; text-align:center;}
  .gate-mark{font-family:'Cormorant Garamond',serif; font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); margin-bottom:6px;}
  .gate-title{font-family:'Cormorant Garamond',serif; font-weight:500; font-size:20px; margin:0 0 4px;}
  .gate-sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:22px; line-height:1.5;}
  .gate-card input{width:100%; margin-bottom:10px; text-align:center;}
  .gate-note{font-size:11px; color:var(--ink-faint); margin-top:16px; line-height:1.5; text-align:left; background:var(--stone-card); border:0.5px solid var(--line); border-radius:8px; padding:10px 12px;}
  .gate-error{color:var(--clay); font-size:12px; margin-bottom:8px; min-height:14px;}
  @media (max-width:600px){ .grid2{grid-template-columns:1fr;} }
</style>
</head>

// Selector de idioma — persistido en localStorage, aplica a toda la SPA
// (no a los machotes de KYC/contrato, que ya eligen idioma por su cuenta
// vía el selector propio de cada expediente). `t()` es el helper de
// traducción: busca la clave en STRINGS[lang], cae a STRINGS.es si falta,
// y por último a la clave misma (para no romper si falta una traducción).
let lang = localStorage.getItem('nar_lang') || 'es';
function t(key, vars){
  let s = (STRINGS[lang] && STRINGS[lang][key]) ?? STRINGS.es[key] ?? key;
  if(vars) Object.keys(vars).forEach(k => { s = s.replace(new RegExp('\\{'+k+'\\}','g'), vars[k]); });
  return s;
}
function setLang(next){
  lang = next;
  localStorage.setItem('nar_lang', lang);
  render();
}
function SCENARIOS_LABEL(key){ return SCENARIOS_I18N[key][lang] || SCENARIOS_I18N[key].es; }
// Compatibilidad con el resto del código, que ya usaba SCENARIOS[key].label
// / .labelShort / .badgeClass / .sellerTypes / .buyerTypes en muchos
// lugares — en vez de tocar cada uno de esos usos, SCENARIOS queda como un
// proxy que resuelve el idioma actual en el momento de leer la propiedad.
const SCENARIOS = new Proxy(SCENARIOS_I18N, {
  get(target, scenarioKey){
    const entry = target[scenarioKey];
    if(!entry) return undefined;
    const i18n = entry[lang] || entry.es;
    return { label: i18n.label, labelShort: i18n.labelShort, badgeClass: entry.badgeClass, sellerTypes: entry.sellerTypes, buyerTypes: entry.buyerTypes };
  }
});

const TYPE_LABEL_I18N = {
  individual: { es: "Individuo", en: "Individual" },
  corporation: { es: "Persona moral (MX)", en: "Legal entity (MX)" },
  llc: { es: "LLC / entidad extranjera", en: "LLC / foreign entity" }
};
const TYPE_LABEL = new Proxy(TYPE_LABEL_I18N, {
  get(target, key){ const e = target[key]; return e ? (e[lang] || e.es) : undefined; }
});

async function apiFetch(path, options={}){
  const res = await fetch(API_BASE + path, {
    credentials: 'include',
    headers: {'Content-Type':'application/json'},
    ...options
  });
  let body = null;
  try{ body = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((body && body.error) || `Error ${res.status}`);
  return body;
}

// Como apiFetch, pero para subir archivos (FormData) — no fuerza
// Content-Type: application/json, así el navegador pone el boundary de
// multipart automáticamente.
async function apiUpload(path, formData){
  const res = await fetch(API_BASE + path, { method:'POST', credentials:'include', body: formData });
  let body = null;
  try{ body = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((body && body.error) || `Error ${res.status}`);
  return body;
}

async function checkSession(){
  try{
    const user = await apiFetch('/api/auth/me');
    currentUser = user;
    authenticated = true;
    mainTab = (user.role === 'buyer' || user.role === 'seller') ? 'portal' : 'admin';
  }catch(e){
    authenticated = false;
    currentUser = null;
  }
  checkingSession = false;
}

const AGENCIES = ['LPR Luxury', 'Applegate Realtors', 'JPM Real Estate', 'Interamerican'];
// Estos documentos de LLC llegan primero como copia escaneada simple y
// después con estos requisitos ya cumplidos, cada uno por separado (Good
// Standing no se notariza, por eso no lo tiene) — mismos nombres/listas que
// routes/deals.js SUB_CHECKS_BY_DOC.
const SUB_CHECKS_BY_DOC = {
  'Good Standing': ['Apostilled', 'Translated'],
  'Operating Agreement': ['Notarized', 'Apostilled', 'Translated'],
  'Articles of organization': ['Notarized', 'Apostilled', 'Translated']
};
function adaptTask(t){
  return {
    id: t.id, en: t.label_en, es: t.label_es, status: t.status, sign: !!t.requires_signature,
    docusignStatus: t.docusign_status, documentOriginalName: t.document_original_name
  };
}
// Un vendedor/comprador individual, o una entidad (LLC/persona moral) con su
// estructura de propiedad — reemplaza el viejo .seller/.buyer singular.
function adaptParty(p){
  return {
    id: p.id, side: p.side, sortOrder: p.sort_order, name: p.name, partyType: p.party_type,
    ownershipMode: p.ownership_mode,
    parentEntityName: p.parent_entity_name, parentEntityType: p.parent_entity_type,
    parentHasTrustAbove: !!p.parent_has_trust_above, parentTrustName: p.parent_trust_name,
    directTrustName: p.direct_trust_name,
    owners: (p.owners || []).map(o => ({ id: o.id, name: o.name })),
    linkedUser: p.linkedUser || null
  };
}
function sellerParties(deal){ return deal.parties.filter(p => p.side === 'seller'); }
function buyerParties(deal){ return deal.parties.filter(p => p.side === 'buyer'); }
function dealPartyNames(deal, side){ return deal.parties.filter(p => p.side === side).map(p => p.name).join(' y '); }

function adaptDealSummary(row){
  return {
    id: row.id, scenario: row.scenario, development: row.development, property: row.property,
    price: row.price, furniturePrice: row.furniture_price, currency: row.currency, startDate: row.start_date,
    escrowCompany: row.escrow_company || 'armour',
    closingDate: row.closing_date || '', dueDiligenceEndDate: row.due_diligence_end_date || '',
    parties: (row.parties || []).map(adaptParty),
    documents: [], tasks: [], _loaded: false,
    _counts: {
      documentsTotal: row.documents_total || 0, documentsDone: row.documents_done || 0,
      tasksTotal: row.tasks_total || 0, tasksDone: row.tasks_done || 0
    }
  };
}
function adaptDealDetail(row){
  const base = adaptDealSummary(row);
  base.documents = row.documents.map(adaptDoc);
  base.tasks = row.tasks.map(adaptTask);
  base._loaded = true;
  return base;
}

async function loadData(){
  await checkSession();
  if(!authenticated){ deals = []; render(); return; }
  try{
    const rows = await apiFetch('/api/deals');
    deals = rows.map(adaptDealSummary);
  }catch(e){ deals = []; }
  if(['admin','agent','lawyer'].includes(currentUser.role)) loadDashboard();
  if(currentUser.role === 'admin') loadPendingUsers();
  render();
}

async function loadDashboard(){
  try{ dashboardData = await apiFetch('/api/dashboard'); }
  catch(e){ dashboardData = null; }
  render();
}

async function loadPendingUsers(){
  try{
    const all = await apiFetch('/api/users');
    pendingUsers = all.filter(u => u.status === 'pending');
  }catch(e){ pendingUsers = null; }
  render();
}

async function openDeal(dealId){
  try{
    const full = await apiFetch('/api/deals/' + dealId);
    const adapted = adaptDealDetail(full);
    const idx = deals.findIndex(d=>d.id===dealId);
    if(idx>=0) deals[idx] = adapted; else deals.push(adapted);
  }catch(e){ alert(e.message); }
  render();
}

async function loadKyc(dealId, partyId, lang){
  const key = dealId + '-' + partyId;
  try{
    const qs = lang ? `?lang=${lang}` : '';
    kycCache[key] = await apiFetch(`/api/deals/${dealId}/kyc/${partyId}${qs}`);
  }catch(e){
    kycCache[key] = { error: e.message };
  }
  render();
}

async function loadContract(dealId){
  try{
    contractCache[dealId] = await apiFetch(`/api/deals/${dealId}/contract`);
  }catch(e){
    contractCache[dealId] = { error: e.message };
  }
  render();
}

function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function pctDocs(deal){
  if(!deal._loaded) return deal._counts.documentsTotal ? Math.round(deal._counts.documentsDone/deal._counts.documentsTotal*100) : 0;
  const done = deal.documents.filter(d=>d.status==='done').length;
  return deal.documents.length ? Math.round(done/deal.documents.length*100) : 0;
}
function pctTasks(deal){
  if(!deal._loaded) return deal._counts.tasksTotal ? Math.round(deal._counts.tasksDone/deal._counts.tasksTotal*100) : 0;
  const done = deal.tasks.filter(t=>t.status==='done').length;
  return deal.tasks.length ? Math.round(done/deal.tasks.length*100) : 0;
}

function render(){
  document.getElementById('mainTabs').style.visibility = authenticated ? 'visible' : 'hidden';
  document.getElementById('header-logout').style.display = authenticated ? '' : 'none';
  document.getElementById('tab-admin').textContent = t('tabAdmin');
  document.getElementById('tab-portal').textContent = t('tabPortal');
  document.getElementById('lang-toggle').textContent = lang === 'es' ? 'EN' : 'ES';
  document.getElementById('lang-toggle').onclick = () => setLang(lang === 'es' ? 'en' : 'es');
  document.documentElement.lang = lang;
  const body = document.getElementById('body');
  body.innerHTML = '';
  if(checkingSession){
    body.innerHTML = `<div class="empty"><i class="ti ti-loader-2" aria-hidden="true"></i><div>${t('checkingSession')}</div></div>`;
    return;
  }
  if(!authenticated){
    renderLogin(body);
    return;
  }
  document.querySelectorAll('#mainTabs .tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===mainTab));
  // Admin/agente ven ambas pestañas; comprador/vendedor solo el portal.
  const adminTabBtn = document.querySelector('#mainTabs [data-tab="admin"]');
  if(adminTabBtn) adminTabBtn.style.display = ['admin','agent','lawyer'].includes(currentUser.role) ? '' : 'none';
  if(mainTab === 'admin') renderAdmin(body);
  else renderPortal(body);
}

function renderLogin(body){
  if(authView === 'register'){ renderRegister(body); return; }

  const wrap = document.createElement('div');
  wrap.className = 'gate-wrap';
  wrap.innerHTML = `
    <div class="gate-card">
      <div class="gate-mark">Grupo Nar Legal Consultants</div>
      <div class="gate-title">${t('loginTitle')}</div>
      <div class="gate-sub">${t('loginGateSub')}</div>
      <div class="gate-error">${escapeHtml(loginError)}</div>
      ${registerSuccess ? `<div class="field-hint" style="color:var(--jade); margin-bottom:8px;">${escapeHtml(registerSuccess)}</div>` : ''}
      <input type="email" id="login-email" placeholder="${t('loginEmailPh')}" autocomplete="username">
      <input type="password" id="login-password" placeholder="${t('loginPasswordPh')}" autocomplete="current-password">
      <button class="btn primary" id="login-submit" style="width:100%;" ${loginLoading ? 'disabled' : ''}>${loginLoading ? t('loginSubmitting') : t('loginSubmit')}</button>
      <div class="field-hint" style="text-align:center; margin-top:12px;">${t('loginNoAccount')} <a href="#" id="go-register">${t('loginCreateAccount')}</a></div>
      <div class="gate-note"><i class="ti ti-server" aria-hidden="true"></i> ${t('gateNote', { base: API_BASE || t('sameOrigin') })}</div>
    </div>
  `;
  body.appendChild(wrap);
  const submit = async () => {
    const email = wrap.querySelector('#login-email').value.trim();
    const password = wrap.querySelector('#login-password').value;
    if(!email || !password){ loginError = t('loginErrFields'); render(); return; }
    loginLoading = true; loginError=''; render();
    try{
      const user = await apiFetch('/api/auth/login', {method:'POST', body: JSON.stringify({email, password})});
      currentUser = user;
      authenticated = true;
      registerSuccess = '';
      mainTab = (user.role === 'buyer' || user.role === 'seller') ? 'portal' : 'admin';
      loginLoading = false;
      await loadData();
    }catch(e){
      loginLoading = false;
      loginError = e.message === 'Failed to fetch' ? t('loginErrConnection') : e.message;
      render();
    }
  };
  wrap.querySelector('#login-submit').onclick = submit;
  wrap.querySelector('#login-password').onkeydown = (e) => { if(e.key==='Enter') submit(); };
  wrap.querySelector('#go-register').onclick = (e) => { e.preventDefault(); authView='register'; loginError=''; render(); };
}

function renderRegister(body){
  const wrap = document.createElement('div');
  wrap.className = 'gate-wrap';
  wrap.innerHTML = `
    <div class="gate-card">
      <div class="gate-mark">Grupo Nar Legal Consultants</div>
      <div class="gate-title">${t('registerTitle')}</div>
      <div class="gate-sub">${t('registerSub')}</div>
      <div class="gate-error">${escapeHtml(registerError)}</div>
      <input type="text" id="reg-name" placeholder="${t('registerNamePh')}" autocomplete="name">
      <input type="email" id="reg-email" placeholder="${t('registerEmailPh')}" autocomplete="username">
      <input type="password" id="reg-password" placeholder="${t('registerPasswordPh')}" autocomplete="new-password">
      <select id="reg-role" style="width:100%; margin-bottom:10px;">
        <option value="agent">${t('registerRoleAgent')}</option>
        <option value="lawyer">${t('registerRoleLawyer')}</option>
      </select>
      <select id="reg-agency" style="width:100%; margin-bottom:10px;">
        <option value="">${t('registerAgencyPlaceholderSelect')}</option>
        ${AGENCIES.map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('')}
        <option value="Otro">${t('registerAgencyOther')}</option>
      </select>
      <input type="text" id="reg-agency-other" placeholder="${t('registerAgencyOtherPh')}" style="display:none;">
      <button class="btn primary" id="register-submit" style="width:100%;" ${registerLoading ? 'disabled' : ''}>${registerLoading ? t('registerSubmitting') : t('registerSubmit')}</button>
      <div class="field-hint" style="text-align:center; margin-top:12px;"><a href="#" id="go-login">${t('registerHaveAccount')}</a></div>
    </div>
  `;
  body.appendChild(wrap);
  const agencySelect = wrap.querySelector('#reg-agency');
  const agencyOtherInput = wrap.querySelector('#reg-agency-other');
  const roleSelect = wrap.querySelector('#reg-role');
  function syncAgencyVisibility(){
    const isAgent = roleSelect.value === 'agent';
    agencySelect.style.display = isAgent ? '' : 'none';
    agencyOtherInput.style.display = (isAgent && agencySelect.value === 'Otro') ? '' : 'none';
  }
  syncAgencyVisibility();
  roleSelect.onchange = syncAgencyVisibility;
  agencySelect.onchange = syncAgencyVisibility;
  wrap.querySelector('#go-login').onclick = (e) => { e.preventDefault(); authView='login'; registerError=''; render(); };
  wrap.querySelector('#register-submit').onclick = async () => {
    const name = wrap.querySelector('#reg-name').value.trim();
    const email = wrap.querySelector('#reg-email').value.trim();
    const password = wrap.querySelector('#reg-password').value;
    const role = roleSelect.value;
    const agency = agencySelect.value;
    const agencyOther = agencyOtherInput.value.trim();
    if(!name || !email || !password){ registerError = t('registerErrFields'); render(); return; }
    if(role === 'agent' && (!agency || (agency==='Otro' && !agencyOther))){ registerError = t('registerErrAgency'); render(); return; }
    registerLoading = true; registerError=''; render();
    try{
      const result = await apiFetch('/api/auth/register', { method:'POST', body: JSON.stringify({name, email, password, role, agency, agencyOther}) });
      registerLoading = false;
      authView = 'login';
      registerSuccess = result.message;
      render();
    }catch(e){
      registerLoading = false;
      registerError = e.message;
      render();
    }
  };
}

async function logout(){
  try{ await apiFetch('/api/auth/logout', {method:'POST'}); }catch(e){}
  authenticated = false;
  currentUser = null;
  render();
}

document.getElementById('mainTabs').addEventListener('click', e=>{
  const btn = e.target.closest('.tab-btn');
  if(!btn || btn.id === 'header-logout') return;
  mainTab = btn.dataset.tab;
  render();
});
document.getElementById('header-logout').addEventListener('click', logout);

      <button class="btn ${adminView==='list'?'primary':''}" id="nav-list">${t('navOperations')}</button>
      ${currentUser.role==='admin' ? `<button class="btn ${adminView==='team'?'primary':''}" id="nav-team">${t('navTeam')}${pendingUsers && pendingUsers.length ? ` (${pendingUsers.length})` : ''}</button>` : ''}

  const title = document.createElement('div');

  addBtn.onclick = () => { adminView = 'newDeal'; render(); };
  body.appendChild(addBtn);

  if(!deals.length){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `<i class="ti ti-building-estate" aria-hidden="true"></i><div>${t('emptyDeals')}</div>`;
    body.appendChild(empty);
    return;
  }
  deals.forEach(d => {
    const s = SCENARIOS[d.scenario];
    const card = document.createElement('div');
    card.className = 'deal-card';
    card.innerHTML = `
      <div class="deal-title">${escapeHtml(d.property)}</div>
      <div class="deal-sub">${escapeHtml(dealPartyNames(d,'seller'))} → ${escapeHtml(dealPartyNames(d,'buyer'))} · ${d.currency||'USD'} ${Number(d.price||0).toLocaleString()}${d.furniturePrice ? ' + '+Number(d.furniturePrice).toLocaleString()+' muebles' : ''}</div>
      <span class="badge ${s.badgeClass}">${s.labelShort}</span>
      <span class="badge" style="background:var(--stone); border:0.5px solid var(--line); color:var(--ink-soft); margin-left:4px;">${DEVELOPMENT_LABEL[d.development||'punta_mita'].split(' (')[0]}</span>
      <div class="deal-sub" style="margin-top:6px;">Docs: ${pctDocs(d)}% · Tracker: ${pctTasks(d)}%</div>
    `;
    card.onclick = () => { activeDealId = d.id; openDeal(d.id); };
    body.appendChild(card);
  });
}


// Colores por urgencia (no por % de avance) — entre menos días falten para
// el cierre, más "caliente" el color, independientemente de qué tan
// avanzada esté la operación (una operación al 90% que cierra mañana sigue
// necesitando atención esta semana).
function closingUrgencyColor(daysToClose){
  if (daysToClose <= 7) return { ring: 'var(--oxblood)', pillBg: 'var(--oxblood-soft)', pillFg: 'var(--oxblood)' };
  if (daysToClose <= 21) return { ring: 'var(--gold)', pillBg: 'var(--gold-soft)', pillFg: '#6B4E1E' };
  return { ring: 'var(--jade)', pillBg: 'var(--jade-soft)', pillFg: 'var(--jade)' };
}

function buildUpcomingClosings(closings){
  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; margin-bottom:16px;';
  closings.forEach(c => {
    const colors = closingUrgencyColor(c.daysToClose);
    const card = document.createElement('div');
    card.className = 'card';
    card.style.cssText = 'display:flex; align-items:center; gap:14px; cursor:pointer; margin-bottom:0;';
    const pct = Math.max(0, Math.min(100, c.percent));
    const daysLabel = c.daysToClose < 0 ? t('closingOverdue')
      : c.daysToClose === 0 ? t('closingToday')
      : c.daysToClose === 1 ? t('daysToCloseSingular', { days: c.daysToClose })
      : t('daysToClosePlural', { days: c.daysToClose });
    card.innerHTML = `
      <div style="width:70px; height:70px; border-radius:50%; flex-shrink:0; background:conic-gradient(${colors.ring} ${pct}%, var(--line) ${pct}% 100%); display:flex; align-items:center; justify-content:center;">
        <div style="width:52px; height:52px; border-radius:50%; background:var(--stone-card); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:15px;">${pct}%</div>
      </div>
      <div style="min-width:0;">
        <div style="font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(c.property)}</div>
        <span class="badge" style="background:${colors.pillBg}; color:${colors.pillFg}; margin-top:6px;">${escapeHtml(daysLabel)}</span>
      </div>
    `;
    card.onclick = () => { adminView='list'; activeDealId=c.dealId; openDeal(c.dealId); };
    grid.appendChild(card);
  });
  return grid;
}

function buildDashboard(){
  const wrap = document.createElement('div');
  const title = document.createElement('div');
  title.className = 'section-title'; title.textContent = t('dashboard');
  wrap.appendChild(title);

  if(!dashboardData){
    const loading = document.createElement('div');
    loading.className = 'empty';
    loading.innerHTML = `<i class="ti ti-loader-2" aria-hidden="true"></i><div>${t('loadingDashboard')}</div>`;
    wrap.appendChild(loading);
    return wrap;
  }
  const d = dashboardData;

  const totalsCard = document.createElement('div');
  totalsCard.className = 'card';
  totalsCard.innerHTML = `
    <div class="grid2">
      <div><div style="font-size:26px; font-weight:600; color:var(--oxblood-deep);">${d.totalDeals}</div><div class="field-hint" style="margin:0;">${t('statActiveDeals')}</div></div>
      <div><div style="font-size:26px; font-weight:600; color:var(--oxblood-deep);">${d.documentsPending}</div><div class="field-hint" style="margin:0;">${t('statDocsPending')}</div></div>
      <div><div style="font-size:26px; font-weight:600; color:var(--oxblood-deep);">${d.tasksPending + d.tasksInProgress}</div><div class="field-hint" style="margin:0;">${t('statTasksUnfinished')}</div></div>
      <div><div style="font-size:26px; font-weight:600; color:var(--oxblood-deep);">${d.signaturesAwaiting.length}</div><div class="field-hint" style="margin:0;">${t('statAwaitingSignature')}</div></div>
    </div>
    ${d.dealsByScenario.length ? `<div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">${d.dealsByScenario.map(s=>`<span class="badge">${(SCENARIOS[s.scenario]&&SCENARIOS[s.scenario].labelShort)||s.scenario}: ${s.count}</span>`).join('')}</div>` : ''}
  `;
  wrap.appendChild(totalsCard);

  if(d.totalDeals > 0){
    const ucTitle = document.createElement('div');
    ucTitle.className = 'section-title'; ucTitle.textContent = t('upcomingClosings');
    wrap.appendChild(ucTitle);
    if(d.upcomingClosings && d.upcomingClosings.length){
      wrap.appendChild(buildUpcomingClosings(d.upcomingClosings));
    } else {
      const hint = document.createElement('div'); hint.className = 'card';
      hint.innerHTML = `<div class="field-hint" style="margin:0;">${t('noUpcomingClosingsHint')}</div>`;
      wrap.appendChild(hint);
    }
  }

  if(d.signaturesAwaiting.length){
    const signTitle = document.createElement('div');
    signTitle.className = 'section-title'; signTitle.textContent = t('awaitingSignature');
    wrap.appendChild(signTitle);
    const signCard = document.createElement('div'); signCard.className = 'card';
    d.signaturesAwaiting.forEach(item => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:0.5px solid var(--line); cursor:pointer; gap:10px;';
      row.innerHTML = `<span style="font-size:13px;">"${escapeHtml(lang==='en'?item.label_en:item.label_es)}" · ${escapeHtml(item.property)}</span><span class="badge" style="background:var(--gold-soft); color:#6B4E1E; flex-shrink:0;">${t('signature')}</span>`;
      row.onclick = () => { adminView='list'; activeDealId=item.dealId; openDeal(item.dealId); };
      signCard.appendChild(row);
    });
    wrap.appendChild(signCard);
  }

  const pendingTitle = document.createElement('div');
  pendingTitle.className = 'section-title'; pendingTitle.textContent = t('pendingByDeal');
  wrap.appendChild(pendingTitle);

  const groups = {};
  d.pendingDocuments.forEach(x => {
    if(!groups[x.dealId]) groups[x.dealId] = { property: x.property, docs: [], tasks: [] };
    groups[x.dealId].docs.push(x);
  });
  d.pendingTasks.forEach(x => {
    if(!groups[x.dealId]) groups[x.dealId] = { property: x.property, docs: [], tasks: [] };
    groups[x.dealId].tasks.push(x);
  });

  if(!Object.keys(groups).length){
    const emptyCard = document.createElement('div'); emptyCard.className = 'card';
    emptyCard.innerHTML = `<div class="field-hint" style="margin:0;">${t('noPending')}</div>`;
    wrap.appendChild(emptyCard);
  } else {
    Object.entries(groups).forEach(([dealId, g]) => {
      const card = document.createElement('div'); card.className = 'card';
      const header = document.createElement('div');
      header.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; cursor:pointer;';

          <span style="font-size:12.5px; flex:1;">${t('taskLabel')}: ${escapeHtml(lang==='en'?task.label_en:task.label_es)}</span>
          ${task.stale ? `<span class="badge" style="background:var(--oxblood-soft); color:var(--oxblood); flex-shrink:0;">${t('stale')}</span>` : ''}
        `;
        row.querySelector('.task-stamp').onclick = async () => {
          const order=['pending','progress','done'];
          const next = order[(order.indexOf(task.status)+1)%order.length];
          try{
            await apiFetch(`/api/deals/${dealId}/tasks/${task.taskId}`, { method:'PATCH', body: JSON.stringify({status: next}) });
            await loadDashboard();
          }catch(e){ alert(e.message); }
        };
        card.appendChild(row);
      });

      wrap.appendChild(card);
    });
  }

  return wrap;
}

const MAX_PARTIES_PER_SIDE = 4;

// Widget reutilizable de una parte (vendedor o comprador): nombre, tipo, y
// si es entidad (corporation/llc) su estructura de propiedad — hasta 2
// niveles (socios directos / entidad padre con o sin trust arriba / trust
// directo). Se usa tanto al crear una operación (buildNewDealForm) como al
// agregar/editar una parte de una ya existente (buildPartiesSection).
function buildPartyFieldsBlock(allowedTypes, existing){
  const box = document.createElement('div');
  box.style.cssText = 'border:0.5px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:var(--stone-card);';
  const typeOptions = allowedTypes.map(ty => `<option value="${ty}">${TYPE_LABEL[ty]}</option>`).join('');
  box.innerHTML = `
    <div class="form-row">
      <label>${t('name')} <input type="text" class="pf-name" placeholder="${t('partyNamePh')}"></label>
      <label>${t('type')} <select class="pf-type">${typeOptions}</select></label>
    </div>
    <div class="pf-ownership" style="display:none;">
      <label>${t('ownershipStructure')} <select class="pf-mode">
        <option value="direct_owners">${t('modeDirectOwners')}</option>
        <option value="parent_entity">${t('modeParentEntity')}</option>
        <option value="direct_trust">${t('modeDirectTrust')}</option>
      </select></label>
      <div class="pf-mode-owners">
        <div class="field-hint" style="margin:6px 0 4px;">${t('directOwners')}</div>
        <input type="text" class="pf-owner1" placeholder="${t('owner1Ph')}">
        <input type="text" class="pf-owner2" placeholder="${t('owner2Ph')}" style="margin-top:6px;">
      </div>
      <div class="pf-mode-parent" style="display:none;">
        <div class="form-row" style="margin-top:6px;">
          <label>${t('parentEntityName')} <input type="text" class="pf-parent-name"></label>
          <label>${t('type')} <select class="pf-parent-type">
            <option value="corporation">${t('corpMx')}</option>
            <option value="llc">${t('llcForeign')}</option>
          </select></label>
        </div>
        <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; margin-top:6px;">
          <input type="checkbox" class="pf-parent-trust"> ${t('parentHasTrust')}
        </label>
        <input type="text" class="pf-parent-trust-name" placeholder="${t('trustNamePh')}" style="display:none; margin-top:6px;">
      </div>
      <div class="pf-mode-trust" style="display:none; margin-top:6px;">
        <input type="text" class="pf-trust-name" placeholder="${t('directTrustNamePh')}">
      </div>
    </div>
  `;
  const typeSel = box.querySelector('.pf-type');
  const ownershipBlock = box.querySelector('.pf-ownership');
  const modeSel = box.querySelector('.pf-mode');
  const ownersBlock = box.querySelector('.pf-mode-owners');
  const parentBlock = box.querySelector('.pf-mode-parent');
  const trustBlock = box.querySelector('.pf-mode-trust');
  const parentTrustCheck = box.querySelector('.pf-parent-trust');
  const parentTrustName = box.querySelector('.pf-parent-trust-name');

  function updateVisibility(){
    ownershipBlock.style.display = typeSel.value === 'individual' ? 'none' : 'block';
    ownersBlock.style.display = modeSel.value === 'direct_owners' ? 'block' : 'none';
    parentBlock.style.display = modeSel.value === 'parent_entity' ? 'block' : 'none';
    trustBlock.style.display = modeSel.value === 'direct_trust' ? 'block' : 'none';
    parentTrustName.style.display = parentTrustCheck.checked ? 'block' : 'none';
  }
  typeSel.onchange = updateVisibility;
  modeSel.onchange = updateVisibility;
  parentTrustCheck.onchange = updateVisibility;

  if(existing){
    box.querySelector('.pf-name').value = existing.name || '';
    if(allowedTypes.includes(existing.partyType)) typeSel.value = existing.partyType;
    if(existing.ownershipMode) modeSel.value = existing.ownershipMode;
    if(existing.owners && existing.owners[0]) box.querySelector('.pf-owner1').value = existing.owners[0].name;
    if(existing.owners && existing.owners[1]) box.querySelector('.pf-owner2').value = existing.owners[1].name;
    if(existing.parentEntityName) box.querySelector('.pf-parent-name').value = existing.parentEntityName;
    if(existing.parentEntityType) box.querySelector('.pf-parent-type').value = existing.parentEntityType;
    if(existing.parentHasTrustAbove) parentTrustCheck.checked = true;
    if(existing.parentTrustName) parentTrustName.value = existing.parentTrustName;
    if(existing.directTrustName) box.querySelector('.pf-trust-name').value = existing.directTrustName;
  }
  updateVisibility();

  box.collectParty = function(side){
    const partyType = typeSel.value;
    const name = box.querySelector('.pf-name').value.trim();
    const p = { side, partyType, name };
    if(partyType !== 'individual'){
      p.ownershipMode = modeSel.value;
      if(modeSel.value === 'direct_owners'){
        const o1 = box.querySelector('.pf-owner1').value.trim();
        const o2 = box.querySelector('.pf-owner2').value.trim();
        p.owners = [o1, o2].filter(Boolean).map(name => ({ name }));
      } else if(modeSel.value === 'parent_entity'){
        p.parentEntityName = box.querySelector('.pf-parent-name').value.trim();
        p.parentEntityType = box.querySelector('.pf-parent-type').value;
        p.parentHasTrustAbove = parentTrustCheck.checked;
        if(parentTrustCheck.checked) p.parentTrustName = parentTrustName.value.trim();
      } else if(modeSel.value === 'direct_trust'){
        p.directTrustName = box.querySelector('.pf-trust-name').value.trim();
      }
    }
    return p;
  };

  return box;
}

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `

    </div>
    <div class="form-row">
      <label>${t('propertyPrice')} <input type="text" id="nd-price" placeholder="3100000"></label>

    </div>

      <div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div class="field-hint" style="margin:0;">${t('sellers')}</div>
          <button class="btn" id="nd-add-seller" style="font-size:11px;" type="button">${t('addSeller')}</button>
        </div>
        <div id="nd-sellers"></div>
      </div>
      <div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div class="field-hint" style="margin:0;">${t('buyers')}</div>
          <button class="btn" id="nd-add-buyer" style="font-size:11px;" type="button">${t('addBuyer')}</button>
        </div>
        <div id="nd-buyers"></div>
      </div>
    </div>
    <div class="form-row">
      <label>${t('offerSignedDate')} <input type="date" id="nd-start"></label>
      <label>${t('escrowCompany')} <select id="nd-escrow-company">
        <option value="armour">Armour Secure</option>
        <option value="tla">TLA Financial Services</option>
      </select></label>
    </div>
    <div class="gate-error" id="nd-error"></div>
    <div class="form-actions" style="display:flex; gap:8px; justify-content:flex-end;">
      <button class="btn" id="nd-cancel">${t('cancel')}</button>
      <button class="btn primary" id="nd-create">${t('createDeal')}</button>
    </div>
  `;
  wrap.appendChild(card);

  const sellersWrap = card.querySelector('#nd-sellers');
  const buyersWrap = card.querySelector('#nd-buyers');

  function addPartyBlock(container, side){
    if(container.children.length >= MAX_PARTIES_PER_SIDE) return;
    const scen = card.querySelector('#nd-scenario').value;
    const allowed = side === 'seller' ? SCENARIOS[scen].sellerTypes : SCENARIOS[scen].buyerTypes;
    const block = buildPartyFieldsBlock(allowed);
    if(container.children.length > 0){
      const removeBtn = document.createElement('button');
      removeBtn.className = 'btn'; removeBtn.style.cssText = 'font-size:11px; margin-top:-6px; margin-bottom:8px;'; removeBtn.type = 'button';
      removeBtn.textContent = t('remove');
      removeBtn.onclick = () => block.remove();
      block.appendChild(removeBtn);
    }
    container.appendChild(block);
  }
  card.querySelector('#nd-add-seller').onclick = () => addPartyBlock(sellersWrap, 'seller');
  card.querySelector('#nd-add-buyer').onclick = () => addPartyBlock(buyersWrap, 'buyer');
  addPartyBlock(sellersWrap, 'seller');
  addPartyBlock(buyersWrap, 'buyer');

  card.querySelector('#nd-scenario').onchange = () => {
    sellersWrap.innerHTML = ''; buyersWrap.innerHTML = '';
    addPartyBlock(sellersWrap, 'seller');
    addPartyBlock(buyersWrap, 'buyer');
  };

  wrap.querySelector('#nd-cancel').onclick = () => { adminView='list'; render(); };
  wrap.querySelector('#nd-create').onclick = async () => {
    const errEl = card.querySelector('#nd-error');
    errEl.textContent = '';
    const scenario = card.querySelector('#nd-scenario').value;
    const property = card.querySelector('#nd-property').value.trim();
    if(!property){ errEl.textContent = t('errMissingPropertyName'); return; }
    const sellers = Array.from(sellersWrap.children).map(b => b.collectParty('seller'));
    const buyers = Array.from(buyersWrap.children).map(b => b.collectParty('buyer'));
    if(sellers.some(p=>!p.name) || buyers.some(p=>!p.name)){ errEl.textContent = t('errMissingPartyName'); return; }
    const development = card.querySelector('#nd-development').value;
    const body = {
      scenario, development, property,
      price: Number(card.querySelector('#nd-price').value) || 0,
      furniturePrice: Number(card.querySelector('#nd-furniture').value) || 0,
      currency: card.querySelector('#nd-currency').value,
      parties: [...sellers, ...buyers],
      startDate: card.querySelector('#nd-start').value || new Date().toISOString().slice(0,10),
      escrowCompany: card.querySelector('#nd-escrow-company').value
    };
    try{
      const { id } = await apiFetch('/api/deals', { method:'POST', body: JSON.stringify(body) });
      adminView = 'list';
      activeDealId = id;
      await loadData();
      await openDeal(id);
    }catch(e){ errEl.textContent = e.message; }
  };
  return wrap;
}

// Resumen corto de la estructura de propiedad de una entidad, para mostrar
// junto a su nombre sin tener que abrir el editor.
function partyOwnershipSummary(p){
  if(p.partyType === 'individual') return '';
  if(p.ownershipMode === 'direct_owners') return `${t('partners')}: ${p.owners.map(o=>o.name).join(', ') || t('noName')}`;
  if(p.ownershipMode === 'parent_entity'){
    let s = `${t('parentEntity')}: ${p.parentEntityName} (${TYPE_LABEL[p.parentEntityType]||p.parentEntityType})`;
    if(p.parentHasTrustAbove) s += ` · ${t('trustAbove')}: ${p.parentTrustName}`;
    return s;
  }
  if(p.ownershipMode === 'direct_trust') return `${t('directTrust')}: ${p.directTrustName}`;
  return t('incompleteOwnership');
}

function buildPartiesSection(deal){
  const wrap = document.createElement('div');
  const addFormFor = { seller: null, buyer: null }; // toggles, no estado global

  function renderSide(side, label){
    const card = document.createElement('div'); card.className = 'card';
    const header = document.createElement('div');
    header.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;';
    const parties = deal.parties.filter(p => p.side === side);
    header.innerHTML = `<span style="font-weight:600; font-size:13px;">${label} (${parties.length})</span>`;
    const addBtn = document.createElement('button');
    addBtn.className = 'btn'; addBtn.style.fontSize = '11px'; addBtn.textContent = t('add');
    addBtn.disabled = parties.length >= MAX_PARTIES_PER_SIDE;
    header.appendChild(addBtn);
    card.appendChild(header);

    parties.forEach(p => {
      const row = document.createElement('div');
      row.style.cssText = 'padding:8px 0; border-bottom:0.5px solid var(--line);';
      row.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <span style="font-size:13px;">${escapeHtml(p.name)} <span class="field-hint" style="margin:0;">(${TYPE_LABEL[p.partyType]})</span>${p.linkedUser ? ` <span class="badge" style="background:var(--jade-soft); color:var(--jade);">${t('accountLinked')}</span>` : ''}</span>
          <span style="display:flex; gap:6px;">
            <button class="btn pty-edit" style="font-size:11px;">${t('edit')}</button>
            ${parties.length > 1 ? `<button class="btn pty-remove" style="font-size:11px;">${t('remove')}</button>` : ''}
          </span>
        </div>
        ${p.partyType !== 'individual' ? `<div class="field-hint" style="margin:4px 0 0;">${escapeHtml(partyOwnershipSummary(p))}</div>` : ''}
      `;
      const editSlot = document.createElement('div');
      row.appendChild(editSlot);

      row.querySelector('.pty-edit').onclick = () => {
        if(editSlot.childElementCount){ editSlot.innerHTML = ''; return; }
        const scen = deal.scenario;
        const allowed = side === 'seller' ? SCENARIOS[scen].sellerTypes : SCENARIOS[scen].buyerTypes;
        const block = buildPartyFieldsBlock(allowed, p);
        block.style.marginTop = '8px';
        const saveBtn = document.createElement('button');
        saveBtn.className = 'btn primary'; saveBtn.style.fontSize = '11px'; saveBtn.textContent = t('save');
        const errEl = document.createElement('div');
        errEl.className = 'gate-error';
        saveBtn.onclick = async () => {
          errEl.textContent = '';
          try{
            await apiFetch(`/api/deals/${deal.id}/parties/${p.id}`, { method:'PATCH', body: JSON.stringify(block.collectParty(side)) });
            await openDeal(deal.id);
          }catch(e){ errEl.textContent = e.message; }
        };
        block.appendChild(saveBtn);
        block.appendChild(errEl);
        editSlot.appendChild(block);
      };
      const removeBtn = row.querySelector('.pty-remove');
      if(removeBtn) removeBtn.onclick = async () => {
        if(!confirm(t('confirmRemoveParty', { name: p.name }))) return;
        try{
          await apiFetch(`/api/deals/${deal.id}/parties/${p.id}`, { method:'DELETE' });
          await openDeal(deal.id);
        }catch(e){ alert(e.message); }
      };
      card.appendChild(row);
    });

    const addSlot = document.createElement('div');
    card.appendChild(addSlot);
    addBtn.onclick = () => {
      if(addSlot.childElementCount){ addSlot.innerHTML = ''; return; }
      const allowed = side === 'seller' ? SCENARIOS[deal.scenario].sellerTypes : SCENARIOS[deal.scenario].buyerTypes;
      const block = buildPartyFieldsBlock(allowed);
      block.style.marginTop = '8px';
      const saveBtn = document.createElement('button');
      saveBtn.className = 'btn primary'; saveBtn.style.fontSize = '11px'; saveBtn.textContent = t('addPlain');
      const errEl = document.createElement('div');
      errEl.className = 'gate-error';
      saveBtn.onclick = async () => {
        errEl.textContent = '';
        try{
          await apiFetch(`/api/deals/${deal.id}/parties`, { method:'POST', body: JSON.stringify(block.collectParty(side)) });
          await openDeal(deal.id);
        }catch(e){ errEl.textContent = e.message; }
      };
      block.appendChild(saveBtn);
      block.appendChild(errEl);
      addSlot.appendChild(block);
    };

    return card;
  }

  wrap.appendChild(renderSide('seller', t('sellers')));
  wrap.appendChild(renderSide('buyer', t('buyers')));
  return wrap;
}

    <div class="deal-sub">${t('documentsLabel')}: ${pctDocs(deal)}% ${t('completeLabel')} · ${t('trackerLabel')}: ${pctTasks(deal)}% ${t('completeLabel')}</div>
    <div class="deal-sub" style="margin-top:6px; display:flex; align-items:center; gap:6px;">${t('escrowCompany')}

        <option value="tla" ${deal.escrowCompany==='tla'?'selected':''}>TLA Financial Services</option>
      </select>
    </div>
    <div class="deal-sub" style="margin-top:6px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
      <span style="display:flex; align-items:center; gap:6px;">${t('closingDateLabel')} <input type="date" id="closing-date-input" value="${deal.closingDate}" style="font-size:11.5px; padding:2px 6px;"></span>
      <span style="display:flex; align-items:center; gap:6px;">${t('ddEndLabel')} <input type="date" id="dd-end-date-input" value="${deal.dueDiligenceEndDate}" style="font-size:11.5px; padding:2px 6px;"></span>
    </div>
    <button class="btn" id="delDeal" style="margin-top:10px;"><i class="ti ti-trash" aria-hidden="true"></i> ${t('deleteDeal')}</button>
  `;
  wrap.appendChild(header);
  header.querySelector('#escrow-company-select').onchange = async (e) => {
    const next = e.target.value;
    if(!confirm(t('confirmChangeEscrow', { company: next==='armour'?'Armour Secure':'TLA Financial Services' }))){
      e.target.value = deal.escrowCompany;
      return;
    }
    try{
      await apiFetch('/api/deals/' + deal.id, { method:'PATCH', body: JSON.stringify({ escrowCompany: next }) });
      await openDeal(deal.id);
    }catch(err){ alert(err.message); e.target.value = deal.escrowCompany; }
  };
  header.querySelector('#closing-date-input').onchange = async (e) => {
    try{
      await apiFetch('/api/deals/' + deal.id, { method:'PATCH', body: JSON.stringify({ closingDate: e.target.value || null }) });
      deal.closingDate = e.target.value;
    }catch(err){ alert(err.message); e.target.value = deal.closingDate; }
  };
  header.querySelector('#dd-end-date-input').onchange = async (e) => {
    try{
      await apiFetch('/api/deals/' + deal.id, { method:'PATCH', body: JSON.stringify({ dueDiligenceEndDate: e.target.value || null }) });
      deal.dueDiligenceEndDate = e.target.value;
      render();
    }catch(err){ alert(err.message); e.target.value = deal.dueDiligenceEndDate; }
  };
  header.querySelector('#delDeal').onclick = async () => {
    if(!confirm(t('confirmDeleteDeal'))) return;
    try{
      await apiFetch('/api/deals/' + deal.id, { method: 'DELETE' });
      deals = deals.filter(d=>d.id!==deal.id);
      activeDealId = null; render();
    }catch(e){ alert(e.message); }
  };

  const partiesTitle = document.createElement('div');
  partiesTitle.className = 'section-title'; partiesTitle.textContent = t('sellersAndBuyers');
  wrap.appendChild(partiesTitle);
  wrap.appendChild(buildPartiesSection(deal));

  const propTitle = document.createElement('div');
  propTitle.className = 'section-title'; propTitle.textContent = t('propertySection');
  wrap.appendChild(propTitle);
  const propCard = document.createElement('div');
  propCard.className = 'card';
  propCard.appendChild(buildPropertyDocsSection(deal));
  wrap.appendChild(propCard);

  const docsTitle = document.createElement('div');
  docsTitle.className = 'section-title'; docsTitle.textContent = t('docsChecklist');
  wrap.appendChild(docsTitle);
  const docsCard = document.createElement('div');
  docsCard.className = 'card';
  docsCard.appendChild(buildDocsBySideGrouping(deal));
  wrap.appendChild(docsCard);

  const kycTitle = document.createElement('div');
  kycTitle.className = 'section-title'; kycTitle.textContent = t('kycFile');
  wrap.appendChild(kycTitle);
  const kycCard = document.createElement('div'); kycCard.className = 'card';
  deal.parties.forEach(p => kycCard.appendChild(buildKycSection(deal, p, true)));
  wrap.appendChild(kycCard);

  const tasksTitle = document.createElement('div');
  tasksTitle.className = 'section-title'; tasksTitle.textContent = t('closingTracker');
  wrap.appendChild(tasksTitle);
  const tasksCard = document.createElement('div');
  tasksCard.className = 'card';
  tasksCard.appendChild(buildTaskList(deal));
  wrap.appendChild(tasksCard);

  const inviteTitle = document.createElement('div');
  inviteTitle.className = 'section-title'; inviteTitle.textContent = t('inviteToThisDeal');
  wrap.appendChild(inviteTitle);
  wrap.appendChild(buildInviteForm(deal));

  const contractTitle = document.createElement('div');
  contractTitle.className = 'section-title'; contractTitle.textContent = t('contractPromise');
  wrap.appendChild(contractTitle);
  const contractCard = document.createElement('div'); contractCard.className = 'card';
  // Generar/editar el contrato es trabajo exclusivo de admin/abogado — el
  // agente ve la misma vista de solo lectura que comprador/vendedor (ver
  // PDF + firmar si le toca), nunca el machote en blanco.
  contractCard.appendChild(buildContractSection(deal, ['admin', 'lawyer'].includes(currentUser.role)));
  wrap.appendChild(contractCard);

  return wrap;
}

const KYC_STATUS_LABEL_I18N = {
  draft: { es: 'Sin generar', en: 'Not generated' }, generated: { es: 'Generado, sin enviar', en: 'Generated, not sent' },
  sent: { es: 'Enviado a firma', en: 'Sent for signature' }, signed: { es: 'Firmado', en: 'Signed' }
};
const KYC_STATUS_LABEL = new Proxy(KYC_STATUS_LABEL_I18N, {
  get(target, key){ const e = target[key]; return e ? (e[lang] || e.es) : undefined; }
});

function buildKycSection(deal, party, isStaffView){
  const role = party.id;
  const key = deal.id + '-' + role;
  const roleLabel = `${party.name} (${party.side === 'seller' ? t('sellerLabel2') : t('buyerLabel2')} · ${TYPE_LABEL[party.partyType]})`;
  const box = document.createElement('div');
  box.style.cssText = 'padding:10px 0; border-bottom:0.5px solid var(--line);';

  const data = kycCache[key];
  if(data === undefined){
    box.innerHTML = `<div class="field-hint" style="margin:0;">${escapeHtml(roleLabel)}: ${t('loadingEllipsis')}</div>`;
    loadKyc(deal.id, role);
    return box;
  }
  if(data.error){
    box.innerHTML = `<div class="field-hint" style="margin:0;">${escapeHtml(roleLabel)}: ${escapeHtml(data.error)}</div>`;
    return box;
  }

  const statusLabel = KYC_STATUS_LABEL[data.status] || data.status;
  box.innerHTML = `<div style="font-weight:500; font-size:13px;">${escapeHtml(roleLabel)} <span class="badge" style="margin-left:6px; background:var(--stone); border:0.5px solid var(--line); color:var(--ink-soft);">${escapeHtml(statusLabel)}</span> <span class="field-hint" style="margin:0;">(${escapeHtml(data.templateKey||'')})</span></div>`;

  // Selector de idioma — solo tiene sentido antes de empezar a llenar (una
  // vez que hay respuestas guardadas, cambiar de idioma significa arrancar
  // un expediente distinto, así que se oculta para no perder el borrador).
  if(isStaffView && data.status === 'draft' && Object.keys(data.answers||{}).length === 0 && data.availableTemplates && data.availableTemplates.length > 1){
    const langRow = document.createElement('div');
    langRow.style.cssText = 'margin-top:4px;';
    langRow.innerHTML = `<label class="field-hint" style="margin:0; display:inline-flex; gap:6px; align-items:center;">${t('formLanguage')}
      <select id="kyc-lang-${key}" style="font-size:11px; padding:2px 6px;">
        <option value="es">${t('spanish')}</option>
        <option value="en">${t('english')}</option>
      </select>
    </label>`;
    langRow.querySelector('select').value = data.templateKey.endsWith('-en') ? 'en' : 'es';
    langRow.querySelector('select').onchange = (e) => loadKyc(deal.id, role, e.target.value);
    box.appendChild(langRow);
  }

  const actions = document.createElement('div');
  actions.style.cssText = 'display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;';

  const fillBtn = document.createElement('button');
  fillBtn.className = 'btn';
  fillBtn.textContent = data.status === 'draft' ? t('fillForm') : t('viewEditForm');
  fillBtn.onclick = () => { kycFormOpenFor = key; render(); };
  actions.appendChild(fillBtn);

  if(data.generatedFileUrl){
    const viewLink = document.createElement('a');
    viewLink.href = `/api/deals/${deal.id}/kyc/${role}/file`;
    viewLink.target = '_blank';
    viewLink.className = 'btn';
    viewLink.textContent = t('viewDocument');
    actions.appendChild(viewLink);
  }

  if(isStaffView && data.status === 'generated'){
    const sendBtn = document.createElement('button');
    sendBtn.className = 'btn gold';
    sendBtn.textContent = t('sendForSignature');
    sendBtn.onclick = async () => {
      try{
        await apiFetch(`/api/deals/${deal.id}/kyc/${role}/send-for-signature`, { method:'POST' });
        await loadKyc(deal.id, role);
      }catch(e){ alert(e.message); }
    };
    actions.appendChild(sendBtn);
  }

  if(isStaffView && ['draft','generated'].includes(data.status)){
    const resetBtn = document.createElement('button');
    resetBtn.className = 'btn'; resetBtn.style.fontSize = '11px';
    resetBtn.textContent = t('resetFile');
    resetBtn.title = t('resetFileTitle');
    resetBtn.onclick = async () => {
      if(!confirm(t('confirmResetFile'))) return;
      try{
        await apiFetch(`/api/deals/${deal.id}/kyc/${role}`, { method:'DELETE' });
        await loadKyc(deal.id, role);
      }catch(e){ alert(e.message); }
    };
    actions.appendChild(resetBtn);
  }

  if(!isStaffView && data.status === 'sent'){
    const signBtn = document.createElement('button');
    signBtn.className = 'btn gold';
    signBtn.textContent = t('signNow');
    signBtn.onclick = async () => {
      try{
        const { url } = await apiFetch(`/api/deals/${deal.id}/kyc/${role}/signing-url`, { method:'POST' });
        openKycSigningModal(url, deal.id, role);
      }catch(e){ alert(e.message); }
    };
    actions.appendChild(signBtn);
  }

  box.appendChild(actions);

  if(kycFormOpenFor === key){
    box.appendChild(buildKycForm(deal, role, data, isStaffView));
  }

  return box;
}

// Marca visualmente si un campo es obligatorio (*) u opcional — antes no
// había ninguna diferencia visual entre ambos, así que campos que solo
// aplican a mexicanos/residentes (CURP, RFC, domicilio en México) se veían
// igual de "obligatorios" que el resto para un extranjero llenando el form.
function fieldLabelHtml(f){
  if(f.required) return `${escapeHtml(f.label)} <span style="color:var(--oxblood);">*</span>`;
  if(/opcional|optional/i.test(f.label)) return escapeHtml(f.label);
  return `${escapeHtml(f.label)} <span class="field-hint" style="margin:0; display:inline;">${t('optional')}</span>`;
}

function buildKycForm(deal, role, data, isStaffView){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'margin-top:12px; padding:14px; background:var(--stone); border-radius:10px;';
  wrap.innerHTML = `<div class="field-hint" style="margin-top:0;">${escapeHtml(data.label)}</div>`;

  const answers = data.answers || {};
  data.sections.forEach(section => {
    const sTitle = document.createElement('div');
    sTitle.style.cssText = 'font-weight:600; font-size:12.5px; margin:12px 0 6px;';
    sTitle.textContent = section.title;
    wrap.appendChild(sTitle);

    section.fields.forEach(f => {
      const row = document.createElement('div');
      row.style.marginBottom = '8px';
      const val = answers[f.id] || '';
      if(f.type === 'radio'){
        row.innerHTML = `<div class="field-hint" style="margin:0 0 4px;">${fieldLabelHtml(f)}</div>` +
          f.options.map(o => `<label style="display:inline-flex; align-items:center; gap:4px; margin-right:14px; font-size:12.5px;">
            <input type="radio" name="kyc-${f.id}" value="${escapeHtml(o.value)}" ${val===o.value?'checked':''}> ${escapeHtml(o.label)}
          </label>`).join('');
      } else if(f.type === 'textarea'){
        row.innerHTML = `<label style="display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft);">${fieldLabelHtml(f)}
          <textarea data-kyc-field="${f.id}" rows="2">${escapeHtml(val)}</textarea>
        </label>`;
      } else {
        const inputType = f.type === 'date' ? 'date' : (f.type === 'email' ? 'email' : 'text');
        row.innerHTML = `<label style="display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft);">${fieldLabelHtml(f)}
          <input type="${inputType}" data-kyc-field="${f.id}" value="${escapeHtml(val)}" ${f.maxLength?`maxlength="${f.maxLength}"`:''}>
        </label>`;
      }
      wrap.appendChild(row);
    });
  });

  function collectAnswers(){
    const result = {};
    data.sections.forEach(section => section.fields.forEach(f => {
      if(f.type === 'radio'){
        const checked = wrap.querySelector(`input[name="kyc-${f.id}"]:checked`);
        result[f.id] = checked ? checked.value : '';
      } else {
        const el = wrap.querySelector(`[data-kyc-field="${f.id}"]`);
        result[f.id] = el ? el.value.trim() : '';
      }
    }));
    return result;
  }

  const actions = document.createElement('div');
  actions.style.cssText = 'display:flex; gap:8px; margin-top:12px;';
  const lang = (data.templateKey || '').endsWith('-en') ? 'en' : 'es';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn'; saveBtn.textContent = t('saveDraft');
  saveBtn.onclick = async () => {
    try{
      await apiFetch(`/api/deals/${deal.id}/kyc/${role}`, { method:'POST', body: JSON.stringify({ answers: collectAnswers(), lang }) });
      await loadKyc(deal.id, role);
    }catch(e){ alert(e.message); }
  };
  const generateBtn = document.createElement('button');
  generateBtn.className = 'btn primary'; generateBtn.textContent = t('saveGenerateSend');
  generateBtn.onclick = async () => {
    try{
      await apiFetch(`/api/deals/${deal.id}/kyc/${role}`, { method:'POST', body: JSON.stringify({ answers: collectAnswers(), lang }) });
      const result = await apiFetch(`/api/deals/${deal.id}/kyc/${role}/generate`, { method:'POST' });
      kycFormOpenFor = null;
      await loadKyc(deal.id, role);
      if(result.sentForSignature && !isStaffView){
        // Quien acaba de llenar el formulario es quien firma — se abre la
        // firma de una vez, sin que tenga que ir a buscar "Firmar ahora".
        try{
          const { url } = await apiFetch(`/api/deals/${deal.id}/kyc/${role}/signing-url`, { method:'POST' });
          openKycSigningModal(url, deal.id, role);
        }catch(e){ /* si falla, se queda en la sección con el botón "Firmar ahora" como respaldo */ }
      } else if(result.sentForSignature){
        alert(t('alertGeneratedSent'));
      } else if(result.autoSendError){
        alert(t('alertAutoSendFailed', { error: result.autoSendError }));
      }
    }catch(e){ alert(e.message); }
  };
  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn'; closeBtn.textContent = t('close');
  closeBtn.onclick = () => { kycFormOpenFor = null; render(); };
  actions.appendChild(saveBtn); actions.appendChild(generateBtn); actions.appendChild(closeBtn);
  wrap.appendChild(actions);

  return wrap;
}

function openKycSigningModal(url, dealId, role){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed; inset:0; background:rgba(33,22,19,0.55); display:flex; align-items:center; justify-content:center; z-index:1000;';
  overlay.innerHTML = `
    <div style="background:#fff; border-radius:14px; width:min(900px,92vw); height:min(720px,88vh); display:flex; flex-direction:column; overflow:hidden;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 16px; border-bottom:0.5px solid var(--line);">
        <div class="section-title" style="margin:0;">${t('kycSignModalTitle')}</div>
        <button class="btn" id="kyc-sign-modal-close">${t('close')}</button>
      </div>
      <iframe src="${url}" style="flex:1; border:0;"></iframe>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#kyc-sign-modal-close').onclick = () => overlay.remove();

  const onMessage = async (e) => {
    if(e.origin !== window.location.origin) return;
    if(!e.data || e.data.type !== 'docusign-return') return;
    window.removeEventListener('message', onMessage);
    overlay.remove();
    try{
      await apiFetch(`/api/deals/${dealId}/kyc/${role}/status`);
      await loadKyc(dealId, role);
    }catch(err){ alert(err.message); }
  };
  window.addEventListener('message', onMessage);
}

function buildDocItemLi(deal, doc){
  const li = document.createElement('li');
  li.className = 'doc-item';
  // El sub_label ya se muestra como encabezado de grupo en
  // buildDocListForParty — aquí solo el nombre del documento.
  const label = escapeHtml(doc.name);
  const subCheckLabels = SUB_CHECKS_BY_DOC[doc.name] || [];
  const subChecksHtml = subCheckLabels.map(sc => `
    <label style="display:flex; align-items:center; gap:4px; font-size:11px; color:var(--ink-soft); cursor:pointer;">
      <input type="checkbox" class="sub-check" data-label="${escapeHtml(sc)}" ${doc.subChecks[sc]?'checked':''}> ${escapeHtml(sc)}
    </label>`).join('');
  li.innerHTML = `<span class="doc-check ${doc.status==='done'?'done':''}">${doc.status==='done'?'<i class=\"ti ti-check\" aria-hidden=\"true\"></i>':''}</span><span>${label}</span>
    <span style="margin-left:auto; display:flex; align-items:center; gap:8px;">
      ${subChecksHtml}
      ${doc.fileUrl ? `<a href="/api/deals/${deal.id}/documents/${doc.id}/file" target="_blank" class="btn" style="font-size:11px; padding:4px 10px; display:inline-flex; align-items:center; gap:4px;"><i class="ti ti-eye" aria-hidden="true"></i> ${t('viewFile')}</a>` : ''}
      <button type="button" class="btn doc-upload-btn" style="font-size:11px; padding:4px 10px; display:inline-flex; align-items:center; gap:4px;" title="${t('attachDocument')}"><i class="ti ti-upload" aria-hidden="true"></i> ${doc.fileUrl ? t('replaceFile') : t('upload')}</button>
      <input type="file" class="doc-file-input" style="display:none;" accept=".pdf,.jpg,.jpeg,.png,.heic">
    </span>`;
  li.querySelector('.doc-check').onclick = async () => {
    const next = doc.status==='done' ? 'pending' : 'done';
    try{
      await apiFetch(`/api/deals/${deal.id}/documents/${doc.id}`, { method:'PATCH', body: JSON.stringify({status: next}) });
      doc.status = next; render();
    }catch(e){ alert(e.message); }
  };
  li.querySelectorAll('.sub-check').forEach(checkEl => {
    checkEl.onchange = async (e) => {
      const scLabel = checkEl.dataset.label;
      const next = e.target.checked;
      try{
        await apiFetch(`/api/deals/${deal.id}/documents/${doc.id}`, { method:'PATCH', body: JSON.stringify({subChecks: {[scLabel]: next}}) });
        doc.subChecks[scLabel] = next;
      }catch(err){ alert(err.message); e.target.checked = !next; }
    };
  });
  const uploadBtn = li.querySelector('.doc-upload-btn');
  const fileInput = li.querySelector('.doc-file-input');
  uploadBtn.onclick = () => fileInput.click();
  fileInput.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const originalHtml = uploadBtn.innerHTML;
    uploadBtn.disabled = true;
    uploadBtn.innerHTML = `<i class="ti ti-loader-2" aria-hidden="true"></i> ${t('uploading')}`;
    const fd = new FormData();
    fd.append('file', file);
    try{
      await apiUpload(`/api/deals/${deal.id}/documents/${doc.id}/file`, fd);
      await openDeal(deal.id);
    }catch(err){
      alert(err.message);
      uploadBtn.disabled = false;
      uploadBtn.innerHTML = originalHtml;
    }
  };
  return li;
}

// Agrupa el checklist en Vendedores/Compradores — mismo orden en el que
// eventualmente se van a organizar las carpetas de Drive (Propiedad /
// Vendedor / Comprador / Escrow / Notaría), aunque esas dos últimas todavía
// no tienen un checklist de documentos propio en la plataforma.
function buildDocsBySideGrouping(deal){
  const wrap = document.createElement('div');
  [['seller', t('sellers')], ['buyer', t('buyers')]].forEach(([side, label]) => {
    const parties = deal.parties.filter(p => p.side === side);
    if (!parties.length) return;
    const sub = document.createElement('div');
    sub.style.cssText = 'font-family:\'Cormorant Garamond\',serif; font-weight:600; font-size:15px; color:var(--ink-soft); margin:4px 0 8px;';
    sub.textContent = label;
    wrap.appendChild(sub);
    parties.forEach(p => wrap.appendChild(buildDocListForParty(deal, p)));
  });
  return wrap;
}

function buildDocListForParty(deal, party){
  const box = document.createElement('div');
  box.style.marginBottom = '14px';
  const sideLabel = party.side === 'seller' ? t('sellerLabel2') : t('buyerLabel2');
  const h = document.createElement('div');
  h.style.cssText = 'font-weight:500; font-size:13px; color:var(--ink-soft); margin-bottom:6px; display:flex; align-items:center; gap:8px;';
  const hLabel = document.createElement('span');
  hLabel.textContent = `${party.name} (${sideLabel} · ${TYPE_LABEL[party.partyType]})`;
  h.appendChild(hLabel);
  if(['admin','agent','lawyer'].includes(currentUser.role) && party.linkedUser){
    const remindBtn = document.createElement('button');
    remindBtn.className = 'btn'; remindBtn.style.cssText = 'font-size:11px; padding:3px 10px;';
    remindBtn.textContent = t('remindDocuments');
    remindBtn.onclick = async () => {
      remindBtn.disabled = true;
      try{
        const r = await apiFetch(`/api/deals/${deal.id}/parties/${party.id}/remind`, { method:'POST' });
        remindBtn.textContent = t('sentCount', { count: r.count });
      }catch(e){ alert(e.message); remindBtn.disabled = false; }
    };
    h.appendChild(remindBtn);
  }
  box.appendChild(h);

  if(party.partyType !== 'individual' && !party.ownershipMode){
    const warn = document.createElement('div');
    warn.className = 'field-hint'; warn.style.cssText = 'margin:0 0 8px; color:var(--oxblood);';
    warn.textContent = t('incompleteEntityWarning');
    box.appendChild(warn);
  }

  // Subagrupa por sub_label — cada grupo distinto (un socio, el trust)
  // corresponde a la subcarpeta propia que le tocaría dentro de la carpeta
  // de esta parte en Drive; los documentos sin sub_label son los de la
  // propia entidad/persona (party.name), sin subcarpeta.
  const docs = deal.documents.filter(d => d.partyId === party.id);
  const groups = [];
  const groupIndex = {};
  docs.forEach(doc => {
    const key = doc.subLabel || '';
    if (!(key in groupIndex)) { groupIndex[key] = groups.length; groups.push({ label: doc.subLabel, docs: [] }); }
    groups[groupIndex[key]].docs.push(doc);
  });
  groups.forEach(g => {
    if (g.label) {
      const gLabel = document.createElement('div');
      gLabel.style.cssText = 'font-size:12px; font-weight:500; color:var(--ink-faint); margin:8px 0 2px;';
      gLabel.textContent = g.label;
      box.appendChild(gLabel);
    }
    const ul = document.createElement('ul');
    ul.className = 'doc-list';
    g.docs.forEach(doc => ul.appendChild(buildDocItemLi(deal, doc)));
    box.appendChild(ul);
  });
  return box;
}

// Documentos de LA PROPIEDAD (Escritura pública, Predial) — una sola vez

function buildTaskList(deal){
  const ul = document.createElement('div');
  const pct = pctTasks(deal);
  const pctRow = document.createElement('div');
  pctRow.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--ink-soft);">
      <span>${t('closingProgress')}</span><span style="font-weight:600; color:var(--oxblood-deep);">${pct}%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
  `;
  ul.appendChild(pctRow);
  if(deal.dueDiligenceEndDate){
    const today = new Date().toISOString().slice(0,10);
    const ddOver = today >= deal.dueDiligenceEndDate;
    const ddBanner = document.createElement('div');
    ddBanner.className = 'field-hint';
    ddBanner.style.cssText = `margin:8px 0 0; padding:6px 10px; border-radius:8px; background:${ddOver?'var(--jade-soft)':'var(--stone)'}; color:${ddOver?'var(--jade)':'var(--ink-soft)'};`;
    ddBanner.textContent = ddOver
      ? t('ddEndedBanner', { date: deal.dueDiligenceEndDate })
      : t('ddPendingBanner', { date: deal.dueDiligenceEndDate });
    ul.appendChild(ddBanner);
  }
  deal.tasks.forEach((task, idx) => {
    const row = document.createElement('div');
    row.className = 'task-row';
    const cls = task.status==='done'?'done':(task.status==='progress'?'progress':'');
    row.innerHTML = `
      <div class="task-stamp ${cls}">${task.status==='done'?'<i class=\"ti ti-check\" aria-hidden=\"true\"></i>':(idx+1)}</div>
      <div style="flex:1;">
        <div class="task-en">${escapeHtml(task.en)}${task.sign?`<span class="sign-tag">${t('requiresSignature')}</span>`:''}</div>
        <div class="task-es">${escapeHtml(task.es)}</div>
      </div>
    `;
    row.querySelector('.task-stamp').onclick = async () => {
      const order=['pending','progress','done'];
      const next = order[(order.indexOf(task.status)+1)%order.length];
      try{
        await apiFetch(`/api/deals/${deal.id}/tasks/${task.id}`, { method:'PATCH', body: JSON.stringify({status: next}) });
        task.status = next; render();
      }catch(e){ alert(e.message); }
    };
    ul.appendChild(row);
  });
  return ul;
}
