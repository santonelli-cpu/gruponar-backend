          <input type="text" id="inv-direct-password" readonly>
        </label>
        <button class="btn" id="inv-direct-copy" style="align-self:flex-end;">${t('copy')}</button>
      </div>
      <div class="field-hint" style="margin:6px 0 0;">${t('registerDirectHint')}</div>
    </div>
    <div class="gate-error" id="inv-error"></div>
  `;
  const targetSel = card.querySelector('#inv-target');
  const nameInput = card.querySelector('#inv-name');
  const registerDirectBtn = card.querySelector('#inv-register-direct');
  const agencyFieldsSpan = card.querySelector('#inv-agency-fields');
  const agencySelect = card.querySelector('#inv-agency');
  const agencyOtherInput = card.querySelector('#inv-agency-other');
  agencySelect.onchange = () => { agencyOtherInput.style.display = agencySelect.value === 'Otro' ? '' : 'none'; };
  const updateAgencyVisibility = () => {
    // La agencia (LPR Luxury, etc.) solo aplica a agente de venta — un
    // abogado externo no tiene una.
    agencyFieldsSpan.style.display = targetSel.value === 'agent' ? '' : 'none';
  };
  targetSel.onchange = updateAgencyVisibility;
  updateAgencyVisibility();

  card.querySelector('#inv-generate').onclick = async () => {
    const target = targetSel.value;
    const name = nameInput.value.trim();
    const email = card.querySelector('#inv-email').value.trim();
    const errEl = card.querySelector('#inv-error');
    errEl.textContent = '';
    if (!name || !email) { errEl.textContent = t('errNameOrEmail'); return; }
    const body = { dealId: deal.id, roleInDeal: target, name, email, representsSide: card.querySelector('#inv-represents').value || null };
    try {
      const { url, emailSent, emailError } = await apiFetch('/api/invites', { method: 'POST', body: JSON.stringify(body) });
      const linkInput = card.querySelector('#inv-link');
      linkInput.value = window.location.origin + url;
      const statusEl = card.querySelector('#inv-email-status');
      statusEl.textContent = emailSent
        ? t('inviteEmailSent', { email })
        : t('inviteEmailFailed', { error: emailError || t('resendNotConfigured') });
      statusEl.style.color = emailSent ? 'var(--jade)' : 'var(--oxblood)';
      card.querySelector('#inv-result').style.display = 'block';
    } catch(e) {
      errEl.textContent = e.message;
    }
  };
  card.querySelector('#inv-copy').onclick = () => {
    const linkInput = card.querySelector('#inv-link');
    linkInput.select();
    navigator.clipboard.writeText(linkInput.value);
  };
  registerDirectBtn.onclick = async () => {
    const target = targetSel.value;
    const name = nameInput.value.trim();
    const email = card.querySelector('#inv-email').value.trim();
    const errEl = card.querySelector('#inv-error');
    errEl.textContent = '';
    if (!name || !email) { errEl.textContent = t('errNameOrEmail'); return; }
    try {
      const agency = target === 'agent' ? agencySelect.value : '';
      const agencyOther = target === 'agent' ? agencyOtherInput.value.trim() : '';
      if(target === 'agent' && (!agency || (agency === 'Otro' && !agencyOther))){ errEl.textContent = t('registerErrAgency'); return; }
      const representsSide = card.querySelector('#inv-represents').value || null;
      const { temporaryPassword, welcomeEmailSent, welcomeEmailError } = await apiFetch(`/api/deals/${deal.id}/agents/register`, {
        method: 'POST', body: JSON.stringify({ name, email, role: target, agency, agencyOther, representsSide })
      });
      let doneLabel = t('registerDirectDone');
      doneLabel += welcomeEmailSent ? t('welcomeEmailSentNote') : t('welcomeEmailFailedNote', { error: welcomeEmailError || '' });
      card.querySelector('#inv-direct-result-label').textContent = doneLabel;
      card.querySelector('#inv-direct-password-row').style.display = '';
      card.querySelector('#inv-direct-password').value = temporaryPassword || '';
      card.querySelector('#inv-direct-result').style.display = 'block';
      await openDeal(deal.id);
    } catch(e) {
      errEl.textContent = e.message;
    }
  };
  card.querySelector('#inv-direct-copy').onclick = () => {
    const pwInput = card.querySelector('#inv-direct-password');
    pwInput.select();
    navigator.clipboard.writeText(pwInput.value);
  };
  return card;
}

// Fila de una sola persona (agente / abogado interno / abogado externo)
// ligada a la operación — compartida entre la tarjeta principal y el modal
// de "Compartir". `opts.removable` muestra el botón de quitar; una fila
// "isCreator" (el abogado que creó la operación, con acceso vía
// deals.created_by, ver GET /api/deals/:id) nunca es removible desde aquí
// porque no tiene fila propia en deal_parties que borrar.
function buildPersonRow(dealId, a, opts){
  opts = opts || {};
  const row = document.createElement('div');
  row.style.cssText = 'display:flex; align-items:center; gap:12px; padding:8px 2px;' + (opts.bordered !== false ? ' border-bottom:0.5px solid var(--line);' : '');
  const isAgentLike = ['agent', 'external_lawyer'].includes(a.role);
  row.innerHTML = `
    ${avatarHtml(a, 36)}
    <span style="flex:1; min-width:0;">
      <div style="font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
        <span style="overflow:hidden; text-overflow:ellipsis;">${escapeHtml(a.name)}</span>
        ${roleChipHtml(a.role)}
        ${a.status==='pending' ? `<span class="badge" style="background:var(--oxblood-soft); color:var(--oxblood); margin:0; font-size:10px;">${t('pendingApproval')}</span>` : ''}
        ${a.isCreator ? `<span class="field-hint" style="margin:0;">· ${t('personCreatedDeal')}</span>` : ''}
      </div>
      <div class="field-hint" style="margin:1px 0 0;">${escapeHtml(a.email)}${a.agency ? ' · ' + escapeHtml(a.agency) : ''}</div>
    </span>
  `;
  const controls = document.createElement('span');
  controls.style.cssText = 'display:flex; align-items:center; gap:6px; flex-shrink:0;';
  if(isAgentLike){
    const sel = document.createElement('select');
    sel.style.cssText = 'font-size:11.5px; padding:2px 6px;';
    sel.innerHTML = `
      <option value="" ${!a.representsSide?'selected':''}>${t('representsUnset')}</option>
      <option value="seller" ${a.representsSide==='seller'?'selected':''}>${t('representsSeller')}</option>
      <option value="buyer" ${a.representsSide==='buyer'?'selected':''}>${t('representsBuyer')}</option>
    `;
    sel.onchange = async () => {
      try{
        await apiFetch(`/api/deals/${dealId}/agents/${a.userId}`, { method:'PATCH', body: JSON.stringify({ representsSide: sel.value || null }) });
        clearKycCacheForDeal(dealId);
        await openDeal(dealId);
        if(opts.onChange) opts.onChange();
      }catch(err){ showToast(err.message, 'error'); sel.value = a.representsSide || ''; }
    };
    controls.appendChild(sel);
  }
  if(opts.removable && a.dealPartyId !== null && a.dealPartyId !== undefined){
    const rmBtn = document.createElement('button');
    rmBtn.className = 'btn'; rmBtn.title = t('removeFromDeal');
    rmBtn.style.cssText = 'font-size:12px; padding:4px 8px; line-height:1;';
    rmBtn.innerHTML = `<i class="ti ti-x" aria-hidden="true"></i>`;
    rmBtn.onclick = async () => {
      try{
        await apiFetch(`/api/deals/${dealId}/agents/${a.userId}`, { method:'DELETE' });
        delete availableAgentsCache[dealId];
        clearKycCacheForDeal(dealId);
        await openDeal(dealId);
        if(opts.onChange) opts.onChange();
      }catch(e){ showToast(e.message, 'error'); }
    };
    controls.appendChild(rmBtn);
  }
  row.appendChild(controls);
  return row;
}

// Sección unificada de personas en la operación (agentes, abogados internos
// y externos en un solo lugar, con distinción por chip de rol en vez de
// permisos tipo "editor/viewer") — agregar gente pasa por un modal estilo
// Google Drive (buscar por nombre, agregar al toque) en vez de un dropdown
// gigante, ver openAddPeopleModal.
function buildDealAgentsSection(deal){
  const card = document.createElement('div');
  card.className = 'card';

  const header = document.createElement('div');
  header.style.cssText = 'display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;' + (deal.agents && deal.agents.length ? ' margin-bottom:6px;' : '');
  header.innerHTML = `<div class="field-hint" style="margin:0;">${t('dealPeopleHint')}</div>`;
  const shareBtn = document.createElement('button');
  shareBtn.className = 'btn primary';
  shareBtn.style.cssText = 'font-size:12px; display:flex; align-items:center; gap:6px; flex-shrink:0;';
  shareBtn.innerHTML = `<i class="ti ti-user-plus" aria-hidden="true"></i> ${t('sharePeopleAdd')}`;
  shareBtn.onclick = () => openAddPeopleModal(deal.id);
  header.appendChild(shareBtn);
  card.appendChild(header);

  if(!deal.agents || !deal.agents.length){
    const hint = document.createElement('div');
    hint.className = 'field-hint'; hint.style.margin = '10px 0 0';
    hint.textContent = t('noAgentsInDeal');
    card.appendChild(hint);
  } else {
    deal.agents.forEach((a, i) => card.appendChild(buildPersonRow(deal.id, a, { removable: true, bordered: i < deal.agents.length - 1 })));
  }

  return card;
}

// Modal estilo "Compartir" de Google Drive: buscar entre agentes/abogados
// que YA tienen cuenta (filtro en cliente sobre availableAgentsCache, sin
// endpoint nuevo) y agregarlos al toque; además, un link secundario para
// invitar a alguien que todavía no tiene cuenta (reusa buildInviteForm).
// Se monta fuera de #body (como openKycSigningModal) para sobrevivir a los
// render() que dispara cada alta/baja vía openDeal.
function openAddPeopleModal(dealId){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed; inset:0; background:rgba(33,22,19,0.55); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;';
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay) close(); };

  let query = '';
  let showInvite = false;

  function close(){ overlay.remove(); }

  function renderModal(){
    const deal = deals.find(d => d.id === dealId);
    if(!deal){ close(); return; }
    if(availableAgentsCache[dealId] === undefined) loadAvailableAgents(dealId);
    const avail = availableAgentsCache[dealId];

    const q = query.trim().toLowerCase();
    const results = (q && Array.isArray(avail)) ? avail.filter(a =>
      a.name.toLowerCase().includes(q) || (a.email && a.email.toLowerCase().includes(q))
    ).slice(0, 8) : [];

    overlay.innerHTML = '';
    const modal = document.createElement('div');
    modal.style.cssText = 'background:var(--stone-card); border-radius:14px; width:min(480px,94vw); max-height:min(640px,88vh); display:flex; flex-direction:column; overflow:hidden; box-shadow:0 12px 40px rgba(33,22,19,0.3);';
    modal.onclick = (e) => e.stopPropagation();
    modal.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:0.5px solid var(--line); flex-shrink:0;">
        <div class="section-title" style="margin:0;">${t('sharePeopleTitle')}</div>
        <button class="btn primary" id="people-modal-done" style="font-size:12px;">${t('done')}</button>
      </div>
      <div style="padding:14px 18px 4px; flex-shrink:0;">
        <input type="text" id="people-search-input" placeholder="${t('sharePeopleSearchPh')}" autocomplete="off" style="width:100%; box-sizing:border-box;">
      </div>
      <div id="people-search-results" style="padding:0 10px; flex-shrink:0;"></div>
      <div id="people-invite-toggle-wrap" style="padding:6px 18px; flex-shrink:0;"></div>
      <div style="padding:10px 18px 4px; font-size:11px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; color:var(--ink-faint); flex-shrink:0;">${t('sharePeopleAccessTitle')}</div>
      <div id="people-access-list" style="padding:0 18px 16px; overflow-y:auto; flex:1;"></div>
    `;
    overlay.appendChild(modal);

    modal.querySelector('#people-modal-done').onclick = close;

    const searchInput = modal.querySelector('#people-search-input');
    searchInput.value = query;
    searchInput.oninput = (e) => {
      query = e.target.value;
      const cursor = e.target.selectionStart;
      renderModal();
      // renderModal() reconstruye todo el contenido del modal (incluido este
      // input) — sin esto, el foco y la posición del cursor se pierden en
      // cada tecla mientras buscas (mismo patrón que #clients-search). Se
      // busca por `overlay` (persiste entre renders) y no por `modal` (se
      // recrea en cada renderModal(), la referencia de este closure queda
      // obsoleta apenas overlay.innerHTML se limpia arriba).
      const el = overlay.querySelector('#people-search-input');
      if(el){ el.focus(); el.setSelectionRange(cursor, cursor); }
    };
    searchInput.focus();
    searchInput.setSelectionRange(query.length, query.length);

    const resultsEl = modal.querySelector('#people-search-results');
    if(avail === undefined){
      resultsEl.innerHTML = q ? `<div class="field-hint" style="margin:6px 4px;">${t('loading')}</div>` : '';
    } else if(avail.error){
      resultsEl.innerHTML = `<div class="field-hint" style="margin:6px 4px;">${escapeHtml(avail.error)}</div>`;
    } else if(q && results.length){
      results.forEach(a => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; align-items:center; gap:10px; padding:7px 8px; cursor:pointer; border-radius:8px;';
        row.onmouseenter = () => row.style.background = 'var(--stone)';
        row.onmouseleave = () => row.style.background = '';
        row.innerHTML = `
          ${avatarHtml(a, 32)}
          <span style="flex:1; min-width:0;">
            <div style="font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(a.name)}</div>
            <div class="field-hint" style="margin:0;">${escapeHtml(a.email)}</div>
          </span>
          ${roleChipHtml(a.role)}
        `;
        row.onclick = async () => {
          try{
            await apiFetch(`/api/deals/${dealId}/agents`, { method:'POST', body: JSON.stringify({ userId: a.id, representsSide: null }) });
            delete availableAgentsCache[dealId];
            clearKycCacheForDeal(dealId);
            query = '';
            await openDeal(dealId);
            renderModal();
          }catch(e){ showToast(e.message, 'error'); }
        };
        resultsEl.appendChild(row);
      });
    } else if(q){
      resultsEl.innerHTML = `<div class="field-hint" style="margin:6px 4px;">${t('noAvailableAgents')}</div>`;
    } else {
      resultsEl.innerHTML = '';
    }

    const inviteWrap = modal.querySelector('#people-invite-toggle-wrap');
    if(showInvite){
      const toggle = document.createElement('button');
      toggle.className = 'btn'; toggle.style.fontSize = '11.5px'; toggle.style.marginBottom = '8px';
      toggle.textContent = t('sharePeopleInviteHide');
      toggle.onclick = () => { showInvite = false; renderModal(); };
      inviteWrap.appendChild(toggle);
      inviteWrap.appendChild(buildInviteForm(deal));
    } else {
      const toggle = document.createElement('button');
      toggle.className = 'btn'; toggle.style.fontSize = '11.5px';
      toggle.innerHTML = `<i class="ti ti-mail" aria-hidden="true"></i> ${t('sharePeopleInviteShow')}`;
      toggle.onclick = () => { showInvite = true; renderModal(); };
      inviteWrap.appendChild(toggle);
    }

    const accessList = modal.querySelector('#people-access-list');
    if(!deal.agents || !deal.agents.length){
      accessList.innerHTML = `<div class="field-hint" style="margin:4px 0;">${t('noAgentsInDeal')}</div>`;
    } else {
      deal.agents.forEach((a, i) => accessList.appendChild(buildPersonRow(dealId, a, {
        removable: true, bordered: i < deal.agents.length - 1, onChange: renderModal
      })));
    }
  }

  renderModal();

  const onKeydown = (e) => { if(e.key === 'Escape') close(); };
  window.addEventListener('keydown', onKeydown);
  const observer = new MutationObserver(() => {
    if(!document.body.contains(overlay)){ window.removeEventListener('keydown', onKeydown); observer.disconnect(); }
  });
  observer.observe(document.body, { childList: true });
}

const CONTRACT_STATUS_LABEL = KYC_STATUS_LABEL;

// Reemplaza la vieja exportación de JSON por un sistema real de machotes:
// el admin/abogado sube el .docx de la operación (con placeholders
// {{CLAVE}} ya escritos en el texto), la plataforma detecta solos los
// campos a llenar (sin JSON de definición a mano), y desde aquí mismo se
// genera/descarga el .docx, se ve el PDF, y se manda a firma electrónica.
function buildContractSection(deal, isStaffView){
  const box = document.createElement('div');
  const data = contractCache[deal.id];
  if(data === undefined){
    box.innerHTML = `<div class="field-hint" style="margin:0;">${t('loading')}</div>`;
    loadContract(deal.id);
    return box;
  }
  if(data.error){
    box.innerHTML = `<div class="field-hint" style="margin:0;">${escapeHtml(data.error)}</div>`;
    return box;
  }

  const statusLabel = CONTRACT_STATUS_LABEL[data.status] || data.status;
  box.innerHTML = `<div style="font-weight:500; font-size:13px;">${t('contractPromiseShort')} <span class="badge" style="margin-left:6px; background:var(--stone); border:0.5px solid var(--line); color:var(--ink-soft);">${escapeHtml(statusLabel)}</span></div>`;

  if(!isStaffView){
    // Comprador/vendedor: solo ver el contrato ya preparado + firmar cuando
    // se envíe — nunca ven el machote en blanco ni los campos de captura.
    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;';
    if(data.hasDocument){
      const viewLink = document.createElement('a');
      viewLink.href = `/api/deals/${deal.id}/contract/file?format=pdf`;
      viewLink.target = '_blank';
      viewLink.className = 'btn';
      viewLink.textContent = t('viewContract');
      actions.appendChild(viewLink);
    } else {
      const hint = document.createElement('div');
      hint.className = 'field-hint'; hint.style.margin = '0';
      hint.textContent = t('coordinatorPreparing');
      actions.appendChild(hint);
    }
    if(data.status === 'sent'){
      const sentHint = document.createElement('span');
      sentHint.className = 'field-hint'; sentHint.style.cssText = 'margin:0; display:flex; align-items:center;';
      sentHint.textContent = t('checkEmailToSign');
      actions.appendChild(sentHint);
    }
    box.appendChild(actions);
    return box;
  }

  // --- Vista de admin/abogado ---
  const tplRow = document.createElement('div');
  tplRow.style.cssText = 'margin-top:8px; display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap;';
  const templates = data.templates || [];
  tplRow.innerHTML = `
    <label style="display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft); min-width:220px;">${t('template')}
      <select id="ct-template">
        <option value="">${t('selectTemplate')}</option>
        ${templates.map(tpl => `<option value="${tpl.id}" ${data.selectedTemplateId===tpl.id?'selected':''}>${escapeHtml(tpl.label)}</option>`).join('')}
      </select>
    </label>
    <button class="btn" id="ct-upload-toggle" style="font-size:12px;">${t('uploadNewTemplate')}</button>
    ${data.selectedTemplateId ? `<button class="btn" id="ct-delete" style="font-size:12px;" title="${t('deleteTemplateTitle')}"><i class="ti ti-trash" aria-hidden="true"></i> ${t('deleteCurrentTemplate')}</button>` : ''}
  `;
  box.appendChild(tplRow);
  tplRow.querySelector('#ct-template').onchange = async (e) => {
    const templateId = Number(e.target.value) || null;
    if(!templateId) return;
    try{
      await apiFetch(`/api/deals/${deal.id}/contract`, { method:'POST', body: JSON.stringify({ templateId }) });
      await loadContract(deal.id);
    }catch(err){ showToast(err.message, 'error'); }
  };
  const deleteBtn = tplRow.querySelector('#ct-delete');
  if(deleteBtn){
    deleteBtn.onclick = async () => {
      if(!await confirmDialog(t('confirmDeleteTemplate'), { danger: true })) return;
      try{
        await apiFetch(`/api/contract-templates/${data.selectedTemplateId}`, { method:'DELETE' });
        await loadContract(deal.id);
      }catch(err){ showToast(err.message, 'error'); }
    };
  }

  const uploadBox = document.createElement('div');
  uploadBox.style.cssText = 'display:none; margin-top:8px; padding:10px; background:var(--stone); border-radius:8px;';
  uploadBox.innerHTML = `
    <div class="field-hint" style="margin-top:0;">${t('uploadTemplateHint', { scenario: SCENARIOS[deal.scenario].labelShort })}</div>
    <div class="form-row">
      <label style="flex:1;">${t('templateName')} <input type="text" id="ct-new-label" placeholder="${t('templateNamePh')}"></label>
      <label>${t('docxFile')} <input type="file" id="ct-new-file" accept=".docx"></label>
    </div>
    <button class="btn primary" id="ct-new-save">${t('upload')}</button>
    <div class="gate-error" id="ct-upload-error"></div>
  `;
  box.appendChild(uploadBox);
  tplRow.querySelector('#ct-upload-toggle').onclick = () => {
    uploadBox.style.display = uploadBox.style.display === 'none' ? 'block' : 'none';
  };
  uploadBox.querySelector('#ct-new-save').onclick = async () => {
    const label = uploadBox.querySelector('#ct-new-label').value.trim();
    const file = uploadBox.querySelector('#ct-new-file').files[0];
    const errEl = uploadBox.querySelector('#ct-upload-error');
    errEl.textContent = '';
    if(!label || !file){ errEl.textContent = t('errNameOrFile'); return; }
    const fd = new FormData();
    fd.append('scenario', deal.scenario);
    fd.append('label', label);
    fd.append('file', file);
    try{
      await apiUpload('/api/contract-templates', fd);
      await loadContract(deal.id);
    }catch(err){ errEl.textContent = err.message; }
  };

  if(!data.selectedTemplateId){
    return box;
  }

  const schema = data.schema;
  const smartValues = data.smartValues || {};
  const fieldsWrap = document.createElement('div');
  fieldsWrap.style.cssText = 'margin-top:12px; padding:14px; background:var(--stone); border-radius:10px;';

  if(schema){
    fieldsWrap.innerHTML = `<div class="field-hint" style="margin-top:0;">Fechas, escrow, nombres de las partes y nombre de la propiedad salen solos de la operación — abajo solo lo que de verdad cambia por contrato.</div>`;

    function fieldInputHtml(field, value){
      const v = value === undefined || value === null ? '' : value;
      if(field.type === 'select'){
        return `<select data-field="${field.id}">${field.options.map(o=>`<option value="${o.value}" ${String(v)===String(o.value)?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}</select>`;
      }
      if(field.type === 'textarea'){
        return `<textarea data-field="${field.id}" rows="2" style="resize:vertical;">${escapeHtml(v)}</textarea>`;
      }
      if(field.type === 'date'){
        return `<input type="date" data-field="${field.id}" value="${escapeHtml(v)}">`;
      }
      if(field.type === 'money'){
        return `<input type="number" step="0.01" min="0" data-field="${field.id}" value="${escapeHtml(v)}" placeholder="0.00">`;
      }
      return `<input type="text" data-field="${field.id}" value="${escapeHtml(v)}">`;
    }

    schema.sections.forEach(section => {
      const sec = document.createElement('div');
      sec.style.cssText = 'margin-bottom:16px;';
      sec.innerHTML = `<div style="font-weight:500; font-size:12.5px; margin-bottom:6px;">${escapeHtml(section.title)}</div>${section.hint ? `<div class="field-hint" style="margin:0 0 8px;">${escapeHtml(section.hint)}</div>` : ''}`;

      if(section.repeatable){
        const rowsWrap = document.createElement('div');
        rowsWrap.dataset.section = section.key;
        sec.appendChild(rowsWrap);

        function addRow(rowValues){
          const row = document.createElement('div');
          row.className = 'contract-repeat-row';
          row.style.cssText = 'display:flex; gap:8px; align-items:center; margin-bottom:6px;';

      } else {

        grid.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:8px;';

              </select>

                ${f.otherFields.map(of => `<label style="display:flex; flex-direction:column; gap:2px;">${escapeHtml(of.label)}${fieldInputHtml(of, smartValues[of.id])}</label>`).join('')}
              </div>`;
            const selectEl = wrap.querySelector('select');

            selectEl.onchange = () => { otherWrap.style.display = selectEl.value === 'otro' ? 'flex' : 'none'; };
            grid.appendChild(wrap);
          } else {

        sec.appendChild(grid);
        sec._collect = () => {
          const rowVal = {};
          section.fields.forEach(f => {

            if(el) rowVal[f.id] = el.value.trim();
            if(f.otherFields){

      fieldsWrap._sections = fieldsWrap._sections || [];
      fieldsWrap._sections.push(sec);

    });
  } else {
    fieldsWrap.innerHTML = `
      <div class="field-hint" style="margin-top:0; color:var(--ink);">${t('noFieldsTitle')}</div>

  function collectValues(){

  const actions = document.createElement('div');

  const genDownloadBtn = document.createElement('button');

      await apiFetch(`/api/deals/${deal.id}/contract`, { method:'POST', body: JSON.stringify({ smartValues: collectValues() }) });

    }catch(e){ showToast(e.message, 'error'); }
  };
  actions.appendChild(genDownloadBtn);

  if(data.hasDocument){
    const viewLink = document.createElement('a');
    viewLink.href = `/api/deals/${deal.id}/contract/file?format=pdf`;
    viewLink.target = '_blank';
    viewLink.className = 'btn';
    viewLink.textContent = t('viewPdf');
    actions.appendChild(viewLink);
  }

  if(data.status === 'generated'){
    const sendBtn = document.createElement('button');
    sendBtn.className = 'btn gold'; sendBtn.textContent = t('sendForSignature');
    sendBtn.onclick = () => withButtonLoading(sendBtn, async () => {
      try{
        await apiFetch(`/api/deals/${deal.id}/contract/send-for-signature`, { method:'POST' });
        await loadContract(deal.id);
      }catch(e){ showToast(e.message, 'error'); }
    });
    actions.appendChild(sendBtn);
  }

  const uploadSignedContractBtn = document.createElement('button');
  uploadSignedContractBtn.className = 'btn'; uploadSignedContractBtn.style.fontSize = '11px';
  uploadSignedContractBtn.title = t('uploadSignedContractTitle');
  uploadSignedContractBtn.innerHTML = `<i class="ti ti-upload" aria-hidden="true"></i> ${t('uploadSignedContract')}`;
  const uploadSignedContractInput = document.createElement('input');
  uploadSignedContractInput.type = 'file'; uploadSignedContractInput.accept = '.pdf'; uploadSignedContractInput.style.display = 'none';
  uploadSignedContractBtn.onclick = () => uploadSignedContractInput.click();

    const original = uploadSignedContractBtn.innerHTML;
    uploadSignedContractBtn.disabled = true; uploadSignedContractBtn.innerHTML = `<i class="ti ti-loader-2" aria-hidden="true"></i> ${t('uploading')}`;
    const fd = new FormData(); fd.append('file', file);
    try{
      await apiUpload(`/api/deals/${deal.id}/contract/upload-signed`, fd);
      await loadContract(deal.id);
    }catch(err){ showToast(err.message, 'error'); uploadSignedContractBtn.disabled = false; uploadSignedContractBtn.innerHTML = original; }
  };
  actions.appendChild(uploadSignedContractBtn);
  actions.appendChild(uploadSignedContractInput);

  box.appendChild(actions);

  return box;
}

// ---------- PORTAL ----------

// Reduce las ~12-15 tareas detalladas del tracker a 5 etapas de alto nivel
// (igual que el mockup) — funciona para las 4 variantes de escenario porque
// todas comparten la misma tarea inicial ("Purchase agreement signed") y
// las mismas 3 finales (borrador de escritura, firma, entrega en notaría),
// sin importar cuántas tareas intermedias tenga cada una.
const CLOSING_STAGE_KEYS = ['stageOfferAccepted','stageDueDiligence','stageNotaryClosing','stageReadyToSign','stageClosed'];
function closingStages(deal){
  const n = deal.tasks.length;
  if(n < 5) return null;
  const b1 = 1, b2 = Math.min(5, n-2), b3 = n-2, b4 = n-1;
  const ranges = [[0,b1],[b1,b2],[b2,b3],[b3,b4],[b4,n]];
  const stages = ranges.map((r,i) => {
    const slice = deal.tasks.slice(r[0], r[1]);
    return { key: CLOSING_STAGE_KEYS[i], done: slice.length > 0 && slice.every(t=>t.status==='done') };
  });
  if(deal.status === 'completed') stages.forEach(s => { s.done = true; });
  return stages;
}
function buildClosingStepper(deal){
  const stages = closingStages(deal);
  if(!stages) return null;
  const currentIdx = stages.findIndex(s=>!s.done);
  const wrap = document.createElement('div');
  wrap.className = 'stepper';
  stages.forEach((s, i) => {
    const step = document.createElement('div');
    step.className = 'step' + (s.done ? ' done' : '') + (i === currentIdx ? ' current' : '');
    step.innerHTML = `<div class="step-dot">${s.done ? '<i class="ti ti-check" aria-hidden="true"></i>' : (i+1)}</div><span class="step-label">${t(s.key)}</span>`;
    wrap.appendChild(step);
  });
  return wrap;
}

// Documentos/firmas pendientes que le tocan específicamente a ESTA parte
// (no a la operación en general) — respeta las mismas reglas de lado que
// buildPropertyDocsSection/buildNotaryClosingCostsSection (Propiedad es del
// vendedor, Pagos es del comprador) para que "Waiting on you" y el aviso de
// siguiente paso solo cuenten lo que de verdad depende de esta persona.
function pendingItemsForParty(deal, party){
  const uploads = deal.documents.filter(d => d.partyId === party.id && d.status !== 'done').slice();
  if(party.side === 'seller'){
    uploads.push(...deal.documents.filter(d => d.partyId === null && !CLOSING_COSTS_SECTION_DOC_NAMES.includes(d.name) && d.status !== 'done'));
  }
  if(party.side === 'buyer'){
    uploads.push(...deal.documents.filter(d => d.partyId === null && [ESCROW_PAYMENT_PROOF_DOC_NAME, NOTARY_PAYMENT_PROOF_DOC_NAME].includes(d.name) && d.status !== 'done'));
  }
  const signatures = deal.tasks.filter(t => t.sign && t.docusignStatus !== 'completed' && (!t.signSide || t.signSide === party.side));
  return { uploads, signatures };
}

function closingDaysLeftLabel(dateStr){
  const days = Math.ceil((new Date(dateStr + 'T00:00:00') - new Date()) / 86400000);
  if(days < 0) return t('closingOverdue');
  if(days === 0) return t('closingToday');
  return days === 1 ? t('daysToCloseSingular', { days }) : t('daysToClosePlural', { days });
}

// Property value / Closing date / Overall progress / Waiting on you — el
// último tile depende de si estamos viendo la operación como una parte
// específica (comprador/vendedor real, o staff previsualizándolo) o como
// staff "que ve todo", donde "esperando por ti" no aplica y se muestra el
// total de documentos pendientes de la operación en su lugar.
function buildPortalStatGrid(deal, myParty){
  const grid = document.createElement('div');
  grid.className = 'stat-grid';
  const pct = overallPct(deal);
  const totalItems = deal.documents.length + deal.tasks.length;
  const doneItems = deal.documents.filter(d=>d.status==='done').length + deal.tasks.filter(t=>t.status==='done').length;
  let waitingValue, waitingSub;
  if(myParty){
    const { uploads, signatures } = pendingItemsForParty(deal, myParty);
    waitingValue = t('waitingItemsCount', { count: uploads.length + signatures.length });
    const parts = [];
    if(uploads.length) parts.push(t(uploads.length===1 ? 'uploadSingular' : 'uploadsPlural', { count: uploads.length }));
    if(signatures.length) parts.push(t(signatures.length===1 ? 'signatureSingular' : 'signaturesPlural', { count: signatures.length }));
    waitingSub = parts.length ? parts.join(', ') : t('allCaughtUp');
  } else {
    const pendingDocs = deal.documents.filter(d=>d.status!=='done').length;
    waitingValue = t('waitingItemsCount', { count: pendingDocs });
    waitingSub = t('pendingDocsLabel');
  }
  grid.innerHTML = `
    <div class="stat-tile"><p class="label">${t('propertyValueLabel')}</p><p class="value">${deal.currency||'USD'} ${Number(deal.price||0).toLocaleString()}</p></div>
    <div class="stat-tile"><p class="label">${t('closingDateLabel')}</p><p class="value">${deal.closingDate || '—'}</p>${deal.closingDate ? `<p class="sub">${closingDaysLeftLabel(deal.closingDate)}</p>` : ''}</div>
    <div class="stat-tile"><p class="label">${t('overallProgressLabel')}</p><p class="value">${pct}%</p><p class="sub">${t('itemsDoneLabel', { done: doneItems, total: totalItems })}</p></div>
    <div class="stat-tile"><p class="label">${t('waitingOnYouLabel')}</p><p class="value">${waitingValue}</p><p class="sub">${waitingSub}</p></div>
  `;
  return grid;
}

// Un solo aviso con lo más urgente pendiente de ESTA parte — prioriza
// firmas (nadie más puede hacerlo por ellos) sobre subir documentos. Solo
// tiene sentido cuando se ve una parte específica, no en "ve todo" de staff.
// "Te toca a ti" — hasta 3 acciones que dependen del CLIENTE ahora mismo,
// cada una con su botón para brincar directo. Solo cosas realmente
// accionables: firmas que YA le llegaron (sent/delivered — una tarea de
// firma que el equipo aún no manda no es asunto suyo todavía), su KYC
// esperando firma, y documentos suyos por subir. Si no hay nada accionable,
// no se muestra nada: silencio = vas al día.
function buildNextStepCallout(deal, myParty){
  if(!myParty) return null;
  const { uploads, signatures } = pendingItemsForParty(deal, myParty);

  const items = [];
  signatures.filter(task => ['sent', 'delivered'].includes(task.docusignStatus)).forEach(task => {
    items.push({
      label: t('nextStepSignature', { name: lang==='en' ? task.en : task.es }),
      anchor: 'portal-esignature-section', btnLabel: t('signLabel')
    });
  });
  // KYC de mi parte esperando MI firma (si el cache ya lo trae — la sección
  // del portal lo carga sola al entrar, así que casi siempre está).
  const kycData = kycCache[deal.id + '-' + myParty.id + '-escrow'];
  if(kycData && !kycData.error && kycData.status === 'sent'){
    items.push({ label: t('nextStepKycSign'), anchor: 'portal-kyc-section', btnLabel: t('signLabel') });
  }
  uploads.forEach(doc => {
    const isPaymentProof = [ESCROW_PAYMENT_PROOF_DOC_NAME, NOTARY_PAYMENT_PROOF_DOC_NAME].includes(doc.name);
    items.push({
      label: t('nextStepUpload', { name: localizeDocName(doc.name) }),
      anchor: isPaymentProof ? 'portal-closing-costs-section' : (doc.partyId === null ? 'portal-property-section' : 'portal-mydocs-section'),
      btnLabel: t('uploadLabel')
    });
  });

  if(!items.length) return null;
  const expanded = waitingOnYouExpanded[deal.id] === true;
  const visible = expanded ? items : items.slice(0, 3);
  const extra = items.length - 3;
  const box = document.createElement('div');
  box.className = 'callout';
  box.style.flexDirection = 'column';
  box.style.alignItems = 'stretch';
  const head = document.createElement('p');
  head.className = 'callout-text';
  head.style.marginBottom = '8px';
  head.innerHTML = `<b>${t('waitingOnYouTitle', { count: items.length })}</b>`;
  box.appendChild(head);
  visible.forEach(item => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; gap:10px; padding:5px 0;';
    const label = document.createElement('span');
    label.style.cssText = 'font-size:13px;';
    label.textContent = item.label;
    const btn = document.createElement('button');
    btn.className = 'btn primary'; btn.style.cssText = 'white-space:nowrap; font-size:11.5px; padding:4px 12px; flex-shrink:0;';
    btn.textContent = item.btnLabel;
    btn.onclick = () => {
      // Con pestañas, la sección destino puede no estar renderizada — se
      // cambia primero a su pestaña y luego se scrollea al ancla.
      const PORTAL_ANCHOR_TAB = {
        'portal-esignature-section': 'signatures',
        'portal-kyc-section': 'kyc',
        'portal-closing-costs-section': 'costs',
        'portal-property-section': 'property',
        'portal-mydocs-section': 'mydocs'
      };
      const wanted = PORTAL_ANCHOR_TAB[item.anchor];
      if(wanted && portalTab !== wanted){ portalTab = wanted; render(); }
      setTimeout(() => document.getElementById(item.anchor)?.scrollIntoView({ behavior:'smooth', block:'start' }), 60);
    };
    row.appendChild(label); row.appendChild(btn);
    box.appendChild(row);
  });
  if(extra > 0){
    const more = document.createElement('button');
    more.type = 'button';
    more.className = 'field-hint';
    more.style.cssText = 'margin:6px 0 0; background:none; border:0; padding:0; cursor:pointer; text-align:left; font-family:inherit; text-decoration:underline;';
    more.textContent = expanded ? t('waitingOnYouLess') : t('waitingOnYouMore', { count: extra });
    more.onclick = () => { waitingOnYouExpanded[deal.id] = !expanded; render(); };
    box.appendChild(more);
  }
  return box;
}

// Panel de todas MIS operaciones — el equivalente del Dashboard del admin
// para quien no es staff: un comprador con dos propiedades, o un agente

function renderPortal(body){
  // Solo admin/agente/abogado pueden "ver como" cualquier persona — es una
  // vista previa interna. Un comprador/vendedor real siempre ve solo su
  // propia parte (nunca elige, ni ve el checklist de otra persona del mismo
  // lado si hay varias).
  const isPreview = ['admin','agent','lawyer','external_lawyer'].includes(currentUser.role);

  if(isPreview){
    const banner = document.createElement('div');
    banner.className = 'banner';
    banner.innerHTML = `<i class="ti ti-eye" aria-hidden="true"></i> ${t('portalPreviewBanner')}`;
    body.appendChild(banner);
  }

  if(!deals.length){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `<i class="ti ti-folder-search" aria-hidden="true"></i><div>${t('noDealsYetPortal')}</div>`;
    body.appendChild(empty);
    return;
  }

  // Con una sola operación (el caso normal de un comprador/vendedor) no
  // tiene caso mostrar el scroller de tarjetas — se abre directo. Con varias
  // (agente con múltiples clientes, o admin/abogado en vista previa), el
  // scroller queda siempre visible arriba (como en el mockup) para saltar de
  // una a otra sin perder de vista cuál está abierta — no es un modo
  // "dashboard" aparte que reemplaza el detalle, conviven en la misma vista.
  if(portalDealId && !deals.some(d => d.id === portalDealId)) portalDealId = null;
  if(!portalDealId) portalDealId = deals[0].id;

  // Con varias operaciones (agente con varios clientes, comprador con dos
  // propiedades, o admin/abogado en vista previa): primero el panel con
  // todas, y la lista en el menú lateral — como Stripe: siempre visible,
  // sin robarle altura al contenido.
  const multiDeal = deals.length > 1;
  if(multiDeal){
    sidebarGroup(t('yourOperations'));
    sidebarItem({
      label: t('portalAllDeals'), icon: 'ti-layout-dashboard', active: portalView === 'overview',
      onClick: () => { portalView = 'overview'; render(); }
    });
    deals.forEach(d => sidebarItem({
      label: d.property, sub: true, active: portalView === 'deal' && d.id === portalDealId,
      onClick: () => { portalView = 'deal'; portalDealId = d.id; portalRole = 'agent'; portalPartyId = null; render(); }
    }));
    if(portalView === 'overview'){
      buildPortalOverview(body);
      return;
    }
  } else {
    portalView = 'deal';
  }

  const deal = deals.find(d=>d.id===portalDealId);
  const s = SCENARIOS[deal.scenario];

  if(!deal._loaded){
    if(!deal._loading){ deal._loading = true; openDeal(portalDealId); }
    const loading = document.createElement('div');
    loading.className = 'empty';
    loading.innerHTML = `<i class="ti ti-loader-2" aria-hidden="true"></i><div>${t('loadingFile')}</div>`;
    body.appendChild(loading);
    return;
  }

  // Vista previa de staff: elige entre "Agente" (ve todo, como el admin) o
  // una persona específica de esta operación (ve exactamente lo que esa
  // persona vería). Comprador/vendedor real: se resuelve solo, a la parte
  // que tiene ligada su cuenta.
  let myParty = null;
  if(isPreview){
    const roleRow = document.createElement('div');
    roleRow.className = 'card';
    roleRow.innerHTML = `<label>${t('viewAs')} <select id="p-party">
      <option value="agent">${t('agentSeesAll')}</option>
      ${deal.parties.map(p=>`<option value="${p.id}">${escapeHtml(p.name)} (${p.side==='seller'?t('sellerLabel2'):t('buyerLabel2')})</option>`).join('')}
    </select></label>`;
    body.appendChild(roleRow);
    roleRow.querySelector('#p-party').value = portalRole==='agent' ? 'agent' : String(portalPartyId||'');
    roleRow.querySelector('#p-party').onchange = e => {
      if(e.target.value === 'agent'){ portalRole='agent'; portalPartyId=null; }
      else { portalRole='party'; portalPartyId = Number(e.target.value); }
      render();
    };
    if(portalRole === 'party' && portalPartyId) myParty = deal.parties.find(p=>p.id===portalPartyId) || null;
  } else {
    myParty = deal.parties.find(p => p.linkedUserIds.includes(currentUser.id)) || null;
  }

  // "Resumen" es su propia sección (como el "Tu resumen" de Stripe): ahí
  // viven el avance, las cifras y el "te toca a ti". En las demás secciones
  // solo queda una franja con el nombre de la operación, para que lo que
  // fuiste a ver salga de inmediato sin bajar por todo el encabezado.
  const hasSignTasks = deal.tasks.some(tk => tk.sign);
  const pendingSignsCount = deal.tasks.filter(tk => tk.sign && tk.docusignStatus !== 'completed').length;
  const myPendingDocs = myParty ? deal.documents.filter(d => d.partyId === myParty.id && d.status !== 'done').length : 0;
  const allPendingDocs = deal.documents.filter(d => d.status !== 'done').length;
  const waitingCount = myParty
    ? (() => { const { uploads, signatures } = pendingItemsForParty(deal, myParty); return uploads.length + signatures.length; })()
    : 0;
  const TABS = [
    ['overview', t('tabOverview'), waitingCount],
    ...(myParty ? [
      ['mydocs', t('tabYourDocs'), myPendingDocs],
      ['kyc', t('tabYourKyc'), 0]
    ] : [
      ['docs', t('tabDocs'), allPendingDocs]
    ]),
    ['property', t('propertySection'), 0],
    ['costs', t('tabCosts'), 0],
    ['contract', t('contractPromiseShort'), 0],
    ...(hasSignTasks ? [['signatures', t('eSignature'), pendingSignsCount]] : []),
    ['tracker', t('tabTracker'), 0]
  ];
  const tabKey = `${deal.id}|${myParty ? myParty.id : 'all'}`;
  if(portalTabKey !== tabKey){ portalTabKey = tabKey; portalTab = 'overview'; }
  if(!TABS.some(([id]) => id === portalTab)) portalTab = TABS[0][0];
  sidebarSections(TABS, portalTab, (id) => { portalTab = id; render(); });

  const header = document.createElement('div');
  header.className = 'card';
  header.innerHTML = `
    <div class="deal-title" style="font-size:17px;">${escapeHtml(deal.property)}</div>
    <span class="badge ${s.badgeClass}">${s.labelShort}</span>
    <div class="deal-sub" style="margin-top:6px;">${escapeHtml(dealPartyNames(deal,'seller'))} → ${escapeHtml(dealPartyNames(deal,'buyer'))}</div>
  `;
  if(portalTab === 'overview'){
    const stepper = buildClosingStepper(deal);
    if(stepper) header.appendChild(stepper);
    header.appendChild(buildPortalStatGrid(deal, myParty));
    const callout = buildNextStepCallout(deal, myParty);
    if(callout) header.appendChild(callout);
  }
  body.appendChild(header);

  if(portalTab === 'property'){
    const pt = document.createElement('div'); pt.className='section-title'; pt.id='portal-property-section'; pt.textContent=t('propertySection');
    body.appendChild(pt);
    const pcard = document.createElement('div'); pcard.className='card';
    pcard.appendChild(buildPropertyDocsSection(deal, isPreview && !myParty, myParty && myParty.side));
    body.appendChild(pcard);
  }

  if(portalTab === 'costs'){
    const nt = document.createElement('div'); nt.className='section-title'; nt.id='portal-closing-costs-section'; nt.textContent=t('notaryClosingCostsSection');
    body.appendChild(nt);
    const ncard = document.createElement('div'); ncard.className='card';
    ncard.appendChild(buildNotaryClosingCostsSection(deal, isPreview && !myParty, myParty && myParty.side));
    body.appendChild(ncard);
  }

  if(portalTab === 'mydocs' && myParty){
    const secTitle = document.createElement('div'); secTitle.className='section-title'; secTitle.id='portal-mydocs-section'; secTitle.textContent=t('yourDocsChecklist');
    body.appendChild(secTitle);
    const card = document.createElement('div'); card.className='card';
    card.appendChild(buildDocListForParty(deal, myParty, false));
    body.appendChild(card);
  }

  if(portalTab === 'kyc' && myParty){
    const kt = document.createElement('div'); kt.className='section-title'; kt.id='portal-kyc-section'; kt.textContent=t('yourKycFile');
    body.appendChild(kt);
    const kcard = document.createElement('div'); kcard.className='card';
    kcard.appendChild(buildKycSection(deal, myParty, false));
    body.appendChild(kcard);
  }

  if(portalTab === 'docs' && !myParty){
    const secTitle = document.createElement('div'); secTitle.className='section-title'; secTitle.textContent=t('allPartiesChecklist');
    body.appendChild(secTitle);
    const card = document.createElement('div'); card.className='card';
    card.appendChild(buildDocsBySideGrouping(deal, isPreview));
    body.appendChild(card);
  }

  if(portalTab === 'contract'){
    const ct = document.createElement('div'); ct.className='section-title'; ct.textContent=t('contractPromiseShort');
    body.appendChild(ct);
    const ccard = document.createElement('div'); ccard.className='card';
    ccard.appendChild(buildContractSection(deal, false));
    body.appendChild(ccard);
  }

  if(portalTab === 'tracker'){
    const tt = document.createElement('div'); tt.className='section-title'; tt.textContent=t('closingFollowup');
    body.appendChild(tt);
    const tcard = document.createElement('div'); tcard.className='card';
    tcard.appendChild(buildTaskList(deal, isPreview && ['admin','lawyer'].includes(currentUser.role)));
    body.appendChild(tcard);
  }

  if(portalTab === 'signatures'){
    buildSignatureTasksSection(deal, body, false);
  }
}

// Documentos de cierre que requieren firma (escrow agreement, KYC del
// fiduciario, escritura) — llenar/generar/mandar a firma es SOLO de
// admin/abogado interno (canManage), nunca de agente ni abogado externo:
// son documentos legales de la operación, no algo que un facilitador deba
// poder armar por su cuenta. Agente/abogado externo/cliente ven lo mismo
// que un comprador/vendedor: estado + "Firmar ahora" si les toca firmar.
// Se usa tanto en el detalle de Operaciones (admin/abogado) como en Portal
// (donde antes vivía esto en solitario, con permisos más laxos de los que
// debía tener).
function buildSignatureTasksSection(deal, body, isStaffView){
  const canManage = isStaffView && ['admin','lawyer'].includes(currentUser.role);
  const signTasks = deal.tasks.filter(task=>task.sign);
  if(!signTasks.length) return;
  const st = document.createElement('div'); st.className='section-title'; st.id='portal-esignature-section'; st.textContent=t('eSignature');
  body.appendChild(st);
  const scard = document.createElement('div'); scard.className='card';
  scard.innerHTML = `<div class="field-hint" style="margin-top:0;">${canManage ? t('eSignHintStaff') : t('eSignHintClient')}</div>`;
  signTasks.forEach(task => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:0.5px solid var(--line); flex-wrap:wrap; gap:8px;';
    const statusLabel = {not_sent:t('docusignNotSent'), sent:t('docusignSent'), delivered:t('docusignDelivered'), completed:t('docusignCompleted'), declined:t('docusignDeclined'), voided:t('docusignVoided')}[task.docusignStatus] || task.docusignStatus;
    const sideTag = task.signSide ? ` <span class="field-hint" style="margin:0;">(${task.signSide === 'buyer' ? t('buyerLabel2') : t('sellerLabel2')})</span>` : '';
    row.innerHTML = `<span style="font-size:13px;">${escapeHtml(task.en)}${task.en !== task.es ? ` <span class="task-es">(${escapeHtml(task.es)})</span>` : ''}${sideTag}<br><span class="field-hint" style="margin:0;">${t('documentColon')}: ${task.documentOriginalName ? escapeHtml(task.documentOriginalName) : t('notUploaded')} · ${t('docusignStatusColon')}: ${escapeHtml(statusLabel)}</span></span>`;

    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex; gap:8px; align-items:center; flex-wrap:wrap;';

    if(task.documentOriginalName){
      const viewLink = document.createElement('a');
      viewLink.href = `/api/docusign/deals/${deal.id}/tasks/${task.id}/document`;
      viewLink.target = '_blank';
      viewLink.className = 'btn';
      viewLink.style.fontSize = '11px';
      viewLink.innerHTML = `<i class="ti ti-eye" aria-hidden="true"></i> ${t('viewDocument')}`;
      actions.appendChild(viewLink);
    }

    if(canManage){
      const fileInput = document.createElement('input');
      fileInput.type = 'file'; fileInput.accept = '.pdf'; fileInput.style.display = 'none';
      const uploadBtn = document.createElement('button');
      uploadBtn.type = 'button'; uploadBtn.className = 'btn'; uploadBtn.style.fontSize = '11px';
      uploadBtn.title = t('uploadSignedDocTitle');
      uploadBtn.innerHTML = `<i class="ti ti-upload" aria-hidden="true"></i> ${task.documentOriginalName ? t('replaceFile') : t('upload')}`;
      uploadBtn.onclick = () => fileInput.click();
      fileInput.onchange = async (e) => {
        const file = e.target.files[0]; if(!file) return;
        const original = uploadBtn.innerHTML;
        uploadBtn.disabled = true; uploadBtn.innerHTML = `<i class="ti ti-loader-2" aria-hidden="true"></i> ${t('uploading')}`;
        const fd = new FormData(); fd.append('file', file);
        try{
          await apiUpload(`/api/docusign/deals/${deal.id}/tasks/${task.id}/document`, fd);
          await openDeal(deal.id);
        }catch(err){ showToast(err.message, 'error'); uploadBtn.disabled = false; uploadBtn.innerHTML = original; }
      };
      actions.appendChild(uploadBtn);
      actions.appendChild(fileInput);

      // El botón de "generar desde plantilla" solo tiene sentido para la
      // tarea del escrow agreement (docType 'escrow') — para las demás
      // (ej. KYC del fiduciario) no hay plantilla, el documento llega de
      // afuera (banco/notaría) y solo se sube con el input de arriba.
      if(task.docType === 'escrow'){
        const escrowBtn = document.createElement('button');
        escrowBtn.className = 'btn'; escrowBtn.style.fontSize = '11px';
        escrowBtn.textContent = t('generateEscrow');
        escrowBtn.onclick = () => { escrowFormOpenFor = (escrowFormOpenFor === task.id ? null : task.id); render(); };
        actions.appendChild(escrowBtn);
      }

      const sendBtn = document.createElement('button');
      sendBtn.className = 'btn gold';
      sendBtn.textContent = t('sendForSignature');
      sendBtn.disabled = !task.documentOriginalName || task.docusignStatus !== 'not_sent';
      sendBtn.onclick = () => withButtonLoading(sendBtn, async () => {
        try{
          await apiFetch(`/api/docusign/deals/${deal.id}/tasks/${task.id}/send-for-signature`, { method:'POST' });
          await openDeal(deal.id);
        }catch(err){ showToast(err.message, 'error'); }
      });
      actions.appendChild(sendBtn);

      // "Firmado fuera de la plataforma" — si el documento se subió YA
      // firmado (papel, correo), esto lo marca completado y le quita al
      // cliente la firma pendiente sin pasar por DocuSign. Reversible solo
      // si fue marcado a mano (nunca sobre un sobre real).
      if(task.documentOriginalName && task.docusignStatus === 'not_sent'){
        const offlineBtn = document.createElement('button');
        offlineBtn.className = 'btn'; offlineBtn.style.fontSize = '11px';
        offlineBtn.innerHTML = `<i class="ti ti-checks" aria-hidden="true"></i> ${t('markSignedOffline')}`;
        offlineBtn.title = t('markSignedOfflineTitle');
        offlineBtn.onclick = async () => {
          if(!await confirmDialog(t('confirmMarkSignedOffline', { name: lang==='en' ? task.en : task.es }))) return;
          try{
            await apiFetch(`/api/deals/${deal.id}/tasks/${task.id}`, { method:'PATCH', body: JSON.stringify({ signedOffline: true }) });
            showToast(t('markedSignedOffline'), 'success');
            await openDeal(deal.id);
          }catch(err){ showToast(err.message, 'error'); }
        };
        actions.appendChild(offlineBtn);
      }
      if(task.docusignStatus === 'completed' && !task.docusignEnvelopeId){
        const undoBtn = document.createElement('button');
        undoBtn.className = 'btn'; undoBtn.style.fontSize = '11px';
        undoBtn.innerHTML = `<i class="ti ti-rotate-2" aria-hidden="true"></i> ${t('undoSignedOffline')}`;
        undoBtn.title = t('undoSignedOfflineTitle');
        undoBtn.onclick = async () => {
          try{
            await apiFetch(`/api/deals/${deal.id}/tasks/${task.id}`, { method:'PATCH', body: JSON.stringify({ signedOffline: false }) });
            await openDeal(deal.id);
          }catch(err){ showToast(err.message, 'error'); }
        };
        actions.appendChild(undoBtn);
      }
    } else if(task.status !== 'done' && task.docusignStatus !== 'not_sent'){
      const sentHint = document.createElement('span');
      sentHint.className = 'field-hint'; sentHint.style.cssText = 'margin:0; display:flex; align-items:center;';
      sentHint.textContent = t('checkEmailToSign');
      actions.appendChild(sentHint);
    }

    const checkBtn = document.createElement('button');
    checkBtn.className = 'btn';
    checkBtn.textContent = t('checkStatus');
    checkBtn.style.fontSize = '11px';
    checkBtn.onclick = () => withButtonLoading(checkBtn, async () => {
      try{
        const result = await apiFetch(`/api/docusign/deals/${deal.id}/tasks/${task.id}/status`);
        await openDeal(deal.id);
        if(result.warning) showToast(result.warning);
      }catch(err){ showToast(err.message, 'error'); }
    });
    actions.appendChild(checkBtn);

    row.appendChild(actions);
    scard.appendChild(row);

    if(canManage && escrowFormOpenFor === task.id){
      scard.appendChild(buildEscrowForm(deal, task));
    }
  });
  if(canManage){
    scard.appendChild(buildAddSignatureTaskRow(deal));
  }
  body.appendChild(scard);
}

// Botón "+" para que admin/abogado interno manden a firma cualquier
// documento que no tenga su propio renglón fijo (ej. un NDA o un poder) —
// eligen a quién le toca firmar (nunca ambos lados a la vez: si hiciera
// falta, ya está el escrow agreement/contrato). Una vez creada, la tarea
// aparece arriba con los mismos controles de subir/mandar a firma que las demás.
function buildAddSignatureTaskRow(deal){
  const row = document.createElement('div');
  row.style.cssText = 'margin-top:6px; padding-top:8px; border-top:0.5px solid var(--line);';
  row.innerHTML = `
    <button type="button" class="btn add-sign-task-toggle" title="${t('addSignatureTaskTitle')}" style="font-size:13px; padding:4px 9px; line-height:1;"><i class="ti ti-plus" aria-hidden="true"></i></button>
    <div class="add-sign-task-form" style="display:none; gap:6px; align-items:center; margin-top:6px; flex-wrap:wrap;">
      <input type="text" class="add-sign-task-name" placeholder="${t('signatureTaskNamePh')}" style="flex:1; min-width:180px; font-size:12px; padding:5px 8px;">
      <select class="add-sign-task-side" style="font-size:12px; padding:5px 8px;">
        <option value="">${t('selectSignerSide')}</option>
        <option value="buyer">${t('buyerLabel2')}</option>
        <option value="seller">${t('sellerLabel2')}</option>
      </select>
      <button type="button" class="btn primary add-sign-task-save" style="font-size:11px; padding:4px 10px; white-space:nowrap;">${t('addChecklistItem')}</button>
      <button type="button" class="btn add-sign-task-cancel" title="${t('close')}" style="font-size:11px; padding:4px 8px;"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>
    <div class="gate-error add-sign-task-error"></div>
  `;
  const toggleBtn = row.querySelector('.add-sign-task-toggle');
  const form = row.querySelector('.add-sign-task-form');
  const nameInput = row.querySelector('.add-sign-task-name');
  const sideSelect = row.querySelector('.add-sign-task-side');
  const saveBtn = row.querySelector('.add-sign-task-save');
  const cancelBtn = row.querySelector('.add-sign-task-cancel');
  const errEl = row.querySelector('.add-sign-task-error');
  toggleBtn.onclick = () => {
    toggleBtn.style.display = 'none';
    form.style.display = 'flex';
    nameInput.focus();
  };
  cancelBtn.onclick = () => {
    form.style.display = 'none';
    toggleBtn.style.display = 'inline-flex';
    nameInput.value = ''; sideSelect.value = ''; errEl.textContent = '';
  };
  saveBtn.onclick = async () => {
    const label = nameInput.value.trim();
    const side = sideSelect.value;
    errEl.textContent = '';
    if(!label || !side){ errEl.textContent = t('errNameOrSide'); return; }
    saveBtn.disabled = true;
    try{
      await apiFetch(`/api/docusign/deals/${deal.id}/tasks`, { method:'POST', body: JSON.stringify({ label, side }) });
      await openDeal(deal.id);
    }catch(e){ errEl.textContent = e.message; saveBtn.disabled = false; }
  };
  nameInput.onkeydown = (e) => { if(e.key === 'Escape') cancelBtn.click(); };
  return row;
}

function buildEscrowForm(deal, task){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:12px; margin-bottom:10px; background:var(--stone); border-radius:10px;';
  wrap.innerHTML = `
    <div class="field-hint" style="margin-top:0;">${t('escrowFormHint')}</div>
    <div class="form-row">
      <label>${t('placeDate')} <input type="text" data-escrow-field="placeDate" placeholder="${t('placeDatePh')}"></label>
      <label>${t('expirationDate')} <input type="text" data-escrow-field="expirationDate" placeholder="${t('expirationDatePh')}"></label>
    </div>
    <div class="form-row">
      <label>${t('purchaseAgreementDesc')} <input type="text" data-escrow-field="purchaseAgreementDescription"></label>
    </div>
    <div class="form-row">
      <label>${t('depositAmount')} <input type="text" data-escrow-field="depositAmount" placeholder="${t('depositAmountPh')}"></label>
      <label>${t('fees')} <input type="text" data-escrow-field="fees" placeholder="${t('feesPh')}"></label>
    </div>
    <div class="form-row">
      <label>${t('noticeAddressSeller')} <input type="text" data-escrow-field="noticeAddressSeller"></label>
      <label>${t('noticeAddressBuyer')} <input type="text" data-escrow-field="noticeAddressBuyer"></label>
    </div>
    <div class="gate-error" id="escrow-error"></div>
    <button class="btn primary" id="escrow-generate">${t('generateDocument')}</button>
  `;
  wrap.querySelector('#escrow-generate').onclick = async () => {
    const body = {};
    wrap.querySelectorAll('[data-escrow-field]').forEach(el => { body[el.dataset.escrowField] = el.value.trim(); });
    try{
      await apiFetch(`/api/docusign/deals/${deal.id}/tasks/${task.id}/generate-escrow-document`, { method:'POST', body: JSON.stringify(body) });
      escrowFormOpenFor = null;
      await openDeal(deal.id);
    }catch(e){ wrap.querySelector('#escrow-error').textContent = e.message; }
  };
  return wrap;
}

// Cierra el menú "···" de una tarjeta de operación si se hace clic fuera de
// él — los clics del propio botón/menú ya llaman stopPropagation, así que
// esto solo se dispara para clics genuinamente afuera.
document.addEventListener('click', () => {
  if(dealMenuOpenFor !== null || docActionsMenuFor !== null){ dealMenuOpenFor = null; docActionsMenuFor = null; render(); }
});

// --- Aviso de versión nueva ---
// Una pestaña abierta desde hace días nunca se recarga sola: se queda con
// el código de ANTES del último deploy y "no se ven" las mejoras nuevas.
// Se consulta /api/health (que trae la versión del deploy) cada 5 minutos
// y, si cambió desde que cargó esta pestaña, aparece el aviso de recargar.
let _appVersion = null;
async function checkAppVersion(){
  try{
    const res = await fetch(API_BASE + '/api/health', { cache: 'no-store' });
    const j = await res.json();
    if(!j.version) return;
    if(_appVersion === null){ _appVersion = j.version; return; }
    if(j.version !== _appVersion) showUpdateBanner();
  }catch(e){ /* sin red — el aviso puede esperar al siguiente intento */ }
}
function showUpdateBanner(){
  if(document.getElementById('update-banner')) return;
  const bar = document.createElement('div');
  bar.id = 'update-banner';
  bar.style.cssText = 'position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:2100;'
    + 'display:flex; align-items:center; gap:12px; padding:11px 16px; border-radius:24px;'
    + 'background:var(--oxblood-deep); color:#F6F4F0; font-size:13px; box-shadow:0 6px 24px rgba(33,22,19,0.35); max-width:calc(100vw - 36px);';
  bar.innerHTML = `<i class="ti ti-refresh" aria-hidden="true"></i><span>${t('newVersionAvailable')}</span>`;
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.style.cssText = 'font-size:12px; background:#F6F4F0; color:var(--oxblood-deep); border:0; white-space:nowrap;';
  btn.textContent = t('reloadNow');
  btn.onclick = () => location.reload();
  bar.appendChild(btn);
  document.body.appendChild(bar);
}
checkAppVersion();
setInterval(checkAppVersion, 5 * 60 * 1000);

// ---------- NOTIFICACIONES (campana del navbar, estilo Stripe) ----------
// Todo derivado del estado real (tareas asignadas, documentos por revisar
// o subir, firmas abiertas, actividad reciente) — se recalcula al cargar y
// al abrir el panel, sin estado por notificación en la base de datos.
// (El estado notifData/notifOpen/notifFilter vive junto a los demás
// globals, arriba, para que render() pueda tocarlo desde el principio.)
async function loadNotifications(){
  if(!authenticated){ updateNotifBadge(); return; }
  try{
    const r = await fetch(API_BASE + '/api/dashboard/notifications', { credentials:'include' });
    if(r.ok) notifData = await r.json();
  }catch(e){ /* sin red: la campana se queda como estaba */ }
  updateNotifBadge();
  if(notifOpen) renderNotifPanel();
}

function updateNotifBadge(){
  const bell = document.getElementById('notif-bell');
  const badge = document.getElementById('notif-badge');
  bell.style.display = authenticated ? '' : 'none';
  const n = notifData ? notifData.actionRequired.length : 0;
  badge.style.display = n ? '' : 'none';
  badge.textContent = n > 9 ? '9+' : String(n);
}

const NOTIF_TYPE_META = {
  task_assigned: { icon: 'ti-user-check',  key: 'notifTaskAssigned' },
  doc_review:    { icon: 'ti-eye-check',   key: 'notifDocReview' },
  doc_upload:    { icon: 'ti-upload',      key: 'notifDocUpload' },
  sign_pending:  { icon: 'ti-signature',   key: 'notifSignPending' }
};

function notifItemHtml(item){
  const name = lang === 'es' ? (item.labelEs || '') : (item.labelEn || item.labelEs || '');
  let icon, text;
  if(item.type === 'activity'){
    const meta = ACTIVITY_META[item.action] || { icon: 'ti-point', key: null };
    icon = meta.icon;
    const al = meta.key ? t(meta.key) : item.action;
    text = `${item.userName ? `<b>${escapeHtml(item.userName)}</b> ` : ''}${al}${item.detail ? ` — ${escapeHtml(item.detail)}` : ''}`;
  } else if(item.type === 'doc_reviewed'){
    icon = item.reviewStatus === 'approved' ? 'ti-check' : 'ti-x';
    text = `${item.reviewStatus === 'approved' ? t('notifDocApproved') : t('notifDocRejected')}: <b>${escapeHtml(name)}</b>`;
  } else {
    const meta = NOTIF_TYPE_META[item.type] || { icon: 'ti-point', key: null };
    icon = meta.icon;
    text = `${meta.key ? t(meta.key) : ''}: <b>${escapeHtml(name)}</b>${item.partyName ? ` — ${escapeHtml(item.partyName)}` : ''}`;
  }
  return `
    <span style="width:26px; height:26px; border-radius:50%; background:var(--stone); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--ink-soft);"><i class="ti ${icon}" aria-hidden="true" style="font-size:13px;"></i></span>
    <span style="flex:1; min-width:0;">
      <div style="font-size:12.5px;">${text}</div>
      <div class="field-hint" style="margin:1px 0 0;">${escapeHtml(item.property || '')}${item.at ? ' · ' + escapeHtml(String(item.at).replace('T',' ').slice(0,16)) : ''}</div>
    </span>`;
}

function renderNotifPanel(){
  const panel = document.getElementById('notif-panel');
  if(!notifOpen){ panel.style.display = 'none'; return; }
  panel.style.display = '';
  const action = notifData ? notifData.actionRequired : [];
  const updates = notifData ? notifData.updates : [];
  const CHIPS = [
    ['all', t('notifAll'), action.length + updates.length],
    ['action', t('notifAction'), action.length],
    ['updates', t('notifUpdates'), updates.length]
  ];
  const items = notifFilter === 'action' ? action : (notifFilter === 'updates' ? updates : [...action, ...updates]);
  panel.innerHTML = `
    <div style="font-weight:600; font-size:15px; margin-bottom:12px;">${t('notifTitle')}</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
      ${CHIPS.map(([id, label, count]) => `<button type="button" class="notif-chip ${notifFilter===id?'active':''}" data-filter="${id}">${escapeHtml(label)}${count ? ` <span class="tab-count">${count}</span>` : ''}</button>`).join('')}
    </div>
    ${!items.length ? `<div class="field-hint" style="margin:10px 0 4px;">${t('notifEmpty')}</div>` : ''}
    <div id="notif-list"></div>
  `;
  panel.querySelectorAll('.notif-chip').forEach(chip => {
    chip.onclick = (e) => { e.stopPropagation(); notifFilter = chip.dataset.filter; renderNotifPanel(); };
  });
  const list = panel.querySelector('#notif-list');
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'notif-item';
    row.innerHTML = notifItemHtml(item);
    row.onclick = () => {
      notifOpen = false; renderNotifPanel();
      if(['admin','agent','lawyer','external_lawyer'].includes(currentUser.role)){
        mainTab = 'admin'; adminView = 'list'; activeDealId = item.dealId; openDeal(item.dealId);
      } else {
        mainTab = 'portal'; portalDealId = item.dealId;
      }
      render();
    };
    list.appendChild(row);
  });
}

document.getElementById('notif-bell').addEventListener('click', (e) => {
  e.stopPropagation();
  notifOpen = !notifOpen;
  if(notifOpen) loadNotifications();
  renderNotifPanel();
});
document.addEventListener('click', (e) => {
  if(notifOpen && !e.target.closest('#notif-panel')){ notifOpen = false; renderNotifPanel(); }
});

// --- Modal de firma embebida (DocuSign) ---
loadData();
</script>
