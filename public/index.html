<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Nar — Plataforma de cierre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:opsz,wght@12..30,400;12..30,500;12..30,600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
</head>
<body>
<h2 class="sr-only">Plataforma de coordinación de cierres inmobiliarios de Grupo Nar: administración de operaciones, checklist de KYC por parte, seguimiento de cierre y generación de contrato de promesa, con inicio de sesión por correo y contraseña.</h2>
<div class="app" id="app">
  <div class="head-band">
    <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Menú">
      <i class="ti ti-menu-2" aria-hidden="true"></i>
      <span class="menu-label">Menú</span>
      <i class="ti ti-chevron-down" aria-hidden="true"></i>
    </button>
    <div class="brand-mark">
      <svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"><g><g>
        <polygon fill="#58130E" points="89.3,763 89.3,763 492.8,359.5 896.3,763 896.3,763 938.7,763 938.7,763 492.8,317 46.9,763 46.9,763"/>
        <g>
          <polygon fill="#58130E" points="513.8,432.9 492.6,411.7 141.3,763 141.3,763 183.7,763 183.7,763"/>
          <polygon fill="#58130E" points="587.2,317 566,338.3 587.2,359.5 587.2,359.5 990.7,763 990.7,763 1033.1,763 1033.1,763"/>
        </g>
      </g></g></svg>
      <span class="navbar-wordmark">GRUPO<i>/</i>NAR</span>
      <div class="navbar-divider"></div>
      <span class="navbar-caption" id="navbar-caption"></span>
    </div>
    <div class="nav-actions">
      <div class="seg" id="mainTabs">
        <button class="tab-btn active" data-tab="admin" id="tab-admin">Admin</button>
        <button class="tab-btn" data-tab="portal" id="tab-portal">Portal cliente / agente</button>
      </div>
      <button class="icon-btn" id="notif-bell" style="display:none; position:relative;" title="Notificaciones">
        <i class="ti ti-bell" aria-hidden="true"></i>
        <span id="notif-badge" style="display:none; position:absolute; top:2px; right:2px; min-width:15px; height:15px; border-radius:8px; background:var(--oxblood-deep); color:#F6F4F0; font-size:9.5px; font-weight:600; line-height:15px; text-align:center; padding:0 3px;"></span>
      </button>
      <button class="navbar-pill" id="lang-toggle" title="Switch language / Cambiar idioma">ES</button>
      <button class="icon-btn" id="header-logout" style="display:none;" title="Log out"><i class="ti ti-logout" aria-hidden="true"></i></button>
    </div>
  </div>
  <div id="notif-panel" style="display:none;"></div>
  <div class="app-body">
    <div class="sidebar-scrim" id="sidebar-scrim"></div>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="body-wrap" id="body"></div>
  </div>
</div>

  <script src="js/i18n.js"></script>
  <script src="js/core.js"></script>
  <script src="js/auth-views.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/deal-detail.js"></script>
  <script src="js/deal-docs.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
