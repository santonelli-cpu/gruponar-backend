<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Nar — Plataforma de cierre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:opsz,wght@12..30,400;12..30,500;12..30,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --stone:#F6F4F0; --stone-card:#FFFFFF;
    --ink:#211613; --ink-soft:#6E5F5A; --ink-faint:#A79A94;
    --oxblood:#58130E; --oxblood-deep:#3A0C08; --oxblood-soft:#F1E1DE;
    --gold:#9C7A3E; --gold-soft:#EFE6D3;
    --clay:#9C5A32; --clay-soft:#F2E1D2;
    --jade:#3E6B52; --jade-soft:#DEE9E2;
    --line:rgba(33,22,19,0.12); --line-strong:rgba(33,22,19,0.24);
    --shadow-card:0 1px 2px rgba(33,22,19,0.04), 0 8px 20px -12px rgba(33,22,19,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .app{background:var(--stone); color:var(--ink); font-family:'Inter',sans-serif; border-radius:18px; overflow:hidden; border:0.5px solid var(--line); box-shadow:var(--shadow-card);}
  .head-band{background:var(--oxblood-deep); color:var(--stone); padding:20px 26px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;}
  .brand-mark{display:flex; align-items:center; gap:14px;}
  .brand-mark img{height:38px; width:auto; display:block;}
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-text .name{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:21px; letter-spacing:0.5px;}
  .brand-text .tag{font-family:'Inter',sans-serif; font-size:10px; letter-spacing:2.2px; text-transform:uppercase; color:#D9B9A9; margin-top:2px;}
  .tabs{display:flex; gap:6px;}
  .tab-btn{background:transparent; border:1px solid rgba(255,255,255,0.28); color:#EBD9D2; padding:7px 16px; border-radius:24px; font-size:12.5px; cursor:pointer; font-family:'Inter',sans-serif; transition:background 0.15s;}
  .tab-btn:hover{background:rgba(255,255,255,0.08);}
  .tab-btn.active{background:var(--stone); color:var(--oxblood-deep); border-color:var(--stone);}
  .body-wrap{padding:24px 26px; min-height:400px;}
  .banner{background:var(--gold-soft); color:#5B4620; font-size:12px; padding:10px 14px; border-radius:10px; margin-bottom:18px; line-height:1.5;}
  .section-title{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:19px; margin:0 0 12px; color:var(--oxblood-deep);}
  .card{background:var(--stone-card); border:0.5px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow-card);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-row{display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .form-row label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft); flex:1; min-width:160px;}
  input, select, textarea{font-size:13px; padding:8px 10px; border:0.5px solid var(--line); border-radius:8px; background:var(--stone-card); color:var(--ink); font-family:'Inter',sans-serif; transition:border-color 0.15s;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--oxblood); box-shadow:0 0 0 3px var(--oxblood-soft);}
  textarea{width:100%; resize:vertical; min-height:36px;}
  .btn{padding:8px 16px; border-radius:24px; font-size:12.5px; cursor:pointer; border:1px solid var(--line-strong); background:var(--stone-card); color:var(--ink-soft); transition:all 0.15s; font-family:'Inter',sans-serif;}
  .btn:hover{border-color:var(--oxblood); color:var(--oxblood);}
  .btn.primary{background:var(--oxblood); color:#fff; border-color:var(--oxblood);}
  .btn.primary:hover{background:var(--oxblood-deep); color:#fff;}
  .btn.gold{background:var(--gold); color:#fff; border-color:var(--gold);}
  .btn.gold:hover{color:#fff; opacity:0.9;}
  .deal-card{border:0.5px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; background:var(--stone-card); cursor:pointer; transition:all 0.15s; box-shadow:var(--shadow-card);}
  .deal-card:hover{border-color:var(--oxblood); transform:translateY(-1px);}
  .deal-card.active{border-color:var(--oxblood); box-shadow:0 0 0 3px var(--oxblood-soft);}
  .deal-title{font-weight:600; font-size:14.5px;}
  .deal-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .badge{display:inline-block; font-size:10.5px; padding:3px 10px; border-radius:20px; background:var(--jade-soft); color:var(--jade); margin-top:6px; font-weight:500;}
  .badge.scn-trust{background:var(--gold-soft); color:#6B4E1E;}
  .badge.scn-transfer{background:var(--clay-soft); color:#7A3417;}
  .badge.scn-trust-termination{background:var(--oxblood-soft); color:var(--oxblood);}
  .doc-list{list-style:none; padding:0; margin:0;}
  .doc-item{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:0.5px solid var(--line); font-size:13px;}
  .doc-item:last-child{border-bottom:none;}
  .doc-check{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line-strong); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--jade); transition:all 0.15s;}
  .doc-check.done{background:var(--jade); border-color:var(--jade); color:#fff;}
  .doc-owner{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.4px; margin-right:6px;}
  .task-row{display:flex; gap:12px; padding:10px 0; border-bottom:0.5px solid var(--line); align-items:flex-start;}
  .task-row:last-child{border-bottom:none;}
  .task-stamp{flex-shrink:0; width:30px; height:30px; border-radius:50%; border:2px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-size:11px; cursor:pointer; background:var(--stone-card); color:var(--ink-faint);}
  .task-stamp.progress{border-color:var(--clay); color:var(--clay);}
  .task-stamp.done{border-color:var(--gold); color:var(--gold); background:var(--gold-soft);}
  .task-en{font-weight:500; font-size:13.5px;}
  .task-es{font-size:12px; color:var(--ink-soft); font-style:italic;}
  .sign-tag{font-size:10.5px; padding:2px 8px; border-radius:10px; background:var(--oxblood-soft); color:var(--oxblood); margin-left:6px; font-weight:500;}
  select.role-select{font-weight:500;}
  .empty{display:flex; flex-direction:column; align-items:center; justify-content:center; height:280px; color:var(--ink-faint); text-align:center; gap:8px;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
  .field-hint{font-size:11px; color:var(--ink-faint); margin-top:-4px; margin-bottom:8px;}
  .gate-wrap{min-height:420px; display:flex; align-items:center; justify-content:center; padding:40px 20px;}
  .gate-card{max-width:340px; width:100%; text-align:center;}
  .gate-mark{font-family:'Cormorant Garamond',serif; font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); margin-bottom:6px;}
  .gate-title{font-family:'Cormorant Garamond',serif; font-weight:500; font-size:20px; margin:0 0 4px;}
  .gate-sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:22px; line-height:1.5;}
  .gate-card input{width:100%; margin-bottom:10px; text-align:center;}
  .gate-note{font-size:11px; color:var(--ink-faint); margin-top:16px; line-height:1.5; text-align:left; background:var(--stone-card); border:0.5px solid var(--line); border-radius:8px; padding:10px 12px;}
  .gate-error{color:var(--clay); font-size:12px; margin-bottom:8px; min-height:14px;}
  @media (max-width:600px){ .grid2{grid-template-columns:1fr;} }
</style>
</head>

// Apunta esto a la URL de tu backend una vez desplegado (ver gruponar-backend/).
// Vacío = mismo origen (funciona automáticamente si sirves este archivo
// como estático desde el propio backend, ej. backend/public/index.html).
const API_BASE = '';

let deals = [];
let mainTab = 'admin';
let adminView = 'dashboard';
let dashboardData = null;
let pendingUsers = null;
let kycCache = {};
let kycFormOpenFor = null;
let contractCache = {};
let escrowFormOpenFor = null;
let activeDealId = null;
let portalRole = 'buyer';
let portalDealId = null;
let newDealDraft = null;
let authenticated = false;
let currentUser = null;
let loginError = '';
let loginLoading = false;
let checkingSession = true;
let authView = 'login';
let registerError = '';
let registerLoading = false;
let registerSuccess = '';


async function apiFetch(path, options={}){
  const res = await fetch(API_BASE + path, {
    credentials: 'include',
    headers: {'Content-Type':'application/json'},
    ...options
  });
  let body = null;
  try{ body = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((body && body.error) || `Error ${res.status}`);
  return body;
}

// Como apiFetch, pero para subir archivos (FormData) — no fuerza
// Content-Type: application/json, así el navegador pone el boundary de
// multipart automáticamente.
async function apiUpload(path, formData){
  const res = await fetch(API_BASE + path, { method:'POST', credentials:'include', body: formData });
  let body = null;
  try{ body = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((body && body.error) || `Error ${res.status}`);
  return body;
}

async function checkSession(){
  try{
    const user = await apiFetch('/api/auth/me');
    currentUser = user;
    authenticated = true;
    mainTab = (user.role === 'buyer' || user.role === 'seller') ? 'portal' : 'admin';
  }catch(e){
    authenticated = false;
    currentUser = null;
  }
  checkingSession = false;
}

// --- Adaptadores: el backend devuelve filas planas/snake_case (deals,
// documents, tasks); el resto del código de esta página ya espera la forma
// anidada/camelCase de abajo — un solo lugar traduce entre ambas.
function adaptDoc(d){
  return { id: d.id, name: d.name, status: d.status, fileUrl: d.file_url, originalName: d.original_name };
}
function adaptTask(t){
  return {
    id: t.id, en: t.label_en, es: t.label_es, status: t.status, sign: !!t.requires_signature,
    docusignStatus: t.docusign_status, documentOriginalName: t.document_original_name
  };
}
function adaptDealSummary(row){
  return {
    id: row.id, scenario: row.scenario, development: row.development, property: row.property,
    price: row.price, furniturePrice: row.furniture_price, currency: row.currency, startDate: row.start_date,
    seller: { name: row.seller_name, type: row.seller_type },
    buyer: { name: row.buyer_name, type: row.buyer_type },
    docs: { seller: [], buyer: [] }, tasks: [], _loaded: false,
    _counts: {
      documentsTotal: row.documents_total || 0, documentsDone: row.documents_done || 0,
      tasksTotal: row.tasks_total || 0, tasksDone: row.tasks_done || 0
    }
  };
}
function adaptDealDetail(row){
  const base = adaptDealSummary(row);
  base.docs.seller = row.documents.filter(d=>d.owner==='seller').map(adaptDoc);
  base.docs.buyer = row.documents.filter(d=>d.owner==='buyer').map(adaptDoc);
  base.tasks = row.tasks.map(adaptTask);
  base._loaded = true;
  return base;
}

async function loadData(){
  await checkSession();
  if(!authenticated){ deals = []; render(); return; }
  try{
    const rows = await apiFetch('/api/deals');
    deals = rows.map(adaptDealSummary);
  }catch(e){ deals = []; }
  if(['admin','agent','lawyer'].includes(currentUser.role)) loadDashboard();
  if(currentUser.role === 'admin') loadPendingUsers();
  render();
}

async function loadDashboard(){
  try{ dashboardData = await apiFetch('/api/dashboard'); }
  catch(e){ dashboardData = null; }
  render();
}

async function loadPendingUsers(){
  try{
    const all = await apiFetch('/api/users');
    pendingUsers = all.filter(u => u.status === 'pending');
  }catch(e){ pendingUsers = null; }
  render();
}

async function openDeal(dealId){
  try{
    const full = await apiFetch('/api/deals/' + dealId);
    const adapted = adaptDealDetail(full);
    const idx = deals.findIndex(d=>d.id===dealId);
    if(idx>=0) deals[idx] = adapted; else deals.push(adapted);
  }catch(e){ alert(e.message); }
  render();
}

async function loadKyc(dealId, role, lang){

  try{
    const qs = lang ? `?lang=${lang}` : '';
    kycCache[key] = await apiFetch(`/api/deals/${dealId}/kyc/${role}${qs}`);

  }
  render();
}

async function loadContract(dealId){
  try{
    contractCache[dealId] = await apiFetch(`/api/deals/${dealId}/contract`);
  }catch(e){
    contractCache[dealId] = { error: e.message };
  }
  render();
}

function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function pctDocs(deal){
  if(!deal._loaded) return deal._counts.documentsTotal ? Math.round(deal._counts.documentsDone/deal._counts.documentsTotal*100) : 0;
  const all = deal.docs.seller.concat(deal.docs.buyer);
  const done = all.filter(d=>d.status==='done').length;
  return all.length ? Math.round(done/all.length*100) : 0;
}
function pctTasks(deal){
  if(!deal._loaded) return deal._counts.tasksTotal ? Math.round(deal._counts.tasksDone/deal._counts.tasksTotal*100) : 0;
  const done = deal.tasks.filter(t=>t.status==='done').length;
  return deal.tasks.length ? Math.round(done/deal.tasks.length*100) : 0;
}

  totalsCard.className = 'card';

    <div class="grid2">
      <div><div style="font-size:26px; font-weight:600; color:var(--oxblood-deep);">${d.totalDeals}</div><div class="field-hint" style="margin:0;">Operaciones activas</div></div>

  const attnTitle = document.createElement('div');
  attnTitle.className = 'section-title'; attnTitle.textContent = 'Necesita atención';
  wrap.appendChild(attnTitle);
  const attnCard = document.createElement('div'); attnCard.className = 'card';

  const items = [
    ...d.staleDocuments.map(x => ({...x, kind:'doc'})),
    ...d.staleTasks.map(x => ({...x, kind:'task'})),
    ...d.signaturesAwaiting.map(x => ({...x, kind:'sign'}))
  ];

  if(!items.length){
    attnCard.innerHTML = `<div class="field-hint" style="margin:0;">Nada pendiente hace más de ${d.staleDays} días, y nada esperando firma. Al día.</div>`;
  } else {

  return wrap;
}

  docsCard.appendChild(buildDocList(deal, 'buyer', 'Comprador'));
  wrap.appendChild(docsCard);

  const kycTitle = document.createElement('div');
  kycTitle.className = 'section-title'; kycTitle.textContent = 'Expediente KYC (firma electrónica)';
  wrap.appendChild(kycTitle);
  const kycCard = document.createElement('div'); kycCard.className = 'card';
  kycCard.appendChild(buildKycSection(deal, 'seller', 'Vendedor', true));
  kycCard.appendChild(buildKycSection(deal, 'buyer', 'Comprador', true));
  wrap.appendChild(kycCard);

  const tasksTitle = document.createElement('div');
  tasksTitle.className = 'section-title'; tasksTitle.textContent = 'Tracker de cierre';
  wrap.appendChild(tasksTitle);
  const tasksCard = document.createElement('div');
  tasksCard.className = 'card';
  tasksCard.appendChild(buildTaskList(deal));
  wrap.appendChild(tasksCard);

  const inviteTitle = document.createElement('div');
  inviteTitle.className = 'section-title'; inviteTitle.textContent = 'Invitar a esta operación';
  wrap.appendChild(inviteTitle);
  wrap.appendChild(buildInviteForm(deal));

  const contractTitle = document.createElement('div');
  contractTitle.className = 'section-title'; contractTitle.textContent = 'Contrato de promesa (firma electrónica)';
  wrap.appendChild(contractTitle);
  const contractCard = document.createElement('div'); contractCard.className = 'card';
  contractCard.appendChild(buildContractSection(deal, true));
  wrap.appendChild(contractCard);

  return wrap;
}

const KYC_STATUS_LABEL = { draft:'Sin generar', generated:'Generado, sin enviar', sent:'Enviado a firma', signed:'Firmado' };

function buildKycSection(deal, role, roleLabel, isStaffView){
  const key = deal.id + '-' + role;
  const box = document.createElement('div');
  box.style.cssText = 'padding:10px 0; border-bottom:0.5px solid var(--line);';

  const data = kycCache[key];
  if(data === undefined){
    box.innerHTML = `<div class="field-hint" style="margin:0;">${roleLabel}: cargando...</div>`;
    loadKyc(deal.id, role);
    return box;
  }
  if(data.error){
    box.innerHTML = `<div class="field-hint" style="margin:0;">${roleLabel}: ${escapeHtml(data.error)}</div>`;
    return box;
  }

  const statusLabel = KYC_STATUS_LABEL[data.status] || data.status;
  box.innerHTML = `<div style="font-weight:500; font-size:13px;">${roleLabel} <span class="badge" style="margin-left:6px; background:var(--stone); border:0.5px solid var(--line); color:var(--ink-soft);">${escapeHtml(statusLabel)}</span> <span class="field-hint" style="margin:0;">(${escapeHtml(data.templateKey||'')})</span></div>`;

  // Selector de idioma — solo tiene sentido antes de empezar a llenar (una
  // vez que hay respuestas guardadas, cambiar de idioma significa arrancar
  // un expediente distinto, así que se oculta para no perder el borrador).
  if(isStaffView && data.status === 'draft' && Object.keys(data.answers||{}).length === 0 && data.availableTemplates && data.availableTemplates.length > 1){
    const langRow = document.createElement('div');
    langRow.style.cssText = 'margin-top:4px;';
    langRow.innerHTML = `<label class="field-hint" style="margin:0; display:inline-flex; gap:6px; align-items:center;">Idioma del formulario
      <select id="kyc-lang-${key}" style="font-size:11px; padding:2px 6px;">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </label>`;
    langRow.querySelector('select').value = data.templateKey.endsWith('-en') ? 'en' : 'es';
    langRow.querySelector('select').onchange = (e) => loadKyc(deal.id, role, e.target.value);
    box.appendChild(langRow);
  }

  const actions = document.createElement('div');
  actions.style.cssText = 'display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;';

  const fillBtn = document.createElement('button');
  fillBtn.className = 'btn';
  fillBtn.textContent = data.status === 'draft' ? 'Llenar formulario' : 'Ver / editar formulario';
  fillBtn.onclick = () => { kycFormOpenFor = key; render(); };
  actions.appendChild(fillBtn);

  if(data.generatedFileUrl){
    const viewLink = document.createElement('a');
    viewLink.href = `/api/deals/${deal.id}/kyc/${role}/file`;
    viewLink.target = '_blank';
    viewLink.className = 'btn';
    viewLink.textContent = 'Ver documento';
    actions.appendChild(viewLink);
  }

  if(isStaffView && data.status === 'generated'){
    const sendBtn = document.createElement('button');
    sendBtn.className = 'btn gold';
    sendBtn.textContent = 'Enviar a firma';
    sendBtn.onclick = async () => {
      try{
        await apiFetch(`/api/deals/${deal.id}/kyc/${role}/send-for-signature`, { method:'POST' });
        await loadKyc(deal.id, role);
      }catch(e){ alert(e.message); }
    };
    actions.appendChild(sendBtn);
  }

  if(!isStaffView && data.status === 'sent'){
    const signBtn = document.createElement('button');
    signBtn.className = 'btn gold';
    signBtn.textContent = 'Firmar ahora';
    signBtn.onclick = async () => {
      try{
        const { url } = await apiFetch(`/api/deals/${deal.id}/kyc/${role}/signing-url`, { method:'POST' });
        openKycSigningModal(url, deal.id, role);
      }catch(e){ alert(e.message); }
    };
    actions.appendChild(signBtn);
  }

  box.appendChild(actions);

  if(kycFormOpenFor === key){
    box.appendChild(buildKycForm(deal, role, data));
  }

  return box;
}

// Marca visualmente si un campo es obligatorio (*) u opcional — antes no
// había ninguna diferencia visual entre ambos, así que campos que solo
// aplican a mexicanos/residentes (CURP, RFC, domicilio en México) se veían
// igual de "obligatorios" que el resto para un extranjero llenando el form.
function fieldLabelHtml(f){
  if(f.required) return `${escapeHtml(f.label)} <span style="color:var(--oxblood);">*</span>`;
  if(/opcional/i.test(f.label)) return escapeHtml(f.label);
  return `${escapeHtml(f.label)} <span class="field-hint" style="margin:0; display:inline;">(opcional)</span>`;
}

function buildKycForm(deal, role, data){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'margin-top:12px; padding:14px; background:var(--stone); border-radius:10px;';
  wrap.innerHTML = `<div class="field-hint" style="margin-top:0;">${escapeHtml(data.label)}</div>`;

  const answers = data.answers || {};
  data.sections.forEach(section => {
    const sTitle = document.createElement('div');
    sTitle.style.cssText = 'font-weight:600; font-size:12.5px; margin:12px 0 6px;';
    sTitle.textContent = section.title;
    wrap.appendChild(sTitle);

    section.fields.forEach(f => {
      const row = document.createElement('div');
      row.style.marginBottom = '8px';
      const val = answers[f.id] || '';
      if(f.type === 'radio'){
        row.innerHTML = `<div class="field-hint" style="margin:0 0 4px;">${fieldLabelHtml(f)}</div>` +
          f.options.map(o => `<label style="display:inline-flex; align-items:center; gap:4px; margin-right:14px; font-size:12.5px;">
            <input type="radio" name="kyc-${f.id}" value="${escapeHtml(o.value)}" ${val===o.value?'checked':''}> ${escapeHtml(o.label)}
          </label>`).join('');
      } else if(f.type === 'textarea'){
        row.innerHTML = `<label style="display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft);">${fieldLabelHtml(f)}
          <textarea data-kyc-field="${f.id}" rows="2">${escapeHtml(val)}</textarea>
        </label>`;
      } else {
        const inputType = f.type === 'date' ? 'date' : (f.type === 'email' ? 'email' : 'text');
        row.innerHTML = `<label style="display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft);">${fieldLabelHtml(f)}
          <input type="${inputType}" data-kyc-field="${f.id}" value="${escapeHtml(val)}" ${f.maxLength?`maxlength="${f.maxLength}"`:''}>
        </label>`;
      }
      wrap.appendChild(row);
    });
  });

  function collectAnswers(){
    const result = {};
    data.sections.forEach(section => section.fields.forEach(f => {
      if(f.type === 'radio'){
        const checked = wrap.querySelector(`input[name="kyc-${f.id}"]:checked`);
        result[f.id] = checked ? checked.value : '';
      } else {
        const el = wrap.querySelector(`[data-kyc-field="${f.id}"]`);
        result[f.id] = el ? el.value.trim() : '';
      }
    }));
    return result;
  }

  const actions = document.createElement('div');
  actions.style.cssText = 'display:flex; gap:8px; margin-top:12px;';
  const lang = (data.templateKey || '').endsWith('-en') ? 'en' : 'es';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn'; saveBtn.textContent = 'Guardar borrador';
  saveBtn.onclick = async () => {
    try{
      await apiFetch(`/api/deals/${deal.id}/kyc/${role}`, { method:'POST', body: JSON.stringify({ answers: collectAnswers(), lang }) });
      await loadKyc(deal.id, role);
    }catch(e){ alert(e.message); }
  };
  const generateBtn = document.createElement('button');
  generateBtn.className = 'btn primary'; generateBtn.textContent = 'Guardar y generar documento';
  generateBtn.onclick = async () => {
    try{
      await apiFetch(`/api/deals/${deal.id}/kyc/${role}`, { method:'POST', body: JSON.stringify({ answers: collectAnswers(), lang }) });
      await apiFetch(`/api/deals/${deal.id}/kyc/${role}/generate`, { method:'POST' });
      kycFormOpenFor = null;
      await loadKyc(deal.id, role);
    }catch(e){ alert(e.message); }
  };
  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn'; closeBtn.textContent = 'Cerrar';
  closeBtn.onclick = () => { kycFormOpenFor = null; render(); };
  actions.appendChild(saveBtn); actions.appendChild(generateBtn); actions.appendChild(closeBtn);
  wrap.appendChild(actions);

  return wrap;
}

function openKycSigningModal(url, dealId, role){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed; inset:0; background:rgba(33,22,19,0.55); display:flex; align-items:center; justify-content:center; z-index:1000;';
  overlay.innerHTML = `
    <div style="background:#fff; border-radius:14px; width:min(900px,92vw); height:min(720px,88vh); display:flex; flex-direction:column; overflow:hidden;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 16px; border-bottom:0.5px solid var(--line);">
        <div class="section-title" style="margin:0;">Firma del expediente KYC</div>
        <button class="btn" id="kyc-sign-modal-close">Cerrar</button>
      </div>
      <iframe src="${url}" style="flex:1; border:0;"></iframe>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#kyc-sign-modal-close').onclick = () => overlay.remove();

  const onMessage = async (e) => {
    if(e.origin !== window.location.origin) return;
    if(!e.data || e.data.type !== 'docusign-return') return;
    window.removeEventListener('message', onMessage);
    overlay.remove();
    try{
      await apiFetch(`/api/deals/${dealId}/kyc/${role}/status`);
      await loadKyc(dealId, role);
    }catch(err){ alert(err.message); }
  };
  window.addEventListener('message', onMessage);
}

function buildDocList(deal, key, label){
  const box = document.createElement('div');
  box.style.marginBottom = '14px';
  const h = document.createElement('div');
  h.style.cssText = 'font-weight:500; font-size:13px; color:var(--ink-soft); margin-bottom:6px;';
  h.textContent = label;
  box.appendChild(h);
  const ul = document.createElement('ul');
  ul.className = 'doc-list';
  deal.docs[key].forEach(doc => {
    const li = document.createElement('li');
    li.className = 'doc-item';
    li.innerHTML = `<span class="doc-check ${doc.status==='done'?'done':''}">${doc.status==='done'?'<i class=\"ti ti-check\" aria-hidden=\"true\"></i>':''}</span><span>${escapeHtml(doc.name)}</span>
      <span style="margin-left:auto; display:flex; align-items:center; gap:8px;">
        ${doc.fileUrl ? `<a href="/api/deals/${deal.id}/documents/${doc.id}/file" target="_blank" style="font-size:11px;">Ver archivo</a>` : ''}
        <input type="file" style="font-size:11px; max-width:130px;" accept=".pdf,.jpg,.jpeg,.png,.heic" title="Adjuntar documento">
      </span>`;
    li.querySelector('.doc-check').onclick = async () => {
      const next = doc.status==='done' ? 'pending' : 'done';
      try{
        await apiFetch(`/api/deals/${deal.id}/documents/${doc.id}`, { method:'PATCH', body: JSON.stringify({status: next}) });
        doc.status = next; render();
      }catch(e){ alert(e.message); }
    };
    li.querySelector('input[type=file]').onchange = async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const fd = new FormData();
      fd.append('file', file);
      try{
        await apiUpload(`/api/deals/${deal.id}/documents/${doc.id}/file`, fd);
        await openDeal(deal.id);
      }catch(err){ alert(err.message); }
    };
    ul.appendChild(li);
  });
  box.appendChild(ul);
  return box;
}

function buildTaskList(deal){
  const ul = document.createElement('div');
  deal.tasks.forEach((t, idx) => {
    const row = document.createElement('div');
    row.className = 'task-row';
    const cls = t.status==='done'?'done':(t.status==='progress'?'progress':'');
    row.innerHTML = `
      <div class="task-stamp ${cls}">${t.status==='done'?'<i class=\"ti ti-check\" aria-hidden=\"true\"></i>':(idx+1)}</div>
      <div style="flex:1;">
        <div class="task-en">${escapeHtml(t.en)}${t.sign?'<span class="sign-tag">Requiere firma</span>':''}</div>
        <div class="task-es">${escapeHtml(t.es)}</div>
      </div>
    `;
    row.querySelector('.task-stamp').onclick = async () => {
      const order=['pending','progress','done'];
      const next = order[(order.indexOf(t.status)+1)%order.length];
      try{
        await apiFetch(`/api/deals/${deal.id}/tasks/${t.id}`, { method:'PATCH', body: JSON.stringify({status: next}) });
        t.status = next; render();
      }catch(e){ alert(e.message); }
    };
    ul.appendChild(row);
  });
  return ul;
}

const DEVELOPMENT_LABEL = {punta_mita: 'Punta Mita (machote Palmas)', mandarina: 'Mandarina (machote Mandarina)', general: 'Bahía de Banderas / otro (sin machote específico aún)'};

function buildInviteForm(deal){

      <label>Correo <input type="email" id="inv-email" placeholder="correo@ejemplo.com"></label>

    <div class="form-row" style="align-items:flex-end;">

    </div>
    <div id="inv-result" style="display:none;">
      <div class="form-row">
        <label style="flex:1;">Link de invitación (cópialo y compártelo)

const CONTRACT_STATUS_LABEL = { draft:'Sin generar', generated:'Generado, sin enviar', sent:'Enviado a firma', signed:'Firmado' };

// Reemplaza la vieja exportación de JSON por un sistema real de machotes:
// el admin/abogado sube el .docx de la operación (con placeholders
// {{CLAVE}} ya escritos en el texto), la plataforma detecta solos los
// campos a llenar (sin JSON de definición a mano), y desde aquí mismo se
// genera/descarga el .docx, se ve el PDF, y se manda a firma electrónica.
function buildContractSection(deal, isStaffView){
  const box = document.createElement('div');
  const data = contractCache[deal.id];
  if(data === undefined){
    box.innerHTML = `<div class="field-hint" style="margin:0;">Cargando...</div>`;
    loadContract(deal.id);
    return box;
  }
  if(data.error){
    box.innerHTML = `<div class="field-hint" style="margin:0;">${escapeHtml(data.error)}</div>`;
    return box;
  }

  const statusLabel = CONTRACT_STATUS_LABEL[data.status] || data.status;
  box.innerHTML = `<div style="font-weight:500; font-size:13px;">Contrato de promesa <span class="badge" style="margin-left:6px; background:var(--stone); border:0.5px solid var(--line); color:var(--ink-soft);">${escapeHtml(statusLabel)}</span></div>`;

  if(!isStaffView){
    // Comprador/vendedor: solo ver el contrato ya preparado + firmar cuando
    // se envíe — nunca ven el machote en blanco ni los campos de captura.
    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;';
    if(data.hasDocument){
      const viewLink = document.createElement('a');
      viewLink.href = `/api/deals/${deal.id}/contract/file?format=pdf`;
      viewLink.target = '_blank';
      viewLink.className = 'btn';
      viewLink.textContent = 'Ver contrato';
      actions.appendChild(viewLink);
    } else {
      const hint = document.createElement('div');
      hint.className = 'field-hint'; hint.style.margin = '0';
      hint.textContent = 'Tu coordinador todavía está preparando el contrato.';
      actions.appendChild(hint);
    }
    if(data.status === 'sent'){
      const signBtn = document.createElement('button');
      signBtn.className = 'btn gold';
      signBtn.textContent = 'Firmar ahora';
      signBtn.onclick = async () => {
        try{
          const { url } = await apiFetch(`/api/deals/${deal.id}/contract/signing-url`, { method:'POST' });
          openContractSigningModal(url, deal.id);
        }catch(e){ alert(e.message); }
      };
      actions.appendChild(signBtn);
    }
    box.appendChild(actions);
    return box;
  }

  // --- Vista de admin/agente/abogado ---
  const tplRow = document.createElement('div');
  tplRow.style.cssText = 'margin-top:8px; display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap;';
  const templates = data.templates || [];
  tplRow.innerHTML = `
    <label style="display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft); min-width:220px;">Machote
      <select id="ct-template">
        <option value="">Selecciona un machote...</option>
        ${templates.map(t => `<option value="${t.id}" ${data.selectedTemplateId===t.id?'selected':''}>${escapeHtml(t.label)}</option>`).join('')}
      </select>
    </label>
    <button class="btn" id="ct-upload-toggle" style="font-size:12px;">Subir machote nuevo</button>
  `;
  box.appendChild(tplRow);
  tplRow.querySelector('#ct-template').onchange = async (e) => {
    const templateId = Number(e.target.value) || null;
    if(!templateId) return;
    try{
      await apiFetch(`/api/deals/${deal.id}/contract`, { method:'POST', body: JSON.stringify({ templateId }) });
      await loadContract(deal.id);
    }catch(err){ alert(err.message); }
  };

  const uploadBox = document.createElement('div');
  uploadBox.style.cssText = 'display:none; margin-top:8px; padding:10px; background:var(--stone); border-radius:8px;';
  uploadBox.innerHTML = `
    <div class="field-hint" style="margin-top:0;">Sube el machote en .docx para el tipo de operación <b>${SCENARIOS[deal.scenario].labelShort}</b>, con los campos escritos como <code>{{CLAVE}}</code> — la plataforma los detecta solos, no hace falta definir nada más.</div>
    <div class="form-row">
      <label style="flex:1;">Nombre del machote <input type="text" id="ct-new-label" placeholder="Ej. Compraventa individual — Punta Mita"></label>
      <label>Archivo .docx <input type="file" id="ct-new-file" accept=".docx"></label>
    </div>
    <button class="btn primary" id="ct-new-save">Subir</button>
    <div class="gate-error" id="ct-upload-error"></div>
  `;
  box.appendChild(uploadBox);
  tplRow.querySelector('#ct-upload-toggle').onclick = () => {
    uploadBox.style.display = uploadBox.style.display === 'none' ? 'block' : 'none';
  };
  uploadBox.querySelector('#ct-new-save').onclick = async () => {
    const label = uploadBox.querySelector('#ct-new-label').value.trim();
    const file = uploadBox.querySelector('#ct-new-file').files[0];
    const errEl = uploadBox.querySelector('#ct-upload-error');
    errEl.textContent = '';
    if(!label || !file){ errEl.textContent = 'Falta el nombre o el archivo.'; return; }
    const fd = new FormData();
    fd.append('scenario', deal.scenario);
    fd.append('label', label);
    fd.append('file', file);
    try{
      await apiUpload('/api/contract-templates', fd);
      await loadContract(deal.id);
    }catch(err){ errEl.textContent = err.message; }
  };

  if(!data.selectedTemplateId){
    return box;
  }

  const fields = data.fields || [];
  const values = data.values || {};
  if(fields.length){
    const fieldsWrap = document.createElement('div');
    fieldsWrap.style.cssText = 'margin-top:12px; padding:14px; background:var(--stone); border-radius:10px;';
    fieldsWrap.innerHTML = `<div class="field-hint" style="margin-top:0;">Campos detectados en el machote — se llenan aquí y se insertan donde esté cada <code>{{CLAVE}}</code> en el documento final.</div>`;
    fields.forEach(key => {
      const row = document.createElement('div');
      row.style.marginBottom = '8px';
      row.innerHTML = `<label style="display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft);">${escapeHtml(key)}
        <textarea data-contract-field="${escapeHtml(key)}" rows="1" style="resize:vertical;">${escapeHtml(values[key]||'')}</textarea>
      </label>`;
      fieldsWrap.appendChild(row);
    });
    box.appendChild(fieldsWrap);

    function collectValues(){
      const result = {};
      fields.forEach(key => {
        const el = fieldsWrap.querySelector(`[data-contract-field="${key}"]`);
        result[key] = el ? el.value.trim() : '';
      });
      return result;
    }

    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;';

    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn'; saveBtn.textContent = 'Guardar borrador';
    saveBtn.onclick = async () => {
      try{
        await apiFetch(`/api/deals/${deal.id}/contract`, { method:'POST', body: JSON.stringify({ values: collectValues() }) });
        await loadContract(deal.id);
      }catch(e){ alert(e.message); }
    };
    actions.appendChild(saveBtn);

    const genDownloadBtn = document.createElement('button');
    genDownloadBtn.className = 'btn primary'; genDownloadBtn.textContent = 'Generar y descargar .docx';
    genDownloadBtn.onclick = async () => {
      try{
        await apiFetch(`/api/deals/${deal.id}/contract`, { method:'POST', body: JSON.stringify({ values: collectValues() }) });
        await apiFetch(`/api/deals/${deal.id}/contract/generate`, { method:'POST' });
        window.open(`/api/deals/${deal.id}/contract/file?format=docx`, '_blank');
        await loadContract(deal.id);
      }catch(e){ alert(e.message); }
    };
    actions.appendChild(genDownloadBtn);

    if(data.hasDocument){
      const viewLink = document.createElement('a');
      viewLink.href = `/api/deals/${deal.id}/contract/file?format=pdf`;
      viewLink.target = '_blank';
      viewLink.className = 'btn';
      viewLink.textContent = 'Ver PDF';
      actions.appendChild(viewLink);
    }

    if(data.status === 'generated'){
      const sendBtn = document.createElement('button');
      sendBtn.className = 'btn gold'; sendBtn.textContent = 'Enviar a firma';
      sendBtn.onclick = async () => {
        try{
          await apiFetch(`/api/deals/${deal.id}/contract/send-for-signature`, { method:'POST' });
          await loadContract(deal.id);
        }catch(e){ alert(e.message); }
      };
      actions.appendChild(sendBtn);
    }

    box.appendChild(actions);
  }

  return box;
}

function openContractSigningModal(url, dealId){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed; inset:0; background:rgba(33,22,19,0.55); display:flex; align-items:center; justify-content:center; z-index:1000;';
  overlay.innerHTML = `
    <div style="background:#fff; border-radius:14px; width:min(900px,92vw); height:min(720px,88vh); display:flex; flex-direction:column; overflow:hidden;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 16px; border-bottom:0.5px solid var(--line);">
        <div class="section-title" style="margin:0;">Firma del contrato de promesa</div>
        <button class="btn" id="contract-sign-modal-close">Cerrar</button>
      </div>
      <iframe src="${url}" style="flex:1; border:0;"></iframe>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#contract-sign-modal-close').onclick = () => overlay.remove();

  const onMessage = async (e) => {
    if(e.origin !== window.location.origin) return;
    if(!e.data || e.data.type !== 'docusign-return') return;
    window.removeEventListener('message', onMessage);
    overlay.remove();
    try{
      await apiFetch(`/api/deals/${dealId}/contract/status`);
      await loadContract(dealId);
    }catch(err){ alert(err.message); }
  };
  window.addEventListener('message', onMessage);
}

// ---------- PORTAL ----------
function renderPortal(body){
  // Solo admin/agente pueden "ver como" cualquier rol — es una vista previa
  // interna. Un comprador/vendedor real siempre ve su propio rol_in_deal,
  // nunca elige (antes cualquier sesión de cliente podía elegir "Vendedor"
  // y ver el checklist de la otra parte en su misma operación).
  const isPreview = ['admin','agent','lawyer'].includes(currentUser.role);

  if(isPreview){
    const banner = document.createElement('div');
    banner.className = 'banner';
    banner.innerHTML = `<i class="ti ti-eye" aria-hidden="true"></i> Vista previa del portal de cliente — así lo ve un comprador o vendedor real.`;
    body.appendChild(banner);
  }

  const controls = document.createElement('div');
  controls.className = 'card';
  controls.innerHTML = `
    <div class="form-row" style="margin-bottom:0;">
      ${isPreview ? `<label>Ver como <select id="p-role" class="role-select">
        <option value="buyer">Comprador</option>
        <option value="seller">Vendedor</option>
        <option value="agent">Agente / broker</option>
      </select></label>` : ''}
      <label>Operación <select id="p-deal"><option value="">Selecciona...</option>${deals.map(d=>`<option value="${d.id}">${escapeHtml(d.property)}</option>`).join('')}</select></label>
    </div>
  `;
  body.appendChild(controls);
  if(isPreview){
    controls.querySelector('#p-role').value = portalRole;
    controls.querySelector('#p-role').onchange = e => { portalRole = e.target.value; render(); };
  }
  controls.querySelector('#p-deal').value = portalDealId || '';
  controls.querySelector('#p-deal').onchange = e => {
    portalDealId = Number(e.target.value) || null;
    openDeal(portalDealId);
  };

  const deal = deals.find(d=>d.id===portalDealId);
  if(!deal){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `<i class="ti ti-folder-search" aria-hidden="true"></i><div>Selecciona una operación para ver tu expediente.</div>`;
    body.appendChild(empty);
    return;
  }
  const s = SCENARIOS[deal.scenario];
  const effectiveRole = isPreview ? portalRole : currentUser.role;
  const docsKey = effectiveRole === 'seller' ? 'seller' : (effectiveRole === 'buyer' ? 'buyer' : null);

  const header = document.createElement('div');
  header.className = 'card';
  header.innerHTML = `
    <div class="deal-title" style="font-size:17px;">${escapeHtml(deal.property)}</div>
    <span class="badge ${s.badgeClass}">${s.labelShort}</span>
    <div class="deal-sub" style="margin-top:6px;">${escapeHtml(deal.seller.name)} → ${escapeHtml(deal.buyer.name)}</div>
  `;
  body.appendChild(header);

  if(!deal._loaded){
    const loading = document.createElement('div');
    loading.className = 'empty';
    loading.innerHTML = `<i class="ti ti-loader-2" aria-hidden="true"></i><div>Cargando expediente...</div>`;
    body.appendChild(loading);
    return;
  }

  if(docsKey){
    const t = document.createElement('div'); t.className='section-title'; t.textContent='Tu checklist de documentos (KYC)';
    body.appendChild(t);
    const card = document.createElement('div'); card.className='card';
    card.appendChild(buildDocList(deal, docsKey, docsKey==='seller'?'Vendedor':'Comprador'));
    body.appendChild(card);

    const kt = document.createElement('div'); kt.className='section-title'; kt.textContent='Tu expediente KYC';
    body.appendChild(kt);
    const kcard = document.createElement('div'); kcard.className='card';
    kcard.appendChild(buildKycSection(deal, docsKey, docsKey==='seller'?'Vendedor':'Comprador', false));
    body.appendChild(kcard);
  } else {
    const t = document.createElement('div'); t.className='section-title'; t.textContent='Checklist de ambas partes';
    body.appendChild(t);
    const card = document.createElement('div'); card.className='card';
    card.appendChild(buildDocList(deal,'seller','Vendedor'));
    card.appendChild(buildDocList(deal,'buyer','Comprador'));
    body.appendChild(card);
  }

  const ct = document.createElement('div'); ct.className='section-title'; ct.textContent='Contrato de promesa';
  body.appendChild(ct);
  const ccard = document.createElement('div'); ccard.className='card';
  ccard.appendChild(buildContractSection(deal, false));
  body.appendChild(ccard);

  const tt = document.createElement('div'); tt.className='section-title'; tt.textContent='Seguimiento del cierre';
  body.appendChild(tt);
  const tcard = document.createElement('div'); tcard.className='card';
  tcard.appendChild(buildTaskList(deal));
  body.appendChild(tcard);

  const signTasks = deal.tasks.filter(t=>t.sign);
  if(signTasks.length){
    const st = document.createElement('div'); st.className='section-title'; st.textContent='Firma electrónica';
    body.appendChild(st);
    const scard = document.createElement('div'); scard.className='card';
    scard.innerHTML = `<div class="field-hint" style="margin-top:0;">${isPreview ? 'Sube el documento y envíalo a firma — comprador y vendedor firman de forma embebida, sin salir de la plataforma.' : 'Cuando tu coordinador envíe un documento a firma, aparecerá aquí para que lo firmes en línea.'}</div>`;
    signTasks.forEach(t => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:0.5px solid var(--line); flex-wrap:wrap; gap:8px;';
      const statusLabel = {not_sent:'Sin enviar', sent:'Enviado', delivered:'Entregado', completed:'Firmado', declined:'Rechazado', voided:'Anulado'}[t.docusignStatus] || t.docusignStatus;
      row.innerHTML = `<span style="font-size:13px;">${escapeHtml(t.en)} <span class="task-es">(${escapeHtml(t.es)})</span><br><span class="field-hint" style="margin:0;">Documento: ${t.documentOriginalName ? escapeHtml(t.documentOriginalName) : 'sin subir'} · Estado DocuSign: ${escapeHtml(statusLabel)}</span></span>`;

      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex; gap:8px; align-items:center;';

      if(isPreview){
        const fileInput = document.createElement('input');
        fileInput.type = 'file'; fileInput.accept = '.pdf'; fileInput.style.cssText = 'font-size:11px; max-width:110px;';
        fileInput.onchange = async (e) => {
          const file = e.target.files[0]; if(!file) return;
          const fd = new FormData(); fd.append('file', file);
          try{
            await apiUpload(`/api/docusign/deals/${deal.id}/tasks/${t.id}/document`, fd);
            await openDeal(deal.id);
          }catch(err){ alert(err.message); }
        };
        actions.appendChild(fileInput);

        const escrowBtn = document.createElement('button');
        escrowBtn.className = 'btn'; escrowBtn.style.fontSize = '11px';
        escrowBtn.textContent = 'Generar escrow (Armour)';
        escrowBtn.onclick = () => { escrowFormOpenFor = (escrowFormOpenFor === t.id ? null : t.id); render(); };
        actions.appendChild(escrowBtn);

        const sendBtn = document.createElement('button');
        sendBtn.className = 'btn gold';
        sendBtn.textContent = 'Enviar a firma';
        sendBtn.disabled = !t.documentOriginalName || t.docusignStatus !== 'not_sent';
        sendBtn.onclick = async () => {
          try{
            await apiFetch(`/api/docusign/deals/${deal.id}/tasks/${t.id}/send-for-signature`, { method:'POST' });
            await openDeal(deal.id);
          }catch(err){ alert(err.message); }
        };
        actions.appendChild(sendBtn);
      } else {
        const signBtn = document.createElement('button');
        signBtn.className = 'btn gold';
        signBtn.textContent = t.status==='done' ? 'Firmado' : 'Firmar ahora';
        signBtn.disabled = t.status==='done' || t.docusignStatus==='not_sent';
        signBtn.onclick = async () => {
          try{
            const { url } = await apiFetch(`/api/docusign/deals/${deal.id}/tasks/${t.id}/signing-url`, { method:'POST' });
            openSigningModal(url, deal.id, t.id);
          }catch(err){ alert(err.message); }
        };
        actions.appendChild(signBtn);
      }

      const checkBtn = document.createElement('button');
      checkBtn.className = 'btn';
      checkBtn.textContent = 'Verificar estado';
      checkBtn.style.fontSize = '11px';
      checkBtn.onclick = async () => {
        try{
          await apiFetch(`/api/docusign/deals/${deal.id}/tasks/${t.id}/status`);
          await openDeal(deal.id);
        }catch(err){ alert(err.message); }
      };
      actions.appendChild(checkBtn);

      row.appendChild(actions);
      scard.appendChild(row);

      if(isPreview && escrowFormOpenFor === t.id){
        scard.appendChild(buildEscrowForm(deal, t));
      }
    });
    body.appendChild(scard);
  }
}

function buildEscrowForm(deal, task){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:12px; margin-bottom:10px; background:var(--stone); border-radius:10px;';
  wrap.innerHTML = `
    <div class="field-hint" style="margin-top:0;">Genera el escrow agreement de Armour Secure con vendedor/comprador ya llenados desde esta operación — el resto lo capturas aquí.</div>
    <div class="form-row">
      <label>Lugar y fecha <input type="text" data-escrow-field="placeDate" placeholder="Puerto Vallarta, Jalisco, 29 de julio de 2026"></label>
      <label>Fecha de terminación <input type="text" data-escrow-field="expirationDate" placeholder="31 de diciembre de 2026"></label>
    </div>
    <div class="form-row">
      <label>Descripción del contrato de compraventa <input type="text" data-escrow-field="purchaseAgreementDescription"></label>
    </div>
    <div class="form-row">
      <label>Monto del depósito <input type="text" data-escrow-field="depositAmount" placeholder="USD $310,000.00"></label>
      <label>Comisiones <input type="text" data-escrow-field="fees" placeholder="USD $1,500.00 a cargo del comprador"></label>
    </div>
    <div class="form-row">
      <label>Domicilio para notificaciones <input type="text" data-escrow-field="noticeAddress"></label>
    </div>
    <div class="gate-error" id="escrow-error"></div>
    <button class="btn primary" id="escrow-generate">Generar documento</button>
  `;
  wrap.querySelector('#escrow-generate').onclick = async () => {
    const body = {};
    wrap.querySelectorAll('[data-escrow-field]').forEach(el => { body[el.dataset.escrowField] = el.value.trim(); });
    try{
      await apiFetch(`/api/docusign/deals/${deal.id}/tasks/${task.id}/generate-escrow-document`, { method:'POST', body: JSON.stringify(body) });
      escrowFormOpenFor = null;
      await openDeal(deal.id);
    }catch(e){ wrap.querySelector('#escrow-error').textContent = e.message; }
  };
  return wrap;
}

// --- Modal de firma embebida (DocuSign) ---

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed; inset:0; background:rgba(33,22,19,0.55); display:flex; align-items:center; justify-content:center; z-index:1000;';
  overlay.innerHTML = `
    <div style="background:#fff; border-radius:14px; width:min(900px,92vw); height:min(720px,88vh); display:flex; flex-direction:column; overflow:hidden;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 16px; border-bottom:0.5px solid var(--line);">
        <div class="section-title" style="margin:0;">Firma electrónica</div>
        <button class="btn" id="sign-modal-close">Cerrar</button>
      </div>
      <iframe src="${url}" style="flex:1; border:0;"></iframe>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#sign-modal-close').onclick = () => overlay.remove();

  const onMessage = async (e) => {
    if(e.origin !== window.location.origin) return;
    if(!e.data || e.data.type !== 'docusign-return') return;
    window.removeEventListener('message', onMessage);
    overlay.remove();
    try{
      await apiFetch(`/api/docusign/deals/${dealId}/tasks/${taskId}/status`);
      await openDeal(dealId);
    }catch(err){ alert(err.message); }
  };
  window.addEventListener('message', onMessage);
}
