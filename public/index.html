<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Nar — Plataforma de cierre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:opsz,wght@12..30,400;12..30,500;12..30,600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --stone:#F6F4F0; --stone-card:#FFFFFF;
    --ink:#211613; --ink-soft:#6E5F5A; --ink-faint:#A79A94;
    --oxblood:#58130E; --oxblood-deep:#3A0C08; --oxblood-soft:#F1E1DE;
    --gold:#BD9247; --gold-soft:#F8F1E2;
    --clay:#9C5A32; --clay-soft:#F2E1D2;
    --jade:#3E6B52; --jade-soft:#DEE9E2;
    --line:rgba(33,22,19,0.12); --line-strong:rgba(33,22,19,0.24);
    --shadow-card:0 1px 2px rgba(33,22,19,0.04), 0 8px 20px -12px rgba(33,22,19,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .app{background:var(--stone); color:var(--ink); font-family:'Inter',sans-serif; border-radius:18px; overflow:hidden; border:0.5px solid var(--line); box-shadow:var(--shadow-card);}
  .head-band{position:relative; background:var(--stone-card); color:var(--ink); padding:14px 28px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; border-bottom:1px solid var(--line);}
  .brand-mark{display:flex; align-items:center; gap:12px;}
  .brand-mark svg{display:block; flex-shrink:0; width:28px; height:28px;}
  .navbar-wordmark{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:19px; letter-spacing:1px; color:var(--oxblood-deep);}
  .navbar-wordmark i{font-style:normal; font-weight:400; color:var(--gold);}
  .navbar-divider{width:1px; height:22px; background:var(--line-strong);}
  .navbar-caption{font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-faint); font-weight:500;}
  .nav-actions{display:flex; align-items:center; gap:8px;}
  .seg{display:flex; background:var(--stone); border-radius:999px; padding:3px; gap:2px;}
  .seg .tab-btn.active{background:var(--stone-card); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(30,23,19,0.08);}
  .navbar-pill{border:1px solid var(--line-strong); background:var(--stone-card); color:var(--ink); padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif;}
  .navbar-pill:hover{background:var(--stone);}
  .icon-btn{width:34px; height:34px; border-radius:999px; border:1px solid var(--line-strong); background:var(--stone-card); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);}
  .icon-btn:hover{background:var(--stone); color:var(--oxblood);}
  .tabs{display:flex; gap:8px; align-items:center;}
  .tab-btn{background:none; border:none; color:var(--ink-soft); padding:7px 16px; border-radius:999px; font-size:12.5px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; transition:all 0.15s;}
  .body-wrap{padding:24px 26px; min-height:400px;}
  .banner{background:var(--gold-soft); color:#5B4620; font-size:12px; padding:10px 14px; border-radius:10px; margin-bottom:18px; line-height:1.5;}
  .section-title{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:19px; margin:0 0 12px; color:var(--oxblood-deep);}
  .section-label{font-size:11.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 10px;}
  .card{background:var(--stone-card); border:0.5px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow-card);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-row{display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .form-row label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft); flex:1; min-width:160px;}
  input, select, textarea{font-size:13px; padding:8px 10px; border:0.5px solid var(--line); border-radius:8px; background:var(--stone-card); color:var(--ink); font-family:'Inter',sans-serif; transition:border-color 0.15s;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--oxblood); box-shadow:0 0 0 3px var(--oxblood-soft);}
  textarea{width:100%; resize:vertical; min-height:36px;}
  .btn{padding:8px 16px; border-radius:24px; font-size:12.5px; cursor:pointer; border:1px solid var(--line-strong); background:var(--stone-card); color:var(--ink-soft); transition:all 0.15s; font-family:'Inter',sans-serif;}
  .btn:hover{border-color:var(--oxblood); color:var(--oxblood);}
  .btn.primary{background:var(--oxblood); color:#fff; border-color:var(--oxblood);}
  .btn.primary:hover{background:var(--oxblood-deep); color:#fff;}
  .btn.gold{background:var(--gold); color:#fff; border-color:var(--gold);}
  .btn.gold:hover{color:#fff; opacity:0.9;}
  .deal-card{border:0.5px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; background:var(--stone-card); cursor:pointer; transition:all 0.15s; box-shadow:var(--shadow-card);}
  .deal-card:hover{border-color:var(--oxblood); transform:translateY(-1px);}
  .deal-card.active{border-color:var(--oxblood); box-shadow:0 0 0 3px var(--oxblood-soft);}
  .deal-title{font-weight:600; font-size:14.5px;}
  .deal-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .badge{display:inline-block; font-size:10.5px; padding:3px 10px; border-radius:20px; background:var(--jade-soft); color:var(--jade); margin-top:6px; font-weight:500;}
  .data-table{width:100%; border-collapse:collapse; font-size:13px;}
  .data-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-faint); font-weight:600; padding:0 10px 8px; border-bottom:1px solid var(--line-strong);}
  .data-table td{padding:9px 10px; border-bottom:0.5px solid var(--line); vertical-align:middle;}
  .data-table tr:last-child td{border-bottom:none;}
  .role-badge{font-size:10.5px; padding:2px 9px; border-radius:20px; font-weight:500; white-space:nowrap;}
  .role-badge.buyer{background:var(--gold-soft); color:#6B4E1E;}
  .role-badge.seller{background:var(--oxblood-soft); color:var(--oxblood);}
  .badge.scn-trust{background:var(--gold-soft); color:#6B4E1E;}
  .badge.scn-transfer{background:var(--clay-soft); color:#7A3417;}
  .badge.scn-trust-termination{background:var(--oxblood-soft); color:var(--oxblood);}
  .doc-list{list-style:none; padding:0; margin:0;}
  .doc-item{display:flex; align-items:center; flex-wrap:wrap; gap:10px; padding:9px 0; border-bottom:0.5px solid var(--line); font-size:13px;}
  .review-badge{font-size:10.5px; padding:3px 10px; border-radius:20px; font-weight:500; white-space:nowrap;}
  .review-badge.pending{background:var(--stone); border:0.5px solid var(--line); color:var(--ink-soft);}
  .review-badge.approved{background:var(--jade-soft); color:var(--jade);}
  .review-badge.rejected{background:var(--oxblood-soft); color:var(--oxblood);}
  .doc-review-note{flex-basis:100%; font-size:11.5px; color:var(--oxblood); margin-top:-2px;}
  .btn.success{background:var(--jade-soft); color:var(--jade); border-color:var(--jade-soft);}
  .btn.success:hover{background:#DFEEE0; color:var(--jade);}
  .btn.danger{background:var(--oxblood-soft); color:var(--oxblood); border-color:var(--oxblood-soft);}
  .btn.danger:hover{background:#F7DDD6; color:var(--oxblood);}
  .crumb{font-size:13px; color:var(--ink-soft); margin-bottom:14px; display:inline-flex; align-items:center; gap:4px; cursor:pointer; background:none; border:none; padding:0; font-family:'Inter',sans-serif;}
  .crumb:hover{color:var(--ink);}
  .deal-head-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
  .parties-line{font-size:14px; color:var(--ink); margin:0 0 4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .parties-line .muted{color:var(--ink-faint); font-size:12.5px;}
  .location-line{font-size:12.5px; color:var(--ink-soft); margin:0 0 10px; display:flex; align-items:center; gap:5px;}
  .stat-row{display:flex; gap:32px; padding:14px 0; border-top:0.5px solid var(--line); border-bottom:0.5px solid var(--line); margin-bottom:16px; flex-wrap:wrap;}
  .stat{display:flex; flex-direction:column; gap:3px;}
  .stat-label{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.06em; font-weight:500;}
  .stat-value{font-size:15px; font-weight:600;}
  .progress-row{display:flex; gap:28px; margin-bottom:16px; flex-wrap:wrap;}
  .progress-block{flex:1; min-width:160px;}
  .progress-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;}
  .progress-top .progress-name{color:var(--ink-soft); font-weight:500;}
  .progress-top .progress-pct{font-weight:600;}
  .field-row-clean{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
  .field-row-clean label{flex:1; min-width:160px; display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--ink-soft); font-weight:500;}
  .party-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .party-name{font-size:14px; font-weight:600; margin:0;}
  .party-name span{font-weight:400; color:var(--ink-faint); font-size:12.5px;}
  .party-card-row{display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px; padding:10px 0; border-bottom:0.5px solid var(--line);}
  .party-card-row:last-child{border-bottom:none;}
  .party-meta{font-size:12.5px; color:var(--ink-soft); margin:3px 0 0;}
  .session-avatar{width:44px; height:44px; border-radius:50%; background:var(--oxblood-deep); color:var(--gold-soft); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; flex-shrink:0;}
  .doc-item:last-child{border-bottom:none;}
  .doc-check{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line-strong); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--jade); transition:all 0.15s;}
  .doc-check.done{background:var(--jade); border-color:var(--jade); color:#fff;}
  .doc-owner{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.4px; margin-right:6px;}
  .task-row{display:flex; gap:12px; padding:10px 0; border-bottom:0.5px solid var(--line); align-items:flex-start;}
  .progress-track{height:8px; border-radius:5px; background:var(--stone); overflow:hidden; margin:4px 0 14px;}
  .progress-fill{height:100%; border-radius:5px; background:var(--jade); transition:width 0.2s;}
  .task-row:last-child{border-bottom:none;}
  .task-stamp{flex-shrink:0; width:30px; height:30px; border-radius:50%; border:2px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-size:11px; cursor:pointer; background:var(--stone-card); color:var(--ink-faint);}
  .task-stamp.progress{border-color:var(--clay); color:var(--clay);}
  .task-stamp.done{border-color:var(--gold); color:var(--gold); background:var(--gold-soft);}

  /* ---- Portal: dashboard de operaciones + resumen enriquecido de la operación abierta ---- */
  .op-scroller{display:flex; gap:12px; overflow-x:auto; padding:2px 2px 8px;}
  .op-card{flex:0 0 220px; background:var(--stone-card); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer; transition:border-color 0.15s ease, background 0.15s ease;}
  .op-card:hover{border-color:var(--gold);}
  .op-card.active{border-color:var(--oxblood); background:var(--gold-soft);}
  .op-card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .op-role{font-size:10.5px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:var(--oxblood);}
  .op-check{width:18px; height:18px; border-radius:50%; background:var(--oxblood); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--gold-soft);}
  .op-check svg{width:11px; height:11px;}
  .op-title{font-size:14.5px; font-weight:600; margin:0 0 3px;}
  .op-addr{font-size:12px; color:var(--ink-soft); margin:0 0 10px;}
  .op-bar{height:4px; background:var(--line); border-radius:999px; overflow:hidden; margin-bottom:5px;}
  .op-bar-fill{height:100%; background:var(--oxblood); border-radius:999px;}
  .op-pct{font-size:11px; color:var(--ink-faint);}

  .stepper{display:flex; align-items:flex-start; margin:18px 0 20px;}
  .step{flex:1; display:flex; flex-direction:column; align-items:center; position:relative; text-align:center;}
  .step:not(:last-child)::after{content:""; position:absolute; top:13px; left:calc(50% + 20px); width:calc(100% - 40px); height:2px; background:var(--line);}
  .step.done:not(:last-child)::after{background:var(--oxblood);}
  .step-dot{width:26px; height:26px; border-radius:50%; background:var(--stone-card); border:2px solid var(--line-strong); display:flex; align-items:center; justify-content:center; z-index:1; margin-bottom:7px; color:var(--ink-faint); font-size:11px; font-weight:600;}
  .step.done .step-dot{background:var(--oxblood); border-color:var(--oxblood); color:var(--gold-soft);}
  .step.current .step-dot{border-color:var(--oxblood); color:var(--oxblood);}
  .step-label{font-size:11px; font-weight:500; color:var(--ink-soft); max-width:92px; line-height:1.3;}
  .step.current .step-label{color:var(--oxblood); font-weight:600;}

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
  .stat-tile{background:var(--stone); border-radius:12px; padding:12px 14px;}
  .stat-tile .label{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; font-weight:500; margin:0 0 4px;}
  .stat-tile .value{font-size:16px; font-weight:600; margin:0;}
  .stat-tile .sub{font-size:11px; color:var(--ink-faint); margin-top:2px;}

  .callout{display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--gold-soft); border-left:3px solid var(--oxblood); border-radius:12px; padding:14px 16px;}
  .callout-text{font-size:13px; color:var(--oxblood-deep); line-height:1.5;}
  .callout-text b{font-weight:600;}

  @media (max-width:640px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .stepper{flex-direction:column; align-items:stretch; gap:12px;}
    .step{flex-direction:row; align-items:center; text-align:left; gap:10px;}
    .step:not(:last-child)::after{display:none;}
    .step-label{max-width:none; text-align:left;}
    .callout{flex-direction:column; align-items:flex-start;}
  }
  .task-en{font-weight:500; font-size:13.5px;}
  .task-es{font-size:12px; color:var(--ink-soft); font-style:italic;}
  .sign-tag{font-size:10.5px; padding:2px 8px; border-radius:10px; background:var(--oxblood-soft); color:var(--oxblood); margin-left:6px; font-weight:500;}
  select.role-select{font-weight:500;}
  .empty{display:flex; flex-direction:column; align-items:center; justify-content:center; height:280px; color:var(--ink-faint); text-align:center; gap:8px;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
  .field-hint{font-size:11px; color:var(--ink-faint); margin-top:-4px; margin-bottom:8px;}
  a{color:var(--oxblood); text-decoration:none;}
  a:hover{text-decoration:underline; color:var(--oxblood-deep);}
  .gate-stage{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px; background:radial-gradient(120% 100% at 15% -10%, var(--oxblood-soft) 0%, var(--stone) 55%);}
  .gate-shell{width:100%; max-width:1040px; min-height:600px; display:flex; background:var(--stone-card); border-radius:20px; overflow:hidden; border:0.5px solid var(--line); box-shadow:0 2px 4px rgba(33,22,19,0.05), 0 32px 64px -28px rgba(58,12,8,0.28);}
  .gate-brand{flex:0 0 42%; position:relative; overflow:hidden; background:radial-gradient(140% 180% at 12% -20%, #4E1610 0%, var(--oxblood-deep) 55%); color:var(--stone); display:flex; flex-direction:column; justify-content:space-between; padding:44px 40px;}
  .gate-brand-watermark{position:absolute; right:-72px; bottom:-64px; width:340px; height:340px; opacity:0.08; pointer-events:none;}
  .gate-brand-mark{position:relative; z-index:1; display:block;}
  .gnar-logo-mark{display:block; width:148px; height:148px; margin-left:-4px;}
  .gate-brand-mid{position:relative; z-index:1; margin:auto 0; padding:48px 0;}
  .gate-eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:11px; letter-spacing:2px; color:var(--gold); text-transform:uppercase; margin:0 0 18px; font-weight:600;}
  .gate-eyebrow::before{content:""; width:18px; height:1px; background:var(--gold);}
  .gate-brand-mid h1{font-family:'Fraunces',serif; font-weight:500; font-size:30px; line-height:1.3; letter-spacing:-0.01em; margin:0 0 16px; max-width:320px;}
  .gate-brand-mid p{font-size:13.5px; line-height:1.7; color:rgba(246,244,240,0.68); max-width:300px; margin:0;}
  .gate-brand-footer{position:relative; z-index:1; display:flex; align-items:center; gap:14px; font-size:12px; color:rgba(246,244,240,0.42);}
  .gate-brand-footer a{color:rgba(246,244,240,0.42); text-decoration:none;}
  .gate-brand-footer a:hover{color:rgba(246,244,240,0.72);}
  .gate-panel{flex:1; display:flex; align-items:center; justify-content:center; padding:44px 40px;}
  .gate-panel-inner{width:100%; max-width:340px;}
  .gate-eyebrow-small{font-size:11px; letter-spacing:2px; color:var(--gold); text-transform:uppercase; margin:0 0 10px; font-weight:600;}
  .gate-title{font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin:0 0 6px; color:var(--oxblood-deep);}
  .gate-sub{font-size:13px; color:var(--ink-soft); margin-bottom:24px; line-height:1.55;}
  .gate-field-label{display:block; font-size:12px; font-weight:600; color:var(--ink); margin:0 0 6px;}
  .gate-panel-inner input, .gate-panel-inner select{width:100%; margin-bottom:14px; text-align:left; padding:11px 14px; border-radius:10px; background:var(--stone);}
  .gate-panel-inner input:focus, .gate-panel-inner select:focus{background:var(--stone-card);}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:66px;}
  .pw-toggle{position:absolute; right:4px; top:0; height:100%; padding:0 10px; background:none; border:none; color:var(--ink-faint); font-size:11.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;}
  .pw-toggle:hover{color:var(--oxblood);}
  .gate-panel-inner .btn.primary{width:100%; padding:12px 16px; font-size:13.5px; font-weight:600; letter-spacing:0.2px; margin-top:2px; box-shadow:0 10px 20px -10px rgba(88,19,14,0.55);}
  .gate-panel-inner .field-hint{font-size:12px;}
  .gate-panel-inner .field-hint a{font-weight:600;}
  .gate-note{font-size:11px; color:var(--ink-faint); margin-top:16px; line-height:1.5; text-align:left; background:var(--stone); border:0.5px solid var(--line); border-radius:8px; padding:10px 12px;}
  .gate-error{color:var(--clay); font-size:12px; margin-bottom:8px; min-height:14px;}
  @media (max-width:860px){
    .gate-stage{padding:0;}
    .gate-shell{flex-direction:column; border-radius:0; border:none; min-height:100vh;}
    .gate-brand{flex:0 0 auto; padding:32px 28px;}
    .gate-brand-mid{padding:24px 0;}
    .gate-brand-mid h1{font-size:22px;}
    .gate-panel{padding:32px 28px;}
  }
  @media (max-width:600px){ .grid2{grid-template-columns:1fr;} }
</style>

<body>
<h2 class="sr-only">Plataforma de coordinación de cierres inmobiliarios de Grupo Nar: administración de operaciones, checklist de KYC por parte, seguimiento de cierre y generación de contrato de promesa, con inicio de sesión por correo y contraseña.</h2>
<div class="app" id="app">
  <div class="head-band">
    <div class="brand-mark">
      <svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"><g><g>
        <polygon fill="#58130E" points="89.3,763 89.3,763 492.8,359.5 896.3,763 896.3,763 938.7,763 938.7,763 492.8,317 46.9,763 46.9,763"/>
        <g>
          <polygon fill="#58130E" points="513.8,432.9 492.6,411.7 141.3,763 141.3,763 183.7,763 183.7,763"/>
          <polygon fill="#58130E" points="587.2,317 566,338.3 587.2,359.5 587.2,359.5 990.7,763 990.7,763 1033.1,763 1033.1,763"/>
        </g>
      </g></g></svg>
      <span class="navbar-wordmark">GRUPO<i>/</i>NAR</span>
      <div class="navbar-divider"></div>
      <span class="navbar-caption" id="navbar-caption"></span>
    </div>

async function apiFetch(path, options={}){
  const res = await fetch(API_BASE + path, {
    credentials: 'include',
    headers: {'Content-Type':'application/json'},
    ...options
  });
  let body = null;
  try{ body = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((body && body.error) || `Error ${res.status}`);
  return body;
}

// Como apiFetch, pero para subir archivos (FormData) — no fuerza
// Content-Type: application/json, así el navegador pone el boundary de
// multipart automáticamente.
async function apiUpload(path, formData){
  const res = await fetch(API_BASE + path, { method:'POST', credentials:'include', body: formData });
  let body = null;
  try{ body = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((body && body.error) || `Error ${res.status}`);
  return body;
}

async function checkSession(){
  try{
    const user = await apiFetch('/api/auth/me');
    currentUser = user;
    authenticated = true;
    mainTab = (user.role === 'buyer' || user.role === 'seller') ? 'portal' : 'admin';
  }catch(e){
    authenticated = false;
    currentUser = null;
  }
  checkingSession = false;
}

// documents, tasks); el resto del código de esta página ya espera la forma
// anidada/camelCase de abajo — un solo lugar traduce entre ambas.
function adaptDoc(d){
  return {
    id: d.id, name: d.name, subLabel: d.sub_label, status: d.status,
    fileUrl: d.file_url, originalName: d.original_name, partyId: d.deal_party_entity_id,
    subChecks: d.sub_checks_json ? JSON.parse(d.sub_checks_json) : {},
    reviewStatus: d.review_status || 'pending', reviewNote: d.review_note || null
  };
}
const AGENCIES = ['LPR Luxury', 'Applegate Realtors', 'JPM Real Estate', 'Interamerican'];
// Estos documentos de LLC llegan primero como copia escaneada simple y
// después con estos requisitos ya cumplidos, cada uno por separado (Good
// Standing no se notariza, por eso no lo tiene) — mismos nombres/listas que
// routes/deals.js SUB_CHECKS_BY_DOC.
const SUB_CHECKS_BY_DOC = {
  'Good Standing': ['Apostilled', 'Translated'],
  'Operating Agreement': ['Notarized', 'Apostilled', 'Translated'],
  'Articles of organization': ['Notarized', 'Apostilled', 'Translated']
};
function adaptTask(t){
  return {
    id: t.id, en: t.label_en, es: t.label_es, status: t.status, sign: !!t.requires_signature,
    docType: t.doc_type || 'manual', signSide: t.sign_side || null,
    docusignStatus: t.docusign_status, documentOriginalName: t.document_original_name
  };
}
// Un vendedor/comprador individual, o una entidad (LLC/persona moral) con su
// estructura de propiedad — reemplaza el viejo .seller/.buyer singular.
function adaptParty(p){
  return {
    id: p.id, side: p.side, sortOrder: p.sort_order, name: p.name, partyType: p.party_type,
    ownershipMode: p.ownership_mode,
    parentEntityName: p.parent_entity_name, parentEntityType: p.parent_entity_type,
    parentHasTrustAbove: !!p.parent_has_trust_above, parentTrustName: p.parent_trust_name,
    directTrustName: p.direct_trust_name,
    owners: (p.owners || []).map(o => ({ id: o.id, name: o.name })),
    linkedUser: p.linkedUser || null
  };
}
function sellerParties(deal){ return deal.parties.filter(p => p.side === 'seller'); }
function buyerParties(deal){ return deal.parties.filter(p => p.side === 'buyer'); }
function dealPartyNames(deal, side){ return deal.parties.filter(p => p.side === side).map(p => p.name).join(' y '); }

function adaptDealSummary(row){
  return {
    id: row.id, scenario: row.scenario, development: row.development, property: row.property,
    price: row.price, furniturePrice: row.furniture_price, currency: row.currency, startDate: row.start_date,
    escrowCompany: row.escrow_company || 'armour',
    closingDate: row.closing_date || '', dueDiligenceEndDate: row.due_diligence_end_date || '',
    status: row.status || 'active', closedAt: row.closed_at || null,
    driveFolderId: row.drive_folder_id || null, driveFolderUrl: row.drive_folder_url || null,
    parties: (row.parties || []).map(adaptParty),
    agents: row.agents || [],
    documents: [], tasks: [], _loaded: false,
    _counts: {
      documentsTotal: row.documents_total || 0, documentsDone: row.documents_done || 0,
      tasksTotal: row.tasks_total || 0, tasksDone: row.tasks_done || 0
    }
  };
}
function adaptDealDetail(row){
  const base = adaptDealSummary(row);
  base.documents = row.documents.map(adaptDoc);
  base.tasks = row.tasks.map(adaptTask);
  base._loaded = true;
  return base;
}

// Mismo criterio que defaultKycLang en routes/kyc.js (duplicado a propósito,
// como AGENCIES — no hay endpoint de catálogos): compraventa directa, ambos
// mexicanos; fideicomiso, vendedor mexicano y comprador extranjero; cesión
// de derechos, ambos extranjeros; extinción de fideicomiso, vendedor
// extranjero y comprador mexicano. Se usa para que el portal le aparezca ya
// en su idioma a un comprador/vendedor extranjero desde el primer login, en
// vez de asumir español siempre.
const DEFAULT_LANG_BY_SCENARIO_SIDE = {
  purchase: { seller: 'es', buyer: 'es' },
  trust: { seller: 'es', buyer: 'en' },
  transfer: { seller: 'en', buyer: 'en' },
  trust_termination: { seller: 'en', buyer: 'es' }
};

async function loadData(){
  await checkSession();
  if(!authenticated){ deals = []; render(); return; }
  try{
    const rows = await apiFetch('/api/deals');
    deals = rows.map(adaptDealSummary);
  }catch(e){ deals = []; }
  // Solo si nunca eligió idioma a mano (el toggle ES/EN sí queda guardado
  // permanentemente en cuanto lo usan una vez) y es comprador/vendedor —
  // admin/agente/abogado coordinan en varios idiomas, no tiene sentido
  // adivinarles uno.
  if(!localStorage.getItem('nar_lang') && ['buyer','seller'].includes(currentUser.role)){
    const myDeal = deals.find(d => d.parties.some(p => p.linkedUser && p.linkedUser.userId === currentUser.id));
    const myParty = myDeal && myDeal.parties.find(p => p.linkedUser && p.linkedUser.userId === currentUser.id);
    if(myDeal && myParty){
      const bySide = DEFAULT_LANG_BY_SCENARIO_SIDE[myDeal.scenario];
      if(bySide && bySide[myParty.side]) lang = bySide[myParty.side];
    }
  }
  if(['admin','agent','lawyer','external_lawyer'].includes(currentUser.role)) loadDashboard();
  if(currentUser.role === 'admin') loadPendingUsers();
  // Link directo a una operación (ej. desde el correo de "te agregamos a
  // esta operación") — ?dealId=123 en la URL la abre de una vez.
  const linkedDealId = Number(new URLSearchParams(window.location.search).get('dealId'));
  if(linkedDealId && ['admin','agent','lawyer','external_lawyer'].includes(currentUser.role)){
    mainTab = 'admin'; adminView = 'list'; activeDealId = linkedDealId;
    openDeal(linkedDealId);
  }
  render();
}

async function loadDashboard(){
  try{ dashboardData = await apiFetch('/api/dashboard'); }
  catch(e){ dashboardData = null; }
  render();
}

async function loadPendingUsers(){
  try{
    const all = await apiFetch('/api/users');
    pendingUsers = all.filter(u => u.status === 'pending');
    activeTeamMembers = all.filter(u => u.status === 'active' && ['agent','lawyer','external_lawyer'].includes(u.role));
  }catch(e){ pendingUsers = null; activeTeamMembers = null; }
  render();
}

async function openDeal(dealId){
  try{
    const full = await apiFetch('/api/deals/' + dealId);
    const adapted = adaptDealDetail(full);
    const idx = deals.findIndex(d=>d.id===dealId);
    if(idx>=0) deals[idx] = adapted; else deals.push(adapted);
  }catch(e){ alert(e.message); }
  render();
}

async function loadKyc(dealId, partyId, lang, kind){
  kind = kind || 'escrow';
  const key = dealId + '-' + partyId + '-' + kind;
  try{
    const params = new URLSearchParams();
    if(lang) params.set('lang', lang);
    if(kind === 'lpr') params.set('kind', 'lpr');
    const qs = params.toString() ? '?' + params.toString() : '';
    kycCache[key] = await apiFetch(`/api/deals/${dealId}/kyc/${partyId}${qs}`);
  }catch(e){
    kycCache[key] = { error: e.message };
  }
  render();
}

async function loadContract(dealId){
  try{
    contractCache[dealId] = await apiFetch(`/api/deals/${dealId}/contract`);
  }catch(e){
    contractCache[dealId] = { error: e.message };
  }
  render();
}

async function loadNotaryPaymentNote(){
  try{
    const { note } = await apiFetch('/api/settings/notary-payment-note');
    notaryPaymentNote = note || '';
  }catch(e){
    notaryPaymentNote = '';
  }
  render();
}

async function loadAvailableAgents(dealId){
  try{
    availableAgentsCache[dealId] = await apiFetch(`/api/deals/${dealId}/available-agents`);
  }catch(e){
    availableAgentsCache[dealId] = { error: e.message };
  }
  render();
}

function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function pctDocs(deal){
  if(!deal._loaded) return deal._counts.documentsTotal ? Math.round(deal._counts.documentsDone/deal._counts.documentsTotal*100) : 0;
  const done = deal.documents.filter(d=>d.status==='done').length;
  return deal.documents.length ? Math.round(done/deal.documents.length*100) : 0;
}
function pctTasks(deal){
  if(!deal._loaded) return deal._counts.tasksTotal ? Math.round(deal._counts.tasksDone/deal._counts.tasksTotal*100) : 0;
  const done = deal.tasks.filter(t=>t.status==='done').length;
  return deal.tasks.length ? Math.round(done/deal.tasks.length*100) : 0;
}
// Un solo % que combina documentos + tracker — para la barra de una sola
// línea de las tarjetas de operación del Portal (ahí no hace falta el
// desglose en dos, solo un vistazo rápido de qué tan avanzada va).
function overallPct(deal){
  if(!deal._loaded){
    const total = deal._counts.documentsTotal + deal._counts.tasksTotal;
    const done = deal._counts.documentsDone + deal._counts.tasksDone;
    return total ? Math.round(done/total*100) : 0;
  }
  const total = deal.documents.length + deal.tasks.length;
  const done = deal.documents.filter(d=>d.status==='done').length + deal.tasks.filter(t=>t.status==='done').length;
  return total ? Math.round(done/total*100) : 0;
}
// La parte (deal_party_entity) de esta operación ligada a la cuenta actual
// — null si quien mira es staff sin parte transaccional propia (admin,
// agente, abogado). Se usa para la etiqueta BUYER/SELLER de cada tarjeta y
// para saber de qué lado calcular "waiting on you".
function myPartyInDeal(deal){
  return deal.parties.find(p => p.linkedUser && p.linkedUser.userId === currentUser.id) || null;
}

function render(){
  document.getElementById('mainTabs').style.visibility = authenticated ? 'visible' : 'hidden';
  document.getElementById('header-logout').style.display = authenticated ? '' : 'none';
  document.getElementById('tab-admin').textContent = currentUser && currentUser.role === 'admin' ? t('tabAdmin') : t('tabStaffOperations');
  document.getElementById('tab-portal').textContent = t('tabPortal');
  document.getElementById('navbar-caption').textContent = t('gateBrandEyebrow');
  document.getElementById('lang-toggle').textContent = lang === 'es' ? 'EN' : 'ES';
  document.getElementById('lang-toggle').onclick = () => setLang(lang === 'es' ? 'en' : 'es');
  document.documentElement.lang = lang;
  // La pantalla de login/registro/olvide-contrasena es de pantalla completa
  // (split-screen), sin el head-band de arriba ni el padding normal del
  // body-wrap -- se restauran en cuanto hay sesion.
  document.querySelector('.head-band').style.display = authenticated ? '' : 'none';
  const body = document.getElementById('body');
  body.style.padding = authenticated ? '' : '0';
  body.innerHTML = '';
  if(checkingSession){
    body.innerHTML = `<div class="empty"><i class="ti ti-loader-2" aria-hidden="true"></i><div>${t('checkingSession')}</div></div>`;
    return;
  }
  if(!authenticated){
    renderLogin(body);
    return;
  }
  document.querySelectorAll('#mainTabs .tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===mainTab));
  // Admin/agente ven ambas pestañas; comprador/vendedor solo el portal.
  const adminTabBtn = document.querySelector('#mainTabs [data-tab="admin"]');
  if(adminTabBtn) adminTabBtn.style.display = ['admin','agent','lawyer','external_lawyer'].includes(currentUser.role) ? '' : 'none';
  if(mainTab === 'admin') renderAdmin(body);
  else renderPortal(body);
}

  btn.onclick = () => {
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.textContent = input.type === 'password' ? t('showPassword') : t('hidePassword');
  };
}

function renderLogin(body){
  if(authView === 'register'){ renderRegister(body); return; }
  if(authView === 'forgot'){ renderForgotPassword(body); return; }

  const wrap = buildGateShell(`
    <p class="gate-eyebrow-small">${t('gateWelcomeBack')}</p>
    <div class="gate-title">${t('loginTitle')}</div>
    <div class="gate-sub">${t('loginGateSub')}</div>
    <div class="gate-error">${escapeHtml(loginError)}</div>
    ${registerSuccess ? `<div class="field-hint" style="color:var(--jade); margin-bottom:8px;">${escapeHtml(registerSuccess)}</div>` : ''}
    <label class="gate-field-label" for="login-email">${t('emailLabel')}</label>
    <input type="email" id="login-email" placeholder="${t('loginEmailPh')}" autocomplete="username">
    <label class="gate-field-label" for="login-password">${t('passwordLabel')}</label>
    <div class="pw-wrap">
      <input type="password" id="login-password" placeholder="${t('loginPasswordPh')}" autocomplete="current-password">
      <button type="button" class="pw-toggle" id="login-pw-toggle">${t('showPassword')}</button>
    </div>
    <div class="field-hint" style="text-align:right; margin:-6px 0 16px;"><a href="#" id="go-forgot">${t('forgotPasswordLink')}</a></div>
    <button class="btn primary" id="login-submit" ${loginLoading ? 'disabled' : ''}>${loginLoading ? t('loginSubmitting') : t('loginSubmit')}</button>
    <div class="field-hint" style="text-align:center; margin-top:16px;">${t('loginNoAccount')} <a href="#" id="go-register">${t('loginCreateAccount')}</a></div>
  `);
  body.appendChild(wrap);
  const submit = async () => {
    const email = wrap.querySelector('#login-email').value.trim();
    const password = wrap.querySelector('#login-password').value;
    if(!email || !password){ loginError = t('loginErrFields'); render(); return; }
    loginLoading = true; loginError=''; render();
    try{
      const user = await apiFetch('/api/auth/login', {method:'POST', body: JSON.stringify({email, password})});
      currentUser = user;
      authenticated = true;
      registerSuccess = '';
      mainTab = (user.role === 'buyer' || user.role === 'seller') ? 'portal' : 'admin';
      loginLoading = false;
      await loadData();
    }catch(e){
      loginLoading = false;
      loginError = e.message === 'Failed to fetch' ? t('loginErrConnection') : e.message;
      render();
    }
  };
  wrap.querySelector('#login-submit').onclick = submit;
  wrap.querySelector('#login-password').onkeydown = (e) => { if(e.key==='Enter') submit(); };
  wrap.querySelector('#go-register').onclick = (e) => { e.preventDefault(); authView='register'; loginError=''; render(); };
  wrap.querySelector('#go-forgot').onclick = (e) => { e.preventDefault(); authView='forgot'; loginError=''; forgotMessage=''; render(); };
  wirePasswordToggle(wrap, 'login-password', 'login-pw-toggle');
}

function renderForgotPassword(body){

  `);

  const agencySelect = wrap.querySelector('#reg-agency');
  const agencyOtherInput = wrap.querySelector('#reg-agency-other');

    agencySelect.style.display = isAgent ? '' : 'none';
    agencyOtherInput.style.display = (isAgent && agencySelect.value === 'Otro') ? '' : 'none';
  }

  wrap.querySelector('#go-login').onclick = (e) => { e.preventDefault(); authView='login'; registerError=''; render(); };

      registerLoading = false;
      authView = 'login';
      registerSuccess = result.message;
      render();
    }catch(e){
      registerLoading = false;
      registerError = e.message;
      render();
    }
  };

// Colores por urgencia (no por % de avance) — entre menos días falten para
// el cierre, más "caliente" el color, independientemente de qué tan
// avanzada esté la operación (una operación al 90% que cierra mañana sigue
// necesitando atención esta semana).
function closingUrgencyColor(daysToClose){
  if (daysToClose <= 7) return { ring: 'var(--oxblood)', pillBg: 'var(--oxblood-soft)', pillFg: 'var(--oxblood)' };
  if (daysToClose <= 21) return { ring: 'var(--gold)', pillBg: 'var(--gold-soft)', pillFg: '#6B4E1E' };
  return { ring: 'var(--jade)', pillBg: 'var(--jade-soft)', pillFg: 'var(--jade)' };
}

function buildUpcomingClosings(closings){
  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; margin-bottom:16px;';
  closings.forEach(c => {
    const colors = closingUrgencyColor(c.daysToClose);
    const card = document.createElement('div');
    card.className = 'card';
    card.style.cssText = 'display:flex; align-items:center; gap:14px; cursor:pointer; margin-bottom:0;';
    const pct = Math.max(0, Math.min(100, c.percent));
    const daysLabel = c.daysToClose < 0 ? t('closingOverdue')
      : c.daysToClose === 0 ? t('closingToday')
      : c.daysToClose === 1 ? t('daysToCloseSingular', { days: c.daysToClose })
      : t('daysToClosePlural', { days: c.daysToClose });
    card.innerHTML = `
      <div style="width:70px; height:70px; border-radius:50%; flex-shrink:0; background:conic-gradient(${colors.ring} ${pct}%, var(--line) ${pct}% 100%); display:flex; align-items:center; justify-content:center;">
        <div style="width:52px; height:52px; border-radius:50%; background:var(--stone-card); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:15px;">${pct}%</div>
      </div>
      <div style="min-width:0;">
        <div style="font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(c.property)}</div>
        <span class="badge" style="background:${colors.pillBg}; color:${colors.pillFg}; margin-top:6px;">${escapeHtml(daysLabel)}</span>
      </div>
    `;
    card.onclick = () => { adminView='list'; activeDealId=c.dealId; openDeal(c.dealId); };
    grid.appendChild(card);
  });
  return grid;
}

function buildDashboard(){
  const wrap = document.createElement('div');
  const title = document.createElement('div');
  title.className = 'section-title'; title.textContent = t('dashboard');
  wrap.appendChild(title);

  if(!dashboardData){
    const loading = document.createElement('div');
    loading.className = 'empty';
    loading.innerHTML = `<i class="ti ti-loader-2" aria-hidden="true"></i><div>${t('loadingDashboard')}</div>`;
    wrap.appendChild(loading);
    return wrap;
  }
  const d = dashboardData;

  const totalsCard = document.createElement('div');
  totalsCard.className = 'card';
  totalsCard.innerHTML = `
    <div class="grid2">
      <div><div style="font-size:26px; font-weight:600; color:var(--oxblood-deep);">${d.totalDeals}</div><div class="field-hint" style="margin:0;">${t('statActiveDeals')}</div></div>
      <div><div style="font-size:26px; font-weight:600; color:var(--oxblood-deep);">${d.documentsPending}</div><div class="field-hint" style="margin:0;">${t('statDocsPending')}</div></div>
      <div><div style="font-size:26px; font-weight:600; color:var(--oxblood-deep);">${d.tasksPending + d.tasksInProgress}</div><div class="field-hint" style="margin:0;">${t('statTasksUnfinished')}</div></div>
      <div><div style="font-size:26px; font-weight:600; color:var(--oxblood-deep);">${d.signaturesAwaiting.length}</div><div class="field-hint" style="margin:0;">${t('statAwaitingSignature')}</div></div>
    </div>
    ${d.dealsByScenario.length ? `<div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">${d.dealsByScenario.map(s=>`<span class="badge">${(SCENARIOS[s.scenario]&&SCENARIOS[s.scenario].labelShort)||s.scenario}: ${s.count}</span>`).join('')}</div>` : ''}
  `;
  wrap.appendChild(totalsCard);

  if(d.totalDeals > 0){
    const ucTitle = document.createElement('div');
    ucTitle.className = 'section-title'; ucTitle.textContent = t('upcomingClosings');
    wrap.appendChild(ucTitle);
    if(d.upcomingClosings && d.upcomingClosings.length){
      wrap.appendChild(buildUpcomingClosings(d.upcomingClosings));
    } else {
      const hint = document.createElement('div'); hint.className = 'card';
      hint.innerHTML = `<div class="field-hint" style="margin:0;">${t('noUpcomingClosingsHint')}</div>`;
      wrap.appendChild(hint);
    }
  }

  if(d.signaturesAwaiting.length){
    const signTitle = document.createElement('div');
    signTitle.className = 'section-title'; signTitle.textContent = t('awaitingSignature');
    wrap.appendChild(signTitle);
    const signCard = document.createElement('div'); signCard.className = 'card';
    d.signaturesAwaiting.forEach(item => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:0.5px solid var(--line); cursor:pointer; gap:10px;';
      row.innerHTML = `<span style="font-size:13px;">"${escapeHtml(lang==='en'?item.label_en:item.label_es)}" · ${escapeHtml(item.property)}</span><span class="badge" style="background:var(--gold-soft); color:#6B4E1E; flex-shrink:0;">${t('signature')}</span>`;
      row.onclick = () => { adminView='list'; activeDealId=item.dealId; openDeal(item.dealId); };
      signCard.appendChild(row);
    });
    wrap.appendChild(signCard);
  }

  const pendingTitle = document.createElement('div');
  pendingTitle.className = 'section-title'; pendingTitle.textContent = t('pendingByDeal');
  wrap.appendChild(pendingTitle);

  const groups = {};
  d.pendingDocuments.forEach(x => {
    if(!groups[x.dealId]) groups[x.dealId] = { property: x.property, docs: [], tasks: [] };
    groups[x.dealId].docs.push(x);
  });
  d.pendingTasks.forEach(x => {
    if(!groups[x.dealId]) groups[x.dealId] = { property: x.property, docs: [], tasks: [] };
    groups[x.dealId].tasks.push(x);
  });

  if(!Object.keys(groups).length){
    const emptyCard = document.createElement('div'); emptyCard.className = 'card';
    emptyCard.innerHTML = `<div class="field-hint" style="margin:0;">${t('noPending')}</div>`;
    wrap.appendChild(emptyCard);
  } else {
    Object.entries(groups).forEach(([dealId, g]) => {
      const card = document.createElement('div'); card.className = 'card';
      const header = document.createElement('div');
      header.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; cursor:pointer;';
      header.innerHTML = `<span style="font-weight:600; font-size:13.5px;">${escapeHtml(g.property)}</span><span class="field-hint" style="margin:0;">${t('viewDeal')} <i class="ti ti-arrow-right" aria-hidden="true"></i></span>`;
      header.onclick = () => { adminView='list'; activeDealId=Number(dealId); openDeal(Number(dealId)); };
      card.appendChild(header);

      g.docs.forEach(doc => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:0.5px solid var(--line);';
        row.innerHTML = `
          <span class="doc-check" style="flex-shrink:0;"></span>

          ${doc.stale ? `<span class="badge" style="background:var(--oxblood-soft); color:var(--oxblood); flex-shrink:0;">${t('stale')}</span>` : ''}
        `;
        row.querySelector('.doc-check').onclick = async () => {
          try{
            await apiFetch(`/api/deals/${dealId}/documents/${doc.documentId}`, { method:'PATCH', body: JSON.stringify({status:'done'}) });
            await loadDashboard();
          }catch(e){ alert(e.message); }
        };
        card.appendChild(row);
      });

      g.tasks.forEach(task => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:0.5px solid var(--line);';
        const cls = task.status==='progress' ? 'progress' : '';
        row.innerHTML = `
          <div class="task-stamp ${cls}" style="width:22px; height:22px; font-size:10px; flex-shrink:0;">${task.status==='progress'?'<i class=\"ti ti-clock\" aria-hidden=\"true\"></i>':''}</div>
          <span style="font-size:12.5px; flex:1;">${t('taskLabel')}: ${escapeHtml(lang==='en'?task.label_en:task.label_es)}</span>
          ${task.stale ? `<span class="badge" style="background:var(--oxblood-soft); color:var(--oxblood); flex-shrink:0;">${t('stale')}</span>` : ''}
        `;
        // Confirmar un paso del tracker es solo de admin/abogado interno —
        // este widget del Dashboard también lo ve un agente/abogado externo.
        if(['admin','lawyer'].includes(currentUser.role)) row.querySelector('.task-stamp').onclick = async () => {
          const order=['pending','progress','done'];
          const next = order[(order.indexOf(task.status)+1)%order.length];
          try{
            await apiFetch(`/api/deals/${dealId}/tasks/${task.taskId}`, { method:'PATCH', body: JSON.stringify({status: next}) });
            await loadDashboard();
          }catch(e){ alert(e.message); }
        };
        card.appendChild(row);
      });

      wrap.appendChild(card);
    });
  }

  return wrap;
}

// Base de contactos de comprador/vendedor — separado del Equipo (que es
// staff: agentes/abogados/admin) porque un cliente no es parte del equipo,
// pero admin necesita poder volver a contactarlo (ej. recordatorio anual de
// predial) incluso después de que su operación ya cerró.
function buildClientsSection(){
  const wrap = document.createElement('div');
  const title = document.createElement('div');
  title.className = 'section-title'; title.textContent = t('navClients');
  wrap.appendChild(title);
  const card = document.createElement('div'); card.className = 'card';

  if(clientsCache === undefined){
    card.innerHTML = `<div class="field-hint" style="margin:0;">${t('loading')}</div>`;
    loadClients();
    wrap.appendChild(card);
    return wrap;
  }
  if(clientsCache.error){
    card.innerHTML = `<div class="field-hint" style="margin:0;">${escapeHtml(clientsCache.error)}</div>`;
    wrap.appendChild(card);
    return wrap;
  }

  const controls = document.createElement('div');
  controls.style.cssText = 'display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center;';
  controls.innerHTML = `
    <input type="text" id="clients-search" placeholder="${t('searchByName')}" value="${escapeHtml(clientsSearch)}" style="flex:1; min-width:180px; font-size:13px; padding:7px 10px;">
    <select id="clients-role-filter" style="font-size:13px; padding:7px 10px;">
      <option value="all" ${clientsRoleFilter==='all'?'selected':''}>${t('allRoles')}</option>
      <option value="buyer" ${clientsRoleFilter==='buyer'?'selected':''}>${t('buyerLabel2')}</option>
      <option value="seller" ${clientsRoleFilter==='seller'?'selected':''}>${t('sellerLabel2')}</option>
    </select>
    <button class="btn" id="clients-download"><i class="ti ti-download" aria-hidden="true"></i> ${t('downloadCsv')}</button>
  `;
  wrap.appendChild(controls);
  controls.querySelector('#clients-search').oninput = (e) => {
    clientsSearch = e.target.value;
    const cursor = e.target.selectionStart;
    render();
    // render() reconstruye todo el DOM (incluido este input) — sin esto, el
    // foco y la posición del cursor se pierden en cada tecla mientras buscas.
    const el = document.getElementById('clients-search');
    if(el){ el.focus(); el.setSelectionRange(cursor, cursor); }
  };
  controls.querySelector('#clients-role-filter').onchange = (e) => { clientsRoleFilter = e.target.value; render(); };

  const search = clientsSearch.trim().toLowerCase();
  const filtered = clientsCache.filter(c =>
    (clientsRoleFilter === 'all' || c.role === clientsRoleFilter) &&
    (!search || c.name.toLowerCase().includes(search))
  );
  controls.querySelector('#clients-download').onclick = () => downloadClientsCsv(filtered);

  if(!clientsCache.length){
    card.innerHTML = `<div class="field-hint" style="margin:0;">${t('noClientsYet')}</div>`;
    wrap.appendChild(card);
    return wrap;
  }
  if(!filtered.length){
    card.innerHTML = `<div class="field-hint" style="margin:0;">${t('noClientsMatch')}</div>`;
    wrap.appendChild(card);
    return wrap;
  }

  card.style.overflowX = 'auto';
  const table = document.createElement('table');
  table.className = 'data-table';
  table.innerHTML = `<thead><tr>
    <th>${t('nameLabel')}</th><th>${t('emailLabel')}</th><th>${t('phonePh')}</th><th>${t('roleLabel')}</th><th>${t('dealSingular')}</th>
  </tr></thead>`;
  const tbody = document.createElement('tbody');
  filtered.forEach(c => {
    const tr = document.createElement('tr');
    const dealsLabel = c.deals.map(d => escapeHtml(d.property)).join(', ') || t('noDealsYet');
    const roleLabel = c.role === 'buyer' ? t('buyerLabel2') : t('sellerLabel2');
    tr.innerHTML = `
      <td>${escapeHtml(c.name)}</td>
      <td>${escapeHtml(c.email)}</td>
      <td></td>
      <td><span class="role-badge ${c.role}">${roleLabel}</span></td>
      <td>${dealsLabel}</td>
    `;
    const phoneCell = tr.children[2];
    const phoneInput = document.createElement('input');
    phoneInput.type = 'text'; phoneInput.value = c.phone || ''; phoneInput.placeholder = t('phonePh');
    phoneInput.style.cssText = 'font-size:12px; padding:4px 8px; width:120px;';
    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn'; saveBtn.style.cssText = 'font-size:11px; margin-left:6px;'; saveBtn.textContent = t('save');
    saveBtn.onclick = async () => {
      saveBtn.disabled = true;
      try{
        await apiFetch(`/api/users/${c.id}/phone`, { method:'PATCH', body: JSON.stringify({ phone: phoneInput.value.trim() }) });
        c.phone = phoneInput.value.trim() || null;
        saveBtn.textContent = t('saved');
        setTimeout(() => { saveBtn.textContent = t('save'); }, 1200);
      }catch(e){ alert(e.message); }
      saveBtn.disabled = false;
    };
    phoneCell.appendChild(phoneInput);
    phoneCell.appendChild(saveBtn);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  card.innerHTML = '';
  card.appendChild(table);
  wrap.appendChild(card);
  return wrap;
}

function downloadClientsCsv(clients){
  const header = ['Nombre', 'Correo', 'Teléfono', 'Rol', 'Operaciones'];
  const csvEscape = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const rows = clients.map(c => [c.name, c.email, c.phone || '', c.role === 'buyer' ? t('buyerLabel2') : t('sellerLabel2'), c.deals.map(d => d.property).join('; ')]);
  const csv = [header, ...rows].map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `clientes-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// Widget reutilizable de una parte (vendedor o comprador): nombre, tipo, y
// si es entidad (corporation/llc) su estructura de propiedad — hasta 2
// niveles (socios directos / entidad padre con o sin trust arriba / trust
// directo). Se usa tanto al crear una operación (buildNewDealForm) como al
// agregar/editar una parte de una ya existente (buildPartiesSection).
function buildPartyFieldsBlock(allowedTypes, existing){
  const box = document.createElement('div');
  box.style.cssText = 'border:0.5px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:var(--stone-card);';
  const typeOptions = allowedTypes.map(ty => `<option value="${ty}">${TYPE_LABEL[ty]}</option>`).join('');
  const linkedUser = existing && existing.linkedUser;
  box.innerHTML = `
    <div class="form-row">
      <label>${t('name')} <input type="text" class="pf-name" placeholder="${t('partyNamePh')}"></label>
      <label>${t('type')} <select class="pf-type">${typeOptions}</select></label>
      <label>${t('partyEmailLabel')} <input type="email" class="pf-email" placeholder="${t('partyEmailPh')}" ${linkedUser ? 'disabled' : ''}></label>
    </div>
    <div class="field-hint" style="margin-top:-6px;">${linkedUser ? t('partyEmailLinkedHint', { email: linkedUser.email }) : t('partyEmailHint')}</div>
    <div class="pf-ownership" style="display:none;">
      <label>${t('ownershipStructure')} <select class="pf-mode">
        <option value="direct_owners">${t('modeDirectOwners')}</option>
        <option value="parent_entity">${t('modeParentEntity')}</option>
        <option value="direct_trust">${t('modeDirectTrust')}</option>
      </select></label>
      <div class="pf-mode-owners">
        <div class="field-hint" style="margin:6px 0 4px;">${t('directOwners')}</div>
        <input type="text" class="pf-owner1" placeholder="${t('owner1Ph')}">
        <input type="text" class="pf-owner2" placeholder="${t('owner2Ph')}" style="margin-top:6px;">
      </div>
      <div class="pf-mode-parent" style="display:none;">
        <div class="form-row" style="margin-top:6px;">
          <label>${t('parentEntityName')} <input type="text" class="pf-parent-name"></label>
          <label>${t('type')} <select class="pf-parent-type">
            <option value="corporation">${t('corpMx')}</option>
            <option value="llc">${t('llcForeign')}</option>
          </select></label>
        </div>
        <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; margin-top:6px;">
          <input type="checkbox" class="pf-parent-trust"> ${t('parentHasTrust')}
        </label>
        <input type="text" class="pf-parent-trust-name" placeholder="${t('trustNamePh')}" style="display:none; margin-top:6px;">
      </div>
      <div class="pf-mode-trust" style="display:none; margin-top:6px;">
        <input type="text" class="pf-trust-name" placeholder="${t('directTrustNamePh')}">
      </div>
    </div>
  `;
  const typeSel = box.querySelector('.pf-type');
  const ownershipBlock = box.querySelector('.pf-ownership');
  const modeSel = box.querySelector('.pf-mode');
  const ownersBlock = box.querySelector('.pf-mode-owners');
  const parentBlock = box.querySelector('.pf-mode-parent');
  const trustBlock = box.querySelector('.pf-mode-trust');
  const parentTrustCheck = box.querySelector('.pf-parent-trust');
  const parentTrustName = box.querySelector('.pf-parent-trust-name');

  function updateVisibility(){
    ownershipBlock.style.display = typeSel.value === 'individual' ? 'none' : 'block';
    ownersBlock.style.display = modeSel.value === 'direct_owners' ? 'block' : 'none';
    parentBlock.style.display = modeSel.value === 'parent_entity' ? 'block' : 'none';
    trustBlock.style.display = modeSel.value === 'direct_trust' ? 'block' : 'none';
    parentTrustName.style.display = parentTrustCheck.checked ? 'block' : 'none';
  }
  typeSel.onchange = updateVisibility;
  modeSel.onchange = updateVisibility;
  parentTrustCheck.onchange = updateVisibility;

  if(existing){
    box.querySelector('.pf-name').value = existing.name || '';
    if(linkedUser) box.querySelector('.pf-email').value = linkedUser.email;
    if(allowedTypes.includes(existing.partyType)) typeSel.value = existing.partyType;
    if(existing.ownershipMode) modeSel.value = existing.ownershipMode;
    if(existing.owners && existing.owners[0]) box.querySelector('.pf-owner1').value = existing.owners[0].name;
    if(existing.owners && existing.owners[1]) box.querySelector('.pf-owner2').value = existing.owners[1].name;
    if(existing.parentEntityName) box.querySelector('.pf-parent-name').value = existing.parentEntityName;
    if(existing.parentEntityType) box.querySelector('.pf-parent-type').value = existing.parentEntityType;
    if(existing.parentHasTrustAbove) parentTrustCheck.checked = true;
    if(existing.parentTrustName) parentTrustName.value = existing.parentTrustName;
    if(existing.directTrustName) box.querySelector('.pf-trust-name').value = existing.directTrustName;
  }
  updateVisibility();

  box.collectParty = function(side){
    const partyType = typeSel.value;
    const name = box.querySelector('.pf-name').value.trim();
    const emailInput = box.querySelector('.pf-email');
    const email = emailInput.disabled ? '' : emailInput.value.trim();
    const p = { side, partyType, name };
    if(email) p.email = email;
    if(partyType !== 'individual'){
      p.ownershipMode = modeSel.value;
      if(modeSel.value === 'direct_owners'){
        const o1 = box.querySelector('.pf-owner1').value.trim();
        const o2 = box.querySelector('.pf-owner2').value.trim();
        p.owners = [o1, o2].filter(Boolean).map(name => ({ name }));
      } else if(modeSel.value === 'parent_entity'){
        p.parentEntityName = box.querySelector('.pf-parent-name').value.trim();
        p.parentEntityType = box.querySelector('.pf-parent-type').value;
        p.parentHasTrustAbove = parentTrustCheck.checked;
        if(parentTrustCheck.checked) p.parentTrustName = parentTrustName.value.trim();
      } else if(modeSel.value === 'direct_trust'){
        p.directTrustName = box.querySelector('.pf-trust-name').value.trim();
      }
    }
    return p;
  };

  return box;
}

    const sellers = Array.from(sellersWrap.children).map(b => b.collectParty('seller'));
    const buyers = Array.from(buyersWrap.children).map(b => b.collectParty('buyer'));
    if(sellers.some(p=>!p.name) || buyers.some(p=>!p.name)){ errEl.textContent = t('errMissingPartyName'); return; }
    const development = card.querySelector('#nd-development').value;
    const body = {
      scenario, development, property,
      price: Number(card.querySelector('#nd-price').value) || 0,
      furniturePrice: Number(card.querySelector('#nd-furniture').value) || 0,
      currency: card.querySelector('#nd-currency').value,
      parties: [...sellers, ...buyers],
      startDate: card.querySelector('#nd-start').value || new Date().toISOString().slice(0,10),
      escrowCompany: card.querySelector('#nd-escrow-company').value
    };
    try{
      const { id, partyResults } = await apiFetch('/api/deals', { method:'POST', body: JSON.stringify(body) });
      if(partyResults && partyResults.length){
        const lines = partyResults.map(r => {
          if(r.linkedExisting) return t('partyLinkedExistingLine', { name: r.partyName, email: r.email });
          if(!r.temporaryPassword) return t('partyRegisterFailedLine', { name: r.partyName, error: r.error });
          let line = t('partyRegisteredLine', { name: r.partyName, email: r.email, password: r.temporaryPassword });
          line += r.welcomeEmailSent ? t('welcomeEmailSentNote') : t('welcomeEmailFailedNote', { error: r.welcomeEmailError || '' });
          return line;
        });
        alert(lines.join('\n\n'));
      }
      adminView = 'list';
      activeDealId = id;
      await loadData();
      await openDeal(id);
    }catch(e){ errEl.textContent = e.message; }
  };
  return wrap;
}

// Resumen corto de la estructura de propiedad de una entidad, para mostrar
// junto a su nombre sin tener que abrir el editor.
function partyOwnershipSummary(p){
  if(p.partyType === 'individual') return '';
  if(p.ownershipMode === 'direct_owners') return `${t('partners')}: ${p.owners.map(o=>o.name).join(', ') || t('noName')}`;
  if(p.ownershipMode === 'parent_entity'){
    let s = `${t('parentEntity')}: ${p.parentEntityName} (${TYPE_LABEL[p.parentEntityType]||p.parentEntityType})`;
    if(p.parentHasTrustAbove) s += ` · ${t('trustAbove')}: ${p.parentTrustName}`;
    return s;
  }
  if(p.ownershipMode === 'direct_trust') return `${t('directTrust')}: ${p.directTrustName}`;
  return t('incompleteOwnership');
}

        const allowed = side === 'seller' ? SCENARIOS[scen].sellerTypes : SCENARIOS[scen].buyerTypes;

              alert(msg);

              alert(t('partyRegisterFailedAlert', { error: result.emailError }));
            }
            await openDeal(deal.id);
          }catch(e){ errEl.textContent = e.message; }
        };
        block.appendChild(saveBtn);
        block.appendChild(errEl);
        editSlot.appendChild(block);
      };
      const removeBtn = row.querySelector('.pty-remove');
      if(removeBtn) removeBtn.onclick = async () => {
        if(!confirm(t('confirmRemoveParty', { name: p.name }))) return;
        try{
          await apiFetch(`/api/deals/${deal.id}/parties/${p.id}`, { method:'DELETE' });
          await openDeal(deal.id);
        }catch(e){ alert(e.message); }
      };
      card.appendChild(row);
    });

    const addSlot = document.createElement('div');
    card.appendChild(addSlot);
    addBtn.onclick = () => {
      if(addSlot.childElementCount){ addSlot.innerHTML = ''; return; }
      const allowed = side === 'seller' ? SCENARIOS[deal.scenario].sellerTypes : SCENARIOS[deal.scenario].buyerTypes;
      const block = buildPartyFieldsBlock(allowed);
      block.style.marginTop = '8px';
      const saveBtn = document.createElement('button');
      saveBtn.className = 'btn primary'; saveBtn.style.fontSize = '11px'; saveBtn.textContent = t('addPlain');
      const errEl = document.createElement('div');
      errEl.className = 'gate-error';
      saveBtn.onclick = async () => {
        errEl.textContent = '';
        try{
          const result = await apiFetch(`/api/deals/${deal.id}/parties`, { method:'POST', body: JSON.stringify(block.collectParty(side)) });
          if(result.temporaryPassword){
            let msg = t('partyRegisteredAlert', { password: result.temporaryPassword });
            msg += result.welcomeEmailSent ? t('welcomeEmailSentNote') : t('welcomeEmailFailedNote', { error: result.welcomeEmailError || '' });
            alert(msg);
          } else if(result.emailError){
            alert(t('partyRegisterFailedAlert', { error: result.emailError }));
          }
          await openDeal(deal.id);
        }catch(e){ errEl.textContent = e.message; }
      };
      block.appendChild(saveBtn);
      block.appendChild(errEl);
      addSlot.appendChild(block);
    };

    return card;
  }

  wrap.appendChild(renderSide('seller', t('sellers')));
  wrap.appendChild(renderSide('buyer', t('buyers')));
  return wrap;
}
