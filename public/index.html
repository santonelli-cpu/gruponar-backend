<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Nar — Plataforma de cierre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:opsz,wght@12..30,400;12..30,500;12..30,600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --stone:#F6F4F0; --stone-card:#FFFFFF;
    --ink:#211613; --ink-soft:#6E5F5A; --ink-faint:#A79A94;
    --oxblood:#58130E; --oxblood-deep:#3A0C08; --oxblood-soft:#F1E1DE;
    --gold:#BD9247; --gold-soft:#F8F1E2;
    --clay:#9C5A32; --clay-soft:#F2E1D2;
    --jade:#3E6B52; --jade-soft:#DEE9E2;
    --line:rgba(33,22,19,0.12); --line-strong:rgba(33,22,19,0.24);
    --shadow-card:0 1px 2px rgba(33,22,19,0.04), 0 8px 20px -12px rgba(33,22,19,0.12);
  }
  *{box-sizing:border-box;}
  /* Armazón de aplicación de altura completa (como Stripe/Linear): la barra
     de arriba fija, el menú lateral ocupando TODO el alto de la pantalla, y
     solo el contenido de la derecha con scroll propio. Antes la página
     entera hacía scroll y el menú terminaba donde terminaban sus botones,
     dejando media columna vacía debajo. */
  html, body{margin:0; height:100%;}
  .app{background:var(--stone); color:var(--ink); font-family:'Inter',sans-serif; overflow:hidden;
    height:100vh; display:flex; flex-direction:column;}
  .head-band{position:relative; background:var(--stone-card); color:var(--ink); padding:14px 28px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; border-bottom:1px solid var(--line); flex-shrink:0;}
  .brand-mark{display:flex; align-items:center; gap:12px;}
  .brand-mark svg{display:block; flex-shrink:0; width:28px; height:28px;}
  .navbar-wordmark{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:19px; letter-spacing:1px; color:var(--oxblood-deep);}
  .navbar-wordmark i{font-style:normal; font-weight:400; color:var(--gold);}
  .navbar-divider{width:1px; height:22px; background:var(--line-strong);}
  .navbar-caption{font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-faint); font-weight:500;}
  .nav-actions{display:flex; align-items:center; gap:8px;}
  .seg{display:flex; background:var(--stone); border-radius:999px; padding:3px; gap:2px;}
  .seg .tab-btn.active{background:var(--stone-card); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(30,23,19,0.08);}
  .navbar-pill{border:1px solid var(--line-strong); background:var(--stone-card); color:var(--ink); padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif;}
  .navbar-pill:hover{background:var(--stone);}
  .icon-btn{width:34px; height:34px; border-radius:999px; border:1px solid var(--line-strong); background:var(--stone-card); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);}
  .icon-btn:hover{background:var(--stone); color:var(--oxblood);}
  .tabs{display:flex; gap:8px; align-items:center;}
  .tab-btn{background:none; border:none; color:var(--ink-soft); padding:7px 16px; border-radius:999px; font-size:12.5px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; transition:all 0.15s;}
  /* Menú lateral fijo (como Stripe/Linear): todas las secciones a la vista,
     siempre en el mismo lugar, sin que nada de la página las empuje hacia
     abajo. Dentro de una operación, sus secciones cuelgan del menú como
     sub-elementos — no hay que bajar a buscar una barra de pestañas. */
  .app-body{flex:1; min-height:0; display:flex; align-items:stretch;}
  /* Columna completa de arriba abajo, con su propio scroll si la lista de
     secciones creciera. Nunca se corta a media pantalla. */
  .sidebar{width:236px; flex-shrink:0; background:var(--stone-card); border-right:1px solid var(--line);
    padding:18px 12px; display:flex; flex-direction:column; gap:2px; height:100%; overflow-y:auto;}
  .body-wrap{flex:1; min-width:0; padding:24px 26px; overflow-y:auto; height:100%;}
  .side-group{font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-faint);
    font-weight:600; margin:20px 0 7px; padding:0 12px;}
  .side-group:first-child{margin-top:2px;}
  /* La barrita tinta de la izquierda marca la sección activa sin gritar —
     el fondo tenue solo no se distinguía de un simple hover. */
  .side-item{position:relative; display:flex; align-items:center; gap:10px; width:100%; padding:9px 11px; border:0;
    border-radius:9px; background:none; color:var(--ink-soft); font-size:13.5px; font-family:inherit; text-align:left;
    cursor:pointer; line-height:1.25; transition:background 0.14s ease, color 0.14s ease;}
  .side-item:hover{background:var(--stone); color:var(--ink);}
  .side-item.active{background:var(--oxblood-soft); color:var(--oxblood-deep); font-weight:600;}
  .side-item.active::before{content:''; position:absolute; left:0; top:7px; bottom:7px; width:3px;
    border-radius:0 3px 3px 0; background:var(--oxblood-deep);}
  .side-item i{font-size:16px; flex-shrink:0; opacity:0.8;}
  .side-item.active i{opacity:1;}
  .side-item span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .side-item .side-count{margin-left:auto; background:var(--oxblood-deep); color:#F6F4F0; border-radius:9px;
    font-size:10.5px; font-weight:600; min-width:18px; height:18px; display:inline-flex; align-items:center;
    justify-content:center; padding:0 5px;}
  .side-item.active .side-count{background:var(--oxblood);}
  .side-sub{padding-left:20px; font-size:13px;}
  .side-divider{height:1px; background:var(--line); margin:14px 4px;}
  /* Pegado al fondo de la columna, separado por su línea — el espaciador
     flexible que lo empuja lo pone buildSidebarAccount. */
  .side-account{border-top:1px solid var(--line); padding:14px 10px 4px; margin-top:10px; flex-shrink:0;}
  /* Ventana angosta: el menú se guarda detrás del botón de hamburguesa y
     entra deslizándose por la izquierda, como Stripe — el contenido se
     queda con todo el ancho y la navegación sigue completa (con sus
     títulos de grupo), en vez de una tira de chips a la que hay que
     hacerle scroll horizontal para encontrar la sección. */
  .menu-toggle{display:none;}
  .sidebar-scrim{display:none;}
  @media (max-width:900px){
    .menu-toggle{display:flex;}
    .sidebar{position:fixed; top:0; left:0; bottom:0; height:auto; z-index:80; width:min(280px, 84vw);
      transform:translateX(-100%); transition:transform 0.22s ease; box-shadow:0 0 40px rgba(33,22,19,0.22);}
    .sidebar.open{transform:translateX(0);}
    .sidebar-scrim.open{display:block; position:fixed; inset:0; background:rgba(33,22,19,0.35); z-index:79;}
    .body-wrap{padding:18px 16px;}
  }
  .banner{background:var(--gold-soft); color:#5B4620; font-size:12px; padding:10px 14px; border-radius:10px; margin-bottom:18px; line-height:1.5;}
  .section-title{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:19px; margin:0 0 12px; color:var(--oxblood-deep);}
  .section-label{font-size:11.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 10px;}
  .card{background:var(--stone-card); border:0.5px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow-card);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-row{display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .form-row label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft); flex:1; min-width:160px;}
  input, select, textarea{font-size:13px; padding:8px 10px; border:0.5px solid var(--line); border-radius:8px; background:var(--stone-card); color:var(--ink); font-family:'Inter',sans-serif; transition:border-color 0.15s;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--oxblood); box-shadow:0 0 0 3px var(--oxblood-soft);}
  textarea{width:100%; resize:vertical; min-height:36px;}
  .btn{padding:8px 16px; border-radius:24px; font-size:12.5px; cursor:pointer; border:1px solid var(--line-strong); background:var(--stone-card); color:var(--ink-soft); transition:all 0.15s; font-family:'Inter',sans-serif;}
  .btn:hover{border-color:var(--oxblood); color:var(--oxblood);}
  .btn.primary{background:var(--oxblood); color:#fff; border-color:var(--oxblood);}
  .btn.primary:hover{background:var(--oxblood-deep); color:#fff;}
  .btn.gold{background:var(--gold); color:#fff; border-color:var(--gold);}
  .btn.gold:hover{color:#fff; opacity:0.9;}
  .deal-card{position:relative; border:0.5px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; background:var(--stone-card); cursor:pointer; transition:all 0.15s; box-shadow:var(--shadow-card);}
  .deal-card-menu-btn{position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:50%; border:none; background:transparent; color:var(--ink-faint); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;}
  .deal-card-menu-btn:hover{background:var(--stone); color:var(--ink);}
  .deal-card-menu{position:absolute; top:40px; right:10px; background:var(--stone-card); border:0.5px solid var(--line); border-radius:10px; box-shadow:0 4px 16px rgba(33,22,19,0.14); z-index:5; min-width:170px; overflow:hidden;}
  .deal-card-menu button{display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:9px 12px; font-size:12.5px; background:none; border:none; cursor:pointer; color:var(--ink);}
  .deal-card-menu button:hover{background:var(--stone);}
  .deal-card-menu button.danger{color:var(--oxblood);}
  .deal-card:hover{border-color:var(--oxblood); transform:translateY(-1px);}
  .deal-card.active{border-color:var(--oxblood); box-shadow:0 0 0 3px var(--oxblood-soft);}
  .deal-title{font-weight:600; font-size:14.5px;}
  .deal-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .badge{display:inline-block; font-size:10.5px; padding:3px 10px; border-radius:20px; background:var(--jade-soft); color:var(--jade); margin-top:6px; font-weight:500;}
  .data-table{width:100%; border-collapse:collapse; font-size:13px;}
  .data-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-faint); font-weight:600; padding:0 10px 8px; border-bottom:1px solid var(--line-strong);}
  .data-table td{padding:9px 10px; border-bottom:0.5px solid var(--line); vertical-align:middle;}
  .data-table tr:last-child td{border-bottom:none;}
  .role-badge{font-size:10.5px; padding:2px 9px; border-radius:20px; font-weight:500; white-space:nowrap;}
  .role-badge.buyer{background:var(--gold-soft); color:#6B4E1E;}
  .role-badge.seller{background:var(--oxblood-soft); color:var(--oxblood);}
  .badge.scn-trust{background:var(--gold-soft); color:#6B4E1E;}
  .badge.scn-transfer{background:var(--clay-soft); color:#7A3417;}
  .badge.scn-trust-termination{background:var(--oxblood-soft); color:var(--oxblood);}
  .doc-list{list-style:none; padding:0; margin:0;}
  .doc-item{display:flex; align-items:center; flex-wrap:wrap; gap:10px; padding:9px 0; border-bottom:0.5px solid var(--line); font-size:13px;}
  .doc-item-actions{margin-left:auto; display:flex; align-items:center; flex-wrap:wrap; gap:8px;}
  .review-badge{font-size:10.5px; padding:3px 10px; border-radius:20px; font-weight:500; white-space:nowrap;}
  .review-badge.pending{background:var(--stone); border:0.5px solid var(--line); color:var(--ink-soft);}
  .review-badge.approved{background:var(--jade-soft); color:var(--jade);}
  .review-badge.rejected{background:var(--oxblood-soft); color:var(--oxblood);}
  .doc-review-note{flex-basis:100%; font-size:11.5px; color:var(--oxblood); margin-top:-2px;}
  .btn.success{background:var(--jade-soft); color:var(--jade); border-color:var(--jade-soft);}
  .btn.success:hover{background:#DFEEE0; color:var(--jade);}
  .btn.danger{background:var(--oxblood-soft); color:var(--oxblood); border-color:var(--oxblood-soft);}
  .btn.danger:hover{background:#F7DDD6; color:var(--oxblood);}
  .crumb{font-size:13px; color:var(--ink-soft); margin-bottom:14px; display:inline-flex; align-items:center; gap:4px; cursor:pointer; background:none; border:none; padding:0; font-family:'Inter',sans-serif;}
  .crumb:hover{color:var(--ink);}
  .deal-head-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
  .parties-line{font-size:14px; color:var(--ink); margin:0 0 4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .parties-line .muted{color:var(--ink-faint); font-size:12.5px;}
  .location-line{font-size:12.5px; color:var(--ink-soft); margin:0 0 10px; display:flex; align-items:center; gap:5px;}
  .stat-row{display:flex; gap:32px; padding:14px 0; border-top:0.5px solid var(--line); border-bottom:0.5px solid var(--line); margin-bottom:16px; flex-wrap:wrap;}
  .stat{display:flex; flex-direction:column; gap:3px;}
  .stat-label{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.06em; font-weight:500;}
  .stat-value{font-size:15px; font-weight:600;}
  .field-editable{cursor:pointer; border-bottom:1px dashed transparent; border-radius:2px;}
  .field-editable:hover{border-bottom-color:var(--line-strong); background:var(--stone);}
  .inline-edit-input{border:1px solid var(--line-strong); border-radius:6px; padding:3px 7px; background:var(--stone-card); color:var(--ink);}
  /* Toasts — confirmaciones y errores sin popups nativos del navegador */
  #toast-stack{position:fixed; bottom:18px; right:18px; z-index:2000; display:flex; flex-direction:column; gap:8px; max-width:min(380px, calc(100vw - 36px));}
  .toast{display:flex; align-items:flex-start; gap:9px; padding:11px 14px; border-radius:10px; font-size:13px; line-height:1.4;
    background:var(--oxblood-deep); color:#F6F4F0; box-shadow:0 6px 24px rgba(33,22,19,0.28);
    animation:toast-in .18s ease-out;}
  .toast.error{background:#7A1E16;}
  .toast.success{background:#2F5D46;}
  .toast i{flex-shrink:0; margin-top:1px;}
  @keyframes toast-in{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:none;}}
  .toast.leaving{opacity:0; transform:translateY(6px); transition:opacity .25s, transform .25s;}
  /* Diálogo de confirmación propio (reemplaza confirm() nativo) */
  .dialog-overlay{position:fixed; inset:0; background:rgba(33,22,19,0.55); display:flex; align-items:center; justify-content:center; z-index:1500; padding:20px;}
  .dialog-box{background:var(--stone-card); border-radius:14px; width:min(420px, 94vw); padding:20px; box-shadow:0 12px 40px rgba(33,22,19,0.3);}
  .dialog-box p{margin:0 0 16px; font-size:13.5px; line-height:1.5; white-space:pre-line;}
  .dialog-actions{display:flex; gap:8px; justify-content:flex-end;}
  /* Spinner en botones de acciones lentas */
  .btn-spinner{display:inline-block; width:12px; height:12px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  /* Barra fija de secciones dentro del detalle de la operación */
  /* Menú "···" de acciones por documento del checklist (vista staff) */
  .doc-action-menu{position:absolute; top:32px; right:0; background:var(--stone-card); border:0.5px solid var(--line); border-radius:10px; box-shadow:0 4px 16px rgba(33,22,19,0.14); z-index:6; min-width:220px; overflow:hidden;}
  .doc-action-menu button{display:flex; align-items:center; gap:8px; width:100%; background:none; border:0; padding:9px 14px; font-size:12.5px; font-family:inherit; color:var(--ink); cursor:pointer; text-align:left;}
  .doc-action-menu button:hover{background:var(--stone);}
  .doc-action-menu button.danger{color:var(--oxblood);}
  .progress-row{display:flex; gap:28px; margin-bottom:16px; flex-wrap:wrap;}
  .progress-block{flex:1; min-width:160px;}
  .progress-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;}
  .progress-top .progress-name{color:var(--ink-soft); font-weight:500;}
  .progress-top .progress-pct{font-weight:600;}
  .field-row-clean{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
  .field-row-clean label{flex:1; min-width:160px; display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--ink-soft); font-weight:500;}
  .party-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .party-name{font-size:14px; font-weight:600; margin:0;}
  .party-name span{font-weight:400; color:var(--ink-faint); font-size:12.5px;}
  .party-card-row{display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px; padding:10px 0; border-bottom:0.5px solid var(--line);}
  .party-card-row:last-child{border-bottom:none;}
  .party-meta{font-size:12.5px; color:var(--ink-soft); margin:3px 0 0;}
  .session-avatar{width:44px; height:44px; border-radius:50%; background:var(--oxblood-deep); color:var(--gold-soft); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; flex-shrink:0;}
  .doc-item:last-child{border-bottom:none;}
  .doc-check{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line-strong); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--jade); transition:all 0.15s;}
  .doc-check.done{background:var(--jade); border-color:var(--jade); color:#fff;}
  .doc-owner{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.4px; margin-right:6px;}
  .task-row{display:flex; gap:12px; padding:10px 0; border-bottom:0.5px solid var(--line); align-items:flex-start;}
  .progress-track{height:8px; border-radius:5px; background:var(--stone); overflow:hidden; margin:4px 0 14px;}
  .progress-fill{height:100%; border-radius:5px; background:var(--jade); transition:width 0.2s;}
  .task-row:last-child{border-bottom:none;}
  .task-stamp{flex-shrink:0; width:30px; height:30px; border-radius:50%; border:2px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-size:11px; cursor:pointer; background:var(--stone-card); color:var(--ink-faint);}
  .task-stamp.progress{border-color:var(--clay); color:var(--clay);}
  .task-stamp.done{border-color:var(--gold); color:var(--gold); background:var(--gold-soft);}

  /* ---- Portal: dashboard de operaciones + resumen enriquecido de la operación abierta ---- */
  .op-scroller{display:flex; gap:12px; overflow-x:auto; padding:2px 2px 8px;}
  .op-card{flex:0 0 220px; background:var(--stone-card); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer; transition:border-color 0.15s ease, background 0.15s ease;}
  .op-card:hover{border-color:var(--gold);}
  .op-card.active{border-color:var(--oxblood); background:var(--gold-soft);}
  .op-card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .op-role{font-size:10.5px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:var(--oxblood);}
  .op-check{width:18px; height:18px; border-radius:50%; background:var(--oxblood); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--gold-soft);}
  .op-check svg{width:11px; height:11px;}
  .op-title{font-size:14.5px; font-weight:600; margin:0 0 3px;}
  .op-addr{font-size:12px; color:var(--ink-soft); margin:0 0 10px;}
  .op-bar{height:4px; background:var(--line); border-radius:999px; overflow:hidden; margin-bottom:5px;}
  .op-bar-fill{height:100%; background:var(--oxblood); border-radius:999px;}
  .op-pct{font-size:11px; color:var(--ink-faint);}

  .stepper{display:flex; align-items:flex-start; margin:18px 0 20px;}
  .step{flex:1; display:flex; flex-direction:column; align-items:center; position:relative; text-align:center;}
  .step:not(:last-child)::after{content:""; position:absolute; top:13px; left:calc(50% + 20px); width:calc(100% - 40px); height:2px; background:var(--line);}
  .step.done:not(:last-child)::after{background:var(--oxblood);}
  .step-dot{width:26px; height:26px; border-radius:50%; background:var(--stone-card); border:2px solid var(--line-strong); display:flex; align-items:center; justify-content:center; z-index:1; margin-bottom:7px; color:var(--ink-faint); font-size:11px; font-weight:600;}
  .step.done .step-dot{background:var(--oxblood); border-color:var(--oxblood); color:var(--gold-soft);}
  .step.current .step-dot{border-color:var(--oxblood); color:var(--oxblood);}
  .step-label{font-size:11px; font-weight:500; color:var(--ink-soft); max-width:92px; line-height:1.3;}
  .step.current .step-label{color:var(--oxblood); font-weight:600;}

  /* Cajas de resumen — cada dato en su propia tarjeta con borde (más
     legible que bloques grises pegados) y el número grande al frente. */
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}

// Toast (esquina inferior derecha, se va solo) — reemplaza alert() para
// confirmaciones y errores; los errores duran más para alcanzar a leerlos.
// Vive fuera de #body para sobrevivir a los render().
function showToast(message, type = 'info'){
  let stack = document.getElementById('toast-stack');
  if(!stack){
    stack = document.createElement('div');
    stack.id = 'toast-stack';
    document.body.appendChild(stack);
  }
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
  const icon = type === 'error' ? 'ti-alert-circle' : type === 'success' ? 'ti-circle-check' : 'ti-info-circle';
  toast.innerHTML = `<i class="ti ${icon}" aria-hidden="true"></i><span></span>`;
  toast.querySelector('span').textContent = message;
  stack.appendChild(toast);
  const ttl = type === 'error' ? 6000 : 3500;
  setTimeout(() => {
    toast.classList.add('leaving');
    setTimeout(() => toast.remove(), 300);
  }, ttl);
}

// Reemplazo estilizado de confirm() — devuelve una promesa true/false.
// `danger: true` pinta el botón de confirmar en rojo (borrar, quitar...).
function confirmDialog(message, { danger = false, confirmLabel } = {}){
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'dialog-overlay';
    overlay.innerHTML = `
      <div class="dialog-box">
        <p></p>
        <div class="dialog-actions">
          <button class="btn dlg-cancel">${t('cancel')}</button>
          <button class="btn ${danger ? 'danger' : 'primary'} dlg-ok">${confirmLabel || t('confirmLabel')}</button>
        </div>
      </div>
    `;
    overlay.querySelector('p').textContent = message;
    const close = (val) => { overlay.remove(); window.removeEventListener('keydown', onKey); resolve(val); };
    const onKey = (e) => { if(e.key === 'Escape') close(false); if(e.key === 'Enter') close(true); };
    overlay.onclick = (e) => { if(e.target === overlay) close(false); };
    overlay.querySelector('.dlg-cancel').onclick = () => close(false);
    overlay.querySelector('.dlg-ok').onclick = () => close(true);
    window.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
    overlay.querySelector('.dlg-ok').focus();
  });
}

// Estado de carga en botones de acciones lentas (generar PDF, mandar a
// firma): deshabilita, muestra spinner conservando el ancho, y restaura al
// terminar — el usuario ve que algo está pasando y no puede dar doble clic.
async function withButtonLoading(btn, fn){
  const original = btn.innerHTML;
  const width = btn.offsetWidth;
  btn.disabled = true;
  btn.style.minWidth = width + 'px';
  btn.innerHTML = '<span class="btn-spinner"></span>';
  try{
    return await fn();
  } finally {
    btn.disabled = false;
    btn.style.minWidth = '';
    btn.innerHTML = original;
  }
}

async function apiFetch(path, options={}){
  let res;
  try{
    res = await fetch(API_BASE + path, {
      credentials: 'include',
      headers: {'Content-Type':'application/json'},
      ...options
    });
  }catch(e){
    // fetch solo lanza por red caída/servidor inalcanzable — "Failed to
    // fetch" crudo no le dice nada a nadie; esto sí.
    throw new Error(t('networkError'));
  }
  let body = null;
  try{ body = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((body && body.error) || `Error ${res.status}`);
  return body;
}

// Como apiFetch, pero para subir archivos (FormData) — no fuerza
// Content-Type: application/json, así el navegador pone el boundary de
// multipart automáticamente.
async function apiUpload(path, formData){
  let res;
  try{
    res = await fetch(API_BASE + path, { method:'POST', credentials:'include', body: formData });
  }catch(e){
    throw new Error(t('networkError'));
  }
  let body = null;
  try{ body = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((body && body.error) || `Error ${res.status}`);
  return body;
}

function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function pctDocs(deal){
  if(!deal._loaded) return deal._counts.documentsTotal ? Math.round(deal._counts.documentsDone/deal._counts.documentsTotal*100) : 0;
  const done = deal.documents.filter(d=>d.status==='done').length;
  return deal.documents.length ? Math.round(done/deal.documents.length*100) : 0;
}
function pctTasks(deal){
  if(!deal._loaded) return deal._counts.tasksTotal ? Math.round(deal._counts.tasksDone/deal._counts.tasksTotal*100) : 0;
  const done = deal.tasks.filter(t=>t.status==='done').length;
  return deal.tasks.length ? Math.round(done/deal.tasks.length*100) : 0;
}
// Un solo % que combina documentos + tracker — para la barra de una sola
// línea de las tarjetas de operación del Portal (ahí no hace falta el
// desglose en dos, solo un vistazo rápido de qué tan avanzada va).
function overallPct(deal){
  if(!deal._loaded){
    const total = deal._counts.documentsTotal + deal._counts.tasksTotal;
    const done = deal._counts.documentsDone + deal._counts.tasksDone;
    return total ? Math.round(done/total*100) : 0;
  }
  const total = deal.documents.length + deal.tasks.length;
  const done = deal.documents.filter(d=>d.status==='done').length + deal.tasks.filter(t=>t.status==='done').length;
  return total ? Math.round(done/total*100) : 0;
}

    </div>
  `;
  el.appendChild(box);
  box.querySelector('#side-logout').onclick = logout;
  box.querySelector('#side-prof').onclick = () => {
    profileEditOpen = !profileEditOpen;
    if(profileEditOpen && mainTab === 'admin' && (activeDealId || adminView === 'newDeal')){ activeDealId = null; adminView = 'list'; }
    render();
  };
}

function buildSidebar(){
  const el = document.getElementById('sidebar');
  el.innerHTML = '';
  el.style.display = authenticated ? '' : 'none';
  document.getElementById('menu-toggle').style.visibility = authenticated ? 'visible' : 'hidden';
  if(!authenticated){ setSidebarOpen(false); return; }

  if(mainTab === 'admin'){
    sidebarGroup(t('sideMain'));
    sidebarItem({ label: t('navDashboard'), icon: 'ti-layout-dashboard', active: adminView === 'dashboard',
      onClick: () => { adminView='dashboard'; activeDealId=null; loadDashboard(); } });
    sidebarItem({ label: t('navOperations'), icon: 'ti-building-estate', active: adminView === 'list' || !!activeDealId || adminView === 'newDeal',
      onClick: () => { adminView='list'; activeDealId=null; render(); } });
    if(currentUser.role === 'admin'){
      sidebarItem({ label: t('navTeam'), icon: 'ti-users', count: pendingUsers && pendingUsers.length, active: adminView === 'team',
        onClick: () => { adminView='team'; activeDealId=null; render(); } });
      sidebarItem({ label: t('navClients'), icon: 'ti-address-book', active: adminView === 'clients',
        onClick: () => { adminView='clients'; activeDealId=null; render(); } });
      sidebarItem({ label: t('navTrash'), icon: 'ti-trash', count: trashedDeals && trashedDeals.length, active: adminView === 'trash',
        onClick: () => { adminView='trash'; activeDealId=null; loadTrash(); } });
    }
  }
}

function render(){
  const viewKey = currentViewKey();
  const sameView = viewKey === _lastViewKey;
  // El scroll ahora vive en la columna de contenido, no en la ventana (el
  // armazón es de altura fija para que el menú lateral llegue hasta abajo).
  const scroller = document.getElementById('body');
  const scrollY = scroller ? scroller.scrollTop : 0;
  _lastViewKey = viewKey;
  renderInner();
  if(sameView){
    if(scroller) scroller.scrollTop = scrollY;
  } else {
    if(scroller) scroller.scrollTop = 0;
  }
}

function renderInner(){
  document.getElementById('mainTabs').style.visibility = authenticated ? 'visible' : 'hidden';
  document.getElementById('header-logout').style.display = authenticated ? '' : 'none';
  updateNotifBadge();
  if(!authenticated && notifOpen){ notifOpen = false; renderNotifPanel(); }
  document.getElementById('tab-admin').textContent = currentUser && currentUser.role === 'admin' ? t('tabAdmin') : t('tabStaffOperations');
  document.getElementById('tab-portal').textContent = t('tabPortal');
  document.getElementById('navbar-caption').textContent = t('gateBrandEyebrow');
  document.getElementById('lang-toggle').textContent = lang === 'es' ? 'EN' : 'ES';
  document.getElementById('lang-toggle').onclick = () => setLang(lang === 'es' ? 'en' : 'es');
  document.documentElement.lang = lang;
  // La pantalla de login/registro/olvide-contrasena es de pantalla completa
  // (split-screen), sin el head-band de arriba ni el padding normal del
  // body-wrap -- se restauran en cuanto hay sesion.
  document.querySelector('.head-band').style.display = authenticated ? '' : 'none';
  const body = document.getElementById('body');
  body.style.padding = authenticated ? '' : '0';
  body.innerHTML = '';
  buildSidebar();
  if(checkingSession){
    body.innerHTML = `<div class="empty"><i class="ti ti-loader-2" aria-hidden="true"></i><div>${t('checkingSession')}</div></div>`;
    return;
  }
  if(!authenticated){
    renderLogin(body);
    return;
  }
  document.querySelectorAll('#mainTabs .tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===mainTab));
  // Admin/agente ven ambas pestañas; comprador/vendedor solo el portal.
  const adminTabBtn = document.querySelector('#mainTabs [data-tab="admin"]');
  if(adminTabBtn) adminTabBtn.style.display = ['admin','agent','lawyer','external_lawyer'].includes(currentUser.role) ? '' : 'none';
  if(mainTab === 'admin') renderAdmin(body);
  else renderPortal(body);
  // Al final, para que quede hasta abajo del menú: las secciones de la
  // operación abierta se agregan durante renderAdmin/renderPortal.
  buildSidebarAccount();
}

function wirePasswordToggle(wrap, inputId, toggleId){
  const input = wrap.querySelector('#'+inputId);
  const btn = wrap.querySelector('#'+toggleId);
  btn.onclick = () => {
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.textContent = input.type === 'password' ? t('showPassword') : t('hidePassword');
  };
}

function renderLogin(body){
  if(authView === 'register'){ renderRegister(body); return; }
  if(authView === 'forgot'){ renderForgotPassword(body); return; }
  if(authView === 'totp'){ renderTotp(body); return; }

  const wrap = buildGateShell(`
    <p class="gate-eyebrow-small">${t('gateWelcomeBack')}</p>
    <div class="gate-title">${t('loginTitle')}</div>
    <div class="gate-sub">${t('loginGateSub')}</div>
    <div class="gate-error">${escapeHtml(loginError)}</div>
    ${registerSuccess ? `<div class="field-hint" style="color:var(--jade); margin-bottom:8px;">${escapeHtml(registerSuccess)}</div>` : ''}
    <label class="gate-field-label" for="login-email">${t('emailLabel')}</label>
    <input type="email" id="login-email" placeholder="${t('loginEmailPh')}" autocomplete="username">
    <label class="gate-field-label" for="login-password">${t('passwordLabel')}</label>
    <div class="pw-wrap">
      <input type="password" id="login-password" placeholder="${t('loginPasswordPh')}" autocomplete="current-password">
      <button type="button" class="pw-toggle" id="login-pw-toggle">${t('showPassword')}</button>
    </div>
    <div class="field-hint" style="text-align:right; margin:-6px 0 16px;"><a href="#" id="go-forgot">${t('forgotPasswordLink')}</a></div>
    <button class="btn primary" id="login-submit" ${loginLoading ? 'disabled' : ''}>${loginLoading ? t('loginSubmitting') : t('loginSubmit')}</button>
    <div class="field-hint" style="text-align:center; margin-top:16px;">${t('loginNoAccount')} <a href="#" id="go-register">${t('loginCreateAccount')}</a></div>
  `);
  body.appendChild(wrap);
  const submit = async () => {
    const email = wrap.querySelector('#login-email').value.trim();
    const password = wrap.querySelector('#login-password').value;
    if(!email || !password){ loginError = t('loginErrFields'); render(); return; }
    loginLoading = true; loginError=''; render();
    try{
      const result = await apiFetch('/api/auth/login', {method:'POST', body: JSON.stringify({email, password, lang})});
      loginLoading = false;
      if(result.twoFactor){
        pendingTotp = { method: result.method, qrCode: result.qrCode, secret: result.secret, setupMode: result.method === 'choose' };
        totpCode = ''; totpError = '';
        authView = 'totp';
        render();
        return;
      }
      currentUser = result;
      authenticated = true;
      registerSuccess = '';
      mainTab = (result.role === 'buyer' || result.role === 'seller') ? 'portal' : 'admin';
      await loadData();
    }catch(e){
      loginLoading = false;
      loginError = e.message === 'Failed to fetch' ? t('loginErrConnection') : e.message;
      render();
    }
  };
  wrap.querySelector('#login-submit').onclick = submit;
  wrap.querySelector('#login-password').onkeydown = (e) => { if(e.key==='Enter') submit(); };
  wrap.querySelector('#go-register').onclick = (e) => { e.preventDefault(); authView='register'; loginError=''; render(); };
  wrap.querySelector('#go-forgot').onclick = (e) => { e.preventDefault(); authView='forgot'; loginError=''; forgotMessage=''; render(); };
  wirePasswordToggle(wrap, 'login-password', 'login-pw-toggle');
}

// Segundo paso obligatorio del login (ver POST /api/auth/login y
// /api/auth/totp en routes/auth.js) — pendingTotp.setup distingue entre
// "todavía no tiene 2FA, aquí está el QR para armarlo" y "ya lo tiene, solo
// pide el código". La cuenta y la contraseña ya quedaron validadas en este
// punto; lo único que falta es confirmar el código de la app.
function renderTotp(body){
  if(!pendingTotp){ authView='login'; render(); return; }
  if(pendingTotp.method === 'choose'){ renderTotpChoice(body); return; }
  const method = pendingTotp.method; // 'totp' | 'email'
  const showQr = method === 'totp';
  const intro = method === 'email' ? t('totpIntroEmailSent') : (pendingTotp.setupMode ? t('totpIntroSetup') : t('totpIntroVerify'));
  const wrap = buildGateShell(`
    <div class="gate-title">${t('totpTitle')}</div>
    <div class="gate-sub">${intro}</div>
    <div class="gate-error">${escapeHtml(totpError)}</div>
    ${showQr ? `
      <div style="text-align:center; margin-bottom:14px;" id="totp-qr-wrap">
        <img src="${pendingTotp.qrCode}" style="width:180px; height:180px;" alt="QR">
        <div class="field-hint" style="margin-top:6px;">${t('totpManualLabel')}</div>
        <code style="font-size:13px; letter-spacing:1px;">${escapeHtml(pendingTotp.secret)}</code>
      </div>
    ` : ''}
    <label class="gate-field-label" for="totp-code">${t('totpCodeLabel')}</label>
    <input type="text" id="totp-code" inputmode="numeric" autocomplete="one-time-code" placeholder="${t('totpCodePh')}" style="text-align:center; font-size:20px; letter-spacing:4px;" value="${escapeHtml(totpCode)}">
    <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; margin:12px 0 0; cursor:pointer;">
      <input type="checkbox" id="totp-remember" ${totpRemember ? 'checked' : ''}> ${t('rememberDeviceLabel')}
    </label>
    <button class="btn primary" id="totp-submit" style="margin-top:14px;" ${totpLoading ? 'disabled' : ''}>${totpLoading ? t('loginSubmitting') : t('totpSubmit')}</button>
    <div class="field-hint" style="text-align:center; margin-top:12px;">
      ${method === 'email' ? `<a href="#" id="totp-resend">${totpEmailSending ? t('totpSending') : t('totpResendCode')}</a><br>` : ''}
      ${pendingTotp.setupMode ? `<a href="#" id="totp-change-method">${t('totpChangeMethod')}</a><br>` : ''}
      <a href="#" id="totp-back">${t('backToLogin')}</a>
    </div>
  `);
  body.appendChild(wrap);
  const codeInput = wrap.querySelector('#totp-code');
  codeInput.focus();
  const submit = async () => {
    const code = codeInput.value.trim();
    if(!code){ totpError = t('totpErrCode'); render(); return; }
    totpLoading = true; totpError=''; render();
    try{
      const remember = document.getElementById('totp-remember')?.checked;
      const user = await apiFetch('/api/auth/totp', { method:'POST', body: JSON.stringify({ code, method: pendingTotp.method === 'email' ? 'email' : 'totp', remember }) });
      pendingTotp = null;
      currentUser = user;
      authenticated = true;
      mainTab = (user.role === 'buyer' || user.role === 'seller') ? 'portal' : 'admin';
      totpLoading = false;
      await loadData();
    }catch(e){
      totpLoading = false;
      totpError = e.message;
      render();
    }
  };
  wrap.querySelector('#totp-submit').onclick = submit;
  wrap.querySelector('#totp-remember').onchange = (e) => { totpRemember = e.target.checked; };
  codeInput.onkeydown = (e) => { if(e.key==='Enter') submit(); };
  const resendBtn = wrap.querySelector('#totp-resend');
  if(resendBtn) resendBtn.onclick = async (e) => {
    e.preventDefault();
    if(totpEmailSending) return;

  `);
  body.appendChild(wrap);

  const agencySelect = wrap.querySelector('#reg-agency');
  const agencyOtherInput = wrap.querySelector('#reg-agency-other');
  const roleSelect = wrap.querySelector('#reg-role');

      const result = await apiFetch('/api/auth/register', { method:'POST', body: JSON.stringify({name, email, password, role, agency, agencyOther}) });
      registerLoading = false;
      authView = 'login';
      registerSuccess = result.message;
      render();
    }catch(e){
      registerLoading = false;
      registerError = e.message;
      render();
    }
  };
}

// Círculo con foto (si el usuario subió una) o iniciales — `user` puede ser
// currentUser ({id, avatarUrl}) o un agente de una operación ({userId,
// avatarUrl}).
function avatarHtml(user, size){
  const s = size || 44;
  const style = `width:${s}px; height:${s}px; font-size:${Math.max(10, Math.round(s/3.2))}px; flex-shrink:0;`;
  if(user && user.avatarUrl){
    return `<span class="session-avatar" style="${style} overflow:hidden;"><img src="/api/users/${user.userId || user.id}/avatar" alt="" style="width:100%; height:100%; object-fit:cover; display:block;"></span>`;
  }
  return `<span class="session-avatar" style="${style}">${escapeHtml(personInitials(user && user.name || ''))}</span>`;
}

let profileEditOpen = false;

function buildProfileEditor(){
  const box = document.createElement('div');
  box.style.cssText = 'margin-top:14px; padding-top:14px; border-top:0.5px solid var(--line); display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px; width:100%;';
  const isFacilitator = ['agent','external_lawyer'].includes(currentUser.role);
  box.innerHTML = `
    <label>${t('profileName')}<input type="text" id="prof-name" value="${escapeHtml(currentUser.name||'')}" maxlength="200"></label>
    <label>${t('profilePhone')}<input type="text" id="prof-phone" value="${escapeHtml(currentUser.phone||'')}" maxlength="30" placeholder="+52 ..."></label>
    <label>${t('profileAgency')}<input type="text" id="prof-agency" value="${escapeHtml(currentUser.agency||'')}" maxlength="200" ${isFacilitator ? '' : `placeholder="${t('profileAgencyOptional')}"`}></label>
    <label>${t('profileBio')}<input type="text" id="prof-bio" value="${escapeHtml(currentUser.bio||'')}" maxlength="600" placeholder="${t('profileBioPh')}"></label>
    <label>${t('profilePhoto')}<input type="file" id="prof-avatar" accept="image/png,image/jpeg,image/webp"></label>
    <div style="display:flex; gap:8px; align-items:flex-end;">
      <button class="btn primary" id="prof-save"><i class="ti ti-check" aria-hidden="true"></i> ${t('save')}</button>
      ${currentUser.avatarUrl ? `<button class="btn" id="prof-remove-avatar"><i class="ti ti-photo-off" aria-hidden="true"></i> ${t('profileRemovePhoto')}</button>` : ''}
    </div>
  `;
  box.querySelector('#prof-save').onclick = (e) => withButtonLoading(e.currentTarget, async () => {
    const payload = {
      name: box.querySelector('#prof-name').value.trim(),
      phone: box.querySelector('#prof-phone').value.trim(),
      agency: box.querySelector('#prof-agency').value.trim(),
      bio: box.querySelector('#prof-bio').value.trim()
    };
    if(!payload.name){ showToast(t('profileNameRequired'), 'error'); return; }
    let r = await fetch('/api/users/me/profile', { method:'PATCH', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify(payload) });
    if(!r.ok){ const j = await r.json().catch(()=>({})); showToast(j.error || t('genericError'), 'error'); return; }
    const file = box.querySelector('#prof-avatar').files[0];
    if(file){
      const fd = new FormData(); fd.append('avatar', file);
      r = await fetch('/api/users/me/avatar', { method:'POST', credentials:'include', body: fd });
      if(!r.ok){ const j = await r.json().catch(()=>({})); showToast(j.error || t('genericError'), 'error'); return; }
    }
    const me = await fetch('/api/auth/me', { credentials:'include' }).then(x=>x.json());
    currentUser = { ...currentUser, ...me };
    profileEditOpen = false;
    showToast(t('profileSaved'), 'success');
    render();
  });
  const removeBtn = box.querySelector('#prof-remove-avatar');
  if(removeBtn) removeBtn.onclick = (e) => withButtonLoading(e.currentTarget, async () => {
    await fetch('/api/users/me/avatar', { method:'DELETE', credentials:'include' });
    currentUser.avatarUrl = null;
    showToast(t('profileSaved'), 'success');
    render();
  });
  return box;
}

function renderAdmin(body){
  if(adminView === 'list' || adminView === 'dashboard' || adminView === 'team' || adminView === 'clients' || adminView === 'trash' || adminView === null){
    // La tarjeta de sesión se fue al pie del menú lateral (quien la ve todo
    // el día ya sabe quién es); aquí solo aparece el editor de perfil
    // cuando lo abre a propósito.
    if(profileEditOpen){
      const profCard = document.createElement('div');
      profCard.className = 'card';
      profCard.innerHTML = `<div class="section-title" style="margin:0;">${t('editProfile')}</div>`;
      profCard.appendChild(buildProfileEditor());
      body.appendChild(profCard);
    }
  }

  if(adminView === 'team'){
    body.appendChild(buildTeamSection());
    return;
  }

  if(adminView === 'clients'){
    body.appendChild(buildClientsSection());
    return;
  }

  if(adminView === 'trash'){
    body.appendChild(buildTrashSection());
    return;
  }

  const deal = deals.find(d=>d.id===activeDealId);
  if(adminView === 'newDeal'){
    body.appendChild(buildNewDealForm());
    return;
  }
  if(deal){
    body.appendChild(buildAdminDealDetail(deal));
    return;
  }
  if(adminView === 'dashboard'){
    body.appendChild(buildDashboard());
    return;
  }

  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = t('operationsTitle');
  body.appendChild(title);

  const addBtn = document.createElement('button');
  addBtn.className = 'btn primary';
  addBtn.style.marginBottom = '14px';
  addBtn.innerHTML = `<i class="ti ti-plus" aria-hidden="true"></i> ${t('newDeal')}`;
  addBtn.onclick = () => { adminView = 'newDeal'; render(); };
  body.appendChild(addBtn);

  const activeCount = deals.filter(d => (d.status||'active') === 'active').length;
  const completedCount = deals.filter(d => d.status === 'completed').length;
  const filterRow = document.createElement('div');
  filterRow.style.cssText = 'display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center;';
  filterRow.innerHTML = `
    <button class="btn ${dealsListFilter==='active'?'primary':''}" id="deals-filter-active">${t('dealsFilterActive')} (${activeCount})</button>
    <button class="btn ${dealsListFilter==='completed'?'primary':''}" id="deals-filter-completed">${t('dealsFilterCompleted')} (${completedCount})</button>
    <input type="text" id="deals-search" placeholder="${t('dealsSearchPh')}" value="${escapeHtml(dealsSearch)}" style="flex:1; min-width:200px; font-size:13px; padding:7px 12px;">
  `;
  body.appendChild(filterRow);
  filterRow.querySelector('#deals-filter-active').onclick = () => { dealsListFilter = 'active'; render(); };
  filterRow.querySelector('#deals-filter-completed').onclick = () => { dealsListFilter = 'completed'; render(); };
  filterRow.querySelector('#deals-search').oninput = (e) => {
    dealsSearch = e.target.value;
    const cursor = e.target.selectionStart;
    render();
    const el = document.getElementById('deals-search');
    if(el){ el.focus(); el.setSelectionRange(cursor, cursor); }
  };

  // Búsqueda por inmueble, cualquier parte (vendedor/comprador), agente o
  // desarrollo — todo ya viene en el resumen de cada operación, así que el
  // filtro es instantáneo, sin viaje al servidor.
  const search = dealsSearch.trim().toLowerCase();
  const matchesSearch = (d) => !search
    || d.property.toLowerCase().includes(search)
    || d.parties.some(p => p.name.toLowerCase().includes(search))
    || (d.agents || []).some(a => (a.name || '').toLowerCase().includes(search))
    || (DEVELOPMENT_LABEL[d.development||'punta_mita'] || '').toLowerCase().includes(search);
  const visibleDeals = deals.filter(d => (d.status||'active') === dealsListFilter && matchesSearch(d));
  if(!visibleDeals.length){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `<i class="ti ti-building-estate" aria-hidden="true"></i><div>${search ? t('noDealsMatchSearch') : (dealsListFilter==='completed' ? t('emptyCompletedDeals') : t('emptyDeals'))}</div>`;
    body.appendChild(empty);
    return;
  }
  visibleDeals.forEach(d => {
    const s = SCENARIOS[d.scenario];
    const canManageDeal = ['admin','agent','lawyer','external_lawyer'].includes(currentUser.role);
    const card = document.createElement('div');
    card.className = 'deal-card';
    card.innerHTML = `
      ${canManageDeal ? `<button class="deal-card-menu-btn" id="menu-btn-${d.id}" title="${t('dealMenu')}"><i class="ti ti-dots-vertical" aria-hidden="true"></i></button>` : ''}
      <div class="deal-title">${escapeHtml(d.property)}</div>
      <div class="deal-sub">${escapeHtml(dealPartyNames(d,'seller'))} → ${escapeHtml(dealPartyNames(d,'buyer'))} · ${d.currency||'USD'} ${Number(d.price||0).toLocaleString()}${d.furniturePrice ? ' + '+Number(d.furniturePrice).toLocaleString()+' muebles' : ''}</div>
      <span class="badge ${s.badgeClass}">${s.labelShort}</span>
      <span class="badge" style="background:var(--stone); border:0.5px solid var(--line); color:var(--ink-soft); margin-left:4px;">${DEVELOPMENT_LABEL[d.development||'punta_mita'].split(' (')[0]}</span>
      ${d.status==='completed' ? `<span class="badge" style="background:var(--jade-soft); color:var(--jade); margin-left:4px;">${t('dealCompletedBadge')}</span>` : ''}
      <div class="deal-sub" style="margin-top:6px;">Docs: ${pctDocs(d)}% · Tracker: ${pctTasks(d)}%</div>
      ${dealMenuOpenFor === d.id ? `
        <div class="deal-card-menu" id="menu-${d.id}">
          <button id="menu-edit-${d.id}"><i class="ti ti-pencil" aria-hidden="true"></i> ${t('editDeal')}</button>
          <button id="menu-status-${d.id}"><i class="ti ti-${d.status==='completed'?'rotate':'check'}" aria-hidden="true"></i> ${d.status==='completed' ? t('reopenDeal') : t('markDealCompleted')}</button>
          <button class="danger" id="menu-delete-${d.id}"><i class="ti ti-trash" aria-hidden="true"></i> ${t('deleteDeal')}</button>
        </div>
      ` : ''}
    `;
    card.onclick = () => { activeDealId = d.id; openDeal(d.id); };
    const menuBtn = card.querySelector(`#menu-btn-${d.id}`);
    if(menuBtn) menuBtn.onclick = (e) => {
      e.stopPropagation();
      dealMenuOpenFor = dealMenuOpenFor === d.id ? null : d.id;
      render();
    };
    const menuEl = card.querySelector(`#menu-${d.id}`);
    if(menuEl){
      menuEl.onclick = (e) => e.stopPropagation();
      menuEl.querySelector(`#menu-edit-${d.id}`).onclick = async () => {
        dealMenuOpenFor = null;
        activeDealId = d.id;
        await openDeal(d.id);
      };
      menuEl.querySelector(`#menu-status-${d.id}`).onclick = async () => {
        dealMenuOpenFor = null;
        const nextStatus = d.status === 'completed' ? 'active' : 'completed';
        if(nextStatus === 'completed' && !await confirmDialog(t('confirmMarkCompleted'))) return;
        try{
          await apiFetch(`/api/deals/${d.id}`, { method:'PATCH', body: JSON.stringify({ status: nextStatus }) });
          d.status = nextStatus;
          render();
        }catch(err){ showToast(err.message, 'error'); }
      };
      menuEl.querySelector(`#menu-delete-${d.id}`).onclick = async () => {
        dealMenuOpenFor = null;
        if(!await confirmDialog(t('confirmDeleteDeal'), { danger: true })) return;
        try{
          await apiFetch(`/api/deals/${d.id}`, { method: 'DELETE' });
          deals = deals.filter(x => x.id !== d.id);
          if(currentUser.role === 'admin') loadTrash();
          render();
        }catch(err){ showToast(err.message, 'error'); }
      };
    }
    body.appendChild(card);
  });
}


// Colores por urgencia (no por % de avance) — entre menos días falten para
// el cierre, más "caliente" el color, independientemente de qué tan
// avanzada esté la operación (una operación al 90% que cierra mañana sigue
// necesitando atención esta semana).
function closingUrgencyColor(daysToClose){
  if (daysToClose <= 7) return { ring: 'var(--oxblood)', pillBg: 'var(--oxblood-soft)', pillFg: 'var(--oxblood)' };
  if (daysToClose <= 21) return { ring: 'var(--gold)', pillBg: 'var(--gold-soft)', pillFg: '#6B4E1E' };
  return { ring: 'var(--jade)', pillBg: 'var(--jade-soft)', pillFg: 'var(--jade)' };
}

function buildUpcomingClosings(closings){
  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; margin-bottom:16px;';
  closings.forEach(c => {
    const colors = closingUrgencyColor(c.daysToClose);
    const card = document.createElement('div');
    card.className = 'card';
    card.style.cssText = 'display:flex; align-items:center; gap:14px; cursor:pointer; margin-bottom:0;';
    const pct = Math.max(0, Math.min(100, c.percent));
    const daysLabel = c.daysToClose < 0 ? t('closingOverdue')
      : c.daysToClose === 0 ? t('closingToday')
      : c.daysToClose === 1 ? t('daysToCloseSingular', { days: c.daysToClose })
      : t('daysToClosePlural', { days: c.daysToClose });
    card.innerHTML = `
      <div style="width:70px; height:70px; border-radius:50%; flex-shrink:0; background:conic-gradient(${colors.ring} ${pct}%, var(--line) ${pct}% 100%); display:flex; align-items:center; justify-content:center;">
        <div style="width:52px; height:52px; border-radius:50%; background:var(--stone-card); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:15px;">${pct}%</div>
      </div>
      <div style="min-width:0;">
        <div style="font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(c.property)}</div>
        <span class="badge" style="background:${colors.pillBg}; color:${colors.pillFg}; margin-top:6px;">${escapeHtml(daysLabel)}</span>
      </div>
    `;
    card.onclick = () => { adminView='list'; activeDealId=c.dealId; openDeal(c.dealId); };
    grid.appendChild(card);
  });
  return grid;
}

      <div><div style="font-size:26px; font-weight:600; color:var(--oxblood-deep);">${d.documentsPending}</div><div class="field-hint" style="margin:0;">${t('statDocsPending')}</div></div>
      <div><div style="font-size:26px; font-weight:600; color:var(--oxblood-deep);">${d.tasksPending + d.tasksInProgress}</div><div class="field-hint" style="margin:0;">${t('statTasksUnfinished')}</div></div>
      <div><div style="font-size:26px; font-weight:600; color:var(--oxblood-deep);">${d.signaturesAwaiting.length}</div><div class="field-hint" style="margin:0;">${t('statAwaitingSignature')}</div></div>
    </div>
    ${d.dealsByScenario.length ? `<div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">${d.dealsByScenario.map(s=>`<span class="badge">${(SCENARIOS[s.scenario]&&SCENARIOS[s.scenario].labelShort)||s.scenario}: ${s.count}</span>`).join('')}</div>` : ''}
  `;
  wrap.appendChild(totalsCard);

  // "Mis tareas" — lo asignado A MÍ, primero que todo lo demás: un abogado
  // (o admin) entra al Dashboard y ve directo qué le toca sin abrir
  // operación por operación.
  if(d.myTasks && d.myTasks.length){
    const myTitle = document.createElement('div');
    myTitle.className = 'section-title'; myTitle.textContent = t('myTasksTitle', { count: d.myTasks.length });
    wrap.appendChild(myTitle);
    const myCard = document.createElement('div'); myCard.className = 'card';
    d.myTasks.forEach((item, i) => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:8px 0; cursor:pointer; gap:10px;' + (i < d.myTasks.length - 1 ? ' border-bottom:0.5px solid var(--line);' : '');
      row.innerHTML = `
        <span style="font-size:13px;">${escapeHtml(lang==='en'?item.label_en:item.label_es)} <span class="field-hint" style="margin:0;">· ${escapeHtml(item.property)}</span></span>
        <span class="field-hint" style="margin:0; flex-shrink:0;">${t('viewDeal')} <i class="ti ti-arrow-right" aria-hidden="true"></i></span>
      `;
      row.onclick = () => { adminView='list'; activeDealId=item.dealId; openDeal(item.dealId); };
      myCard.appendChild(row);
    });
    wrap.appendChild(myCard);
  }

  if(d.totalDeals > 0){
    const ucTitle = document.createElement('div');
    ucTitle.className = 'section-title'; ucTitle.textContent = t('upcomingClosings');
    wrap.appendChild(ucTitle);
    if(d.upcomingClosings && d.upcomingClosings.length){
      wrap.appendChild(buildUpcomingClosings(d.upcomingClosings));
    } else {
      const hint = document.createElement('div'); hint.className = 'card';
      hint.innerHTML = `<div class="field-hint" style="margin:0;">${t('noUpcomingClosingsHint')}</div>`;
      wrap.appendChild(hint);
    }
  }

  if(d.signaturesAwaiting.length){
    const signTitle = document.createElement('div');
    signTitle.className = 'section-title'; signTitle.textContent = t('awaitingSignature');
    wrap.appendChild(signTitle);
    const signCard = document.createElement('div'); signCard.className = 'card';
    d.signaturesAwaiting.forEach(item => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:0.5px solid var(--line); cursor:pointer; gap:10px;';
      row.innerHTML = `<span style="font-size:13px;">"${escapeHtml(lang==='en'?item.label_en:item.label_es)}" · ${escapeHtml(item.property)}</span><span class="badge" style="background:var(--gold-soft); color:#6B4E1E; flex-shrink:0;">${t('signature')}</span>`;
      row.onclick = () => { adminView='list'; activeDealId=item.dealId; openDeal(item.dealId); };
      signCard.appendChild(row);
    });
    wrap.appendChild(signCard);
  }

  const pendingTitle = document.createElement('div');
  pendingTitle.className = 'section-title'; pendingTitle.textContent = t('pendingByDeal');
  wrap.appendChild(pendingTitle);

  const groups = {};
  d.pendingDocuments.forEach(x => {
    if(!groups[x.dealId]) groups[x.dealId] = { property: x.property, docs: [], tasks: [] };
    groups[x.dealId].docs.push(x);
  });
  d.pendingTasks.forEach(x => {
    if(!groups[x.dealId]) groups[x.dealId] = { property: x.property, docs: [], tasks: [] };
    groups[x.dealId].tasks.push(x);
  });

  if(!Object.keys(groups).length){
    const emptyCard = document.createElement('div'); emptyCard.className = 'card';
    emptyCard.innerHTML = `<div class="field-hint" style="margin:0;">${t('noPending')}</div>`;
    wrap.appendChild(emptyCard);
  } else {
    Object.entries(groups).forEach(([dealId, g]) => {
      const card = document.createElement('div'); card.className = 'card';
      const totalCount = g.docs.length + g.tasks.length;
      // Sin tocar todavía: pocos pendientes arranca abierto, muchos arranca
      // cerrado — para que una operación con 15+ pendientes no siempre
      // ocupe toda la pantalla del Dashboard.
      const isExpanded = dashboardExpandedGroups[dealId] !== undefined ? dashboardExpandedGroups[dealId] : totalCount <= 4;
      const header = document.createElement('div');
      header.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; cursor:pointer;';
      header.innerHTML = `
        <span style="display:flex; align-items:center; gap:8px;">
          <button class="icon-btn" id="toggle-${dealId}" style="width:24px; height:24px; flex-shrink:0;" title="${t('toggleExpand')}"><i class="ti ti-chevron-${isExpanded?'down':'right'}" aria-hidden="true"></i></button>
          <span style="font-weight:600; font-size:13.5px;">${escapeHtml(g.property)}</span>
          <span class="field-hint" style="margin:0;">(${g.docs.length} ${t('docsCountLabel')} · ${g.tasks.length} ${t('tasksCountLabel')})</span>
        </span>
        <span class="field-hint" style="margin:0;">${t('viewDeal')} <i class="ti ti-arrow-right" aria-hidden="true"></i></span>
      `;
      header.onclick = () => { adminView='list'; activeDealId=Number(dealId); openDeal(Number(dealId)); };
      card.appendChild(header);
      header.querySelector(`#toggle-${dealId}`).onclick = (e) => {
        e.stopPropagation();
        dashboardExpandedGroups[dealId] = !isExpanded;
        render();
      };

      if(!isExpanded){ wrap.appendChild(card); return; }

      // Documentos y tareas separados con su propio sub-encabezado — antes
      // era una sola lista corrida y una operación con 37 pendientes se
      // veía como un solo número enorme en vez de, por ejemplo,
      // "22 documentos" y "15 tareas" por separado.
      if(g.docs.length){
        const docsSub = document.createElement('div');
        docsSub.style.cssText = 'font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-top:10px;';
        docsSub.textContent = `${t('docsCountLabel')} (${g.docs.length})`;
        card.appendChild(docsSub);
      }
      g.docs.forEach(doc => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:0.5px solid var(--line);';
        row.innerHTML = `
          <span class="doc-check" style="flex-shrink:0;"></span>
          <span style="font-size:12.5px; flex:1;">${t('docLabel')}: ${escapeHtml(localizeDocName(doc.name))} <span class="field-hint" style="margin:0;">(${doc.partyName ? escapeHtml(doc.partyName) + ' · ' + (doc.side==='seller'?t('sellerLabel'):t('buyerLabel')) : t('propertyLabel')})</span></span>
          ${doc.stale ? `<span class="badge" style="background:var(--oxblood-soft); color:var(--oxblood); flex-shrink:0;">${t('stale')}</span>` : ''}
        `;
        row.querySelector('.doc-check').onclick = async () => {
          try{
            await apiFetch(`/api/deals/${dealId}/documents/${doc.documentId}`, { method:'PATCH', body: JSON.stringify({status:'done'}) });
            await loadDashboard();
          }catch(e){ showToast(e.message, 'error'); }
        };
        card.appendChild(row);
      });

      if(g.tasks.length){
        const tasksSub = document.createElement('div');
        tasksSub.style.cssText = 'font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-top:10px;';
        tasksSub.textContent = `${t('tasksCountLabel')} (${g.tasks.length})`;
        card.appendChild(tasksSub);
      }
      g.tasks.forEach(task => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:0.5px solid var(--line);';
        const cls = task.status==='progress' ? 'progress' : '';
        row.innerHTML = `
          <div class="task-stamp ${cls}" style="width:22px; height:22px; font-size:10px; flex-shrink:0;">${task.status==='progress'?'<i class=\"ti ti-clock\" aria-hidden=\"true\"></i>':''}</div>
          <span style="font-size:12.5px; flex:1;">${t('taskLabel')}: ${escapeHtml(lang==='en'?task.label_en:task.label_es)}</span>
          ${task.stale ? `<span class="badge" style="background:var(--oxblood-soft); color:var(--oxblood); flex-shrink:0;">${t('stale')}</span>` : ''}
        `;
        // Confirmar un paso del tracker es solo de admin/abogado interno —
        // este widget del Dashboard también lo ve un agente/abogado externo.
        if(['admin','lawyer'].includes(currentUser.role)) row.querySelector('.task-stamp').onclick = async () => {
          const order=['pending','progress','done'];
          const next = order[(order.indexOf(task.status)+1)%order.length];
          try{
            await apiFetch(`/api/deals/${dealId}/tasks/${task.taskId}`, { method:'PATCH', body: JSON.stringify({status: next}) });
            await loadDashboard();
          }catch(e){ showToast(e.message, 'error'); }
        };
        card.appendChild(row);
      });

      wrap.appendChild(card);
    });
  }

  return wrap;
}

function buildTeamSection(){
  const wrap = document.createElement('div');

  const pendingTitle = document.createElement('div');
  pendingTitle.className = 'section-title'; pendingTitle.textContent = t('pendingApprovalTitle');
  wrap.appendChild(pendingTitle);
  const pendingCard = document.createElement('div'); pendingCard.className = 'card';
  if(pendingUsers === null){
    pendingCard.innerHTML = `<div class="field-hint" style="margin:0;">${t('loading')}</div>`;
    loadPendingUsers();
  } else if(!pendingUsers.length){
    pendingCard.innerHTML = `<div class="field-hint" style="margin:0;">${t('noPendingAccounts')}</div>`;
  } else {
    pendingUsers.forEach(u => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:0.5px solid var(--line); gap:10px;';
      row.innerHTML = `<span style="font-size:13px;">${escapeHtml(u.name)} <span class="field-hint" style="margin:0;">— ${escapeHtml(u.email)} · ${escapeHtml(roleDisplayLabel(u.role))}${u.agency ? ' · ' + escapeHtml(u.agency) : ''}</span></span>`;
      const approveBtn = document.createElement('button');
      approveBtn.className = 'btn primary'; approveBtn.textContent = t('approve');
      approveBtn.onclick = async () => {
        try{
          await apiFetch(`/api/users/${u.id}/approve`, { method:'PATCH' });
          await loadPendingUsers();
        }catch(e){ showToast(e.message, 'error'); }
      };
      row.appendChild(approveBtn);
      pendingCard.appendChild(row);
    });
  }
  wrap.appendChild(pendingCard);

  const activeTitle = document.createElement('div');
  activeTitle.className = 'section-title'; activeTitle.textContent = t('activeTeamTitle');
  wrap.appendChild(activeTitle);
  const activeCard = document.createElement('div'); activeCard.className = 'card';
  if(activeTeamMembers === null){
    activeCard.innerHTML = `<div class="field-hint" style="margin:0;">${t('loading')}</div>`;
  } else if(!activeTeamMembers.length){
    activeCard.innerHTML = `<div class="field-hint" style="margin:0;">${t('noActiveTeam')}</div>`;
  } else {
    activeCard.style.overflowX = 'auto';
    const table = document.createElement('table');
    table.className = 'data-table';
    table.innerHTML = `<thead><tr>
      <th>${t('nameLabel')}</th><th>${t('emailLabel')}</th><th>${t('roleLabel')}</th><th>${t('agencyLabel')}</th><th></th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');
    activeTeamMembers.forEach(u => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td></td><td></td><td></td><td></td><td></td>`;

      const nameCell = tr.children[0];
      const nameInput = document.createElement('input');
      nameInput.type = 'text'; nameInput.value = u.name; nameInput.placeholder = t('namePh');
      nameInput.style.cssText = 'font-size:12px; padding:4px 8px; width:140px;';
      nameCell.appendChild(nameInput);
      const emailCell = tr.children[1];
      const emailInput = document.createElement('input');
      emailInput.type = 'email'; emailInput.value = u.email; emailInput.placeholder = t('emailPh');
      emailInput.style.cssText = 'font-size:12px; padding:4px 8px; width:180px;';
      emailCell.appendChild(emailInput);
      tr.children[2].innerHTML = roleChipHtml(u.role);

      const actionsCell = tr.children[4];
      const profileErr = document.createElement('div');
      profileErr.className = 'gate-error'; profileErr.style.cssText = 'margin:0 0 4px; font-size:11px;';
      const profileSaveBtn = document.createElement('button');
      profileSaveBtn.className = 'btn'; profileSaveBtn.style.cssText = 'font-size:11px; margin-right:6px;'; profileSaveBtn.textContent = t('save');
      profileSaveBtn.onclick = async () => {
        profileErr.textContent = '';
        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        if(!name || !email){ profileErr.textContent = t('errNameOrEmail'); return; }
        profileSaveBtn.disabled = true;
        try{
          await apiFetch(`/api/users/${u.id}/profile`, { method:'PATCH', body: JSON.stringify({ name, email }) });
          u.name = name; u.email = email;
          profileSaveBtn.textContent = t('saved');
          setTimeout(() => { profileSaveBtn.textContent = t('save'); }, 1200);
        }catch(e){ profileErr.textContent = e.message; }
        profileSaveBtn.disabled = false;
      };
      actionsCell.appendChild(profileErr);
      actionsCell.appendChild(profileSaveBtn);

      // Solo agentes tienen agencia — de esto depende que el KYC de LPR
      // salga automático (dealAgentIsLprAgency en routes/kyc.js), así que
      // tiene que haber forma de corregirla después del alta/registro.
      const agencyCell = tr.children[3];
      if(u.role === 'agent'){
        const agencyDisplay = document.createElement('span');
        agencyDisplay.style.cssText = 'font-size:12px;';
        agencyDisplay.textContent = u.agency || '—';
        const editBtn = document.createElement('button');
        editBtn.className = 'btn'; editBtn.style.cssText = 'font-size:10.5px; padding:2px 6px; margin-left:6px;';
        editBtn.textContent = u.agency ? t('editAgency') : t('setAgency');
        const editWrap = document.createElement('div');
        editWrap.style.cssText = 'display:none; gap:6px; align-items:center; flex-wrap:wrap; margin-top:4px;';
        editWrap.innerHTML = `
          <select style="font-size:11.5px;">
            <option value="">${t('registerAgencyPlaceholderSelect')}</option>
            ${AGENCIES.map(a => `<option value="${escapeHtml(a)}" ${u.agency===a?'selected':''}>${escapeHtml(a)}</option>`).join('')}
            <option value="Otro" ${u.agency && !AGENCIES.includes(u.agency)?'selected':''}>${t('registerAgencyOther')}</option>
          </select>
          <input type="text" placeholder="${t('registerAgencyOtherPh')}" style="font-size:11.5px; width:100px; display:${u.agency && !AGENCIES.includes(u.agency)?'':'none'};" value="${u.agency && !AGENCIES.includes(u.agency)?escapeHtml(u.agency):''}">
          <button class="btn primary" style="font-size:10.5px; padding:2px 6px;">${t('saveChanges')}</button>
          <span class="gate-error" style="margin:0; font-size:10.5px;"></span>
        `;
        const [selectEl, otherEl] = editWrap.querySelectorAll('select, input[type=text]');
        const agencySaveBtn = editWrap.querySelector('button');
        const agencyErrEl = editWrap.querySelector('.gate-error');
        selectEl.onchange = () => { otherEl.style.display = selectEl.value === 'Otro' ? '' : 'none'; };
        editBtn.onclick = () => { editWrap.style.display = editWrap.style.display === 'none' ? 'flex' : 'none'; };
        agencySaveBtn.onclick = async () => {
          agencyErrEl.textContent = '';
          try{
            await apiFetch(`/api/users/${u.id}/agency`, {
              method:'PATCH', body: JSON.stringify({ agency: selectEl.value, agencyOther: otherEl.value.trim() })
            });
            await loadPendingUsers();
          }catch(e){ agencyErrEl.textContent = e.message; }
        };
        agencyCell.appendChild(agencyDisplay);
        agencyCell.appendChild(editBtn);
        agencyCell.appendChild(editWrap);
      } else {
        agencyCell.textContent = '—';
      }

      // Para cuando alguien pierde el teléfono donde tenía la app de 2FA
      // (o cambió de equipo) — sin esto no hay forma de que vuelva a entrar,
      // el código que genera su app vieja ya no sirve para nada.
      const reset2faBtn = document.createElement('button');
      reset2faBtn.className = 'btn'; reset2faBtn.style.fontSize = '11px';
      reset2faBtn.textContent = t('reset2fa');
      reset2faBtn.title = t('reset2faTitle');
      reset2faBtn.onclick = async () => {
        if(!await confirmDialog(t('reset2faConfirm', { name: u.name }))) return;
        reset2faBtn.disabled = true;
        try{
          await apiFetch(`/api/users/${u.id}/reset-2fa`, { method:'POST' });
          showToast(t('reset2faDone'), 'success');
        }catch(e){ showToast(e.message, 'error'); }
        reset2faBtn.disabled = false;
      };
      actionsCell.appendChild(reset2faBtn);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    activeCard.innerHTML = '';
    activeCard.appendChild(table);
  }
  wrap.appendChild(activeCard);

  const inviteTitle = document.createElement('div');
  inviteTitle.className = 'section-title'; inviteTitle.textContent = t('inviteAgentLawyer');
  wrap.appendChild(inviteTitle);
  const inviteCard = document.createElement('div'); inviteCard.className = 'card';
  inviteCard.innerHTML = `
    <div class="field-hint" style="margin-top:0;">${t('inviteTeamHint')}</div>
    <div class="form-row">
      <label>${t('role')} <select id="team-inv-role">
        <option value="agent">${t('registerRoleAgent')}</option>
        <option value="external_lawyer">${t('registerRoleExternalLawyer')}</option>
        <option value="lawyer">${t('registerRoleLawyer')}</option>
      </select></label>
      <label>${t('name')} <input type="text" id="team-inv-name" placeholder="${t('namePh')}"></label>
      <label>${t('email')} <input type="email" id="team-inv-email" placeholder="${t('emailPh')}"></label>
    </div>
    <div class="form-actions" style="display:flex; justify-content:flex-end;">
      <button class="btn primary" id="team-inv-generate">${t('generateInvite')}</button>
    </div>
    <div id="team-inv-result" style="display:none;">
      <div class="form-row">
        <label style="flex:1;">${t('inviteLinkLabel')}
          <input type="text" id="team-inv-link" readonly>
        </label>
        <button class="btn" id="team-inv-copy" style="align-self:flex-end;">${t('copy')}</button>
      </div>
    </div>
    <div class="gate-error" id="team-inv-error"></div>
  `;
  wrap.appendChild(inviteCard);
  inviteCard.querySelector('#team-inv-generate').onclick = async () => {
    const roleInDeal = inviteCard.querySelector('#team-inv-role').value;
    const name = inviteCard.querySelector('#team-inv-name').value.trim();
    const email = inviteCard.querySelector('#team-inv-email').value.trim();
    const errEl = inviteCard.querySelector('#team-inv-error');
    errEl.textContent = '';
    if(!name || !email){ errEl.textContent = t('errNameOrEmail'); return; }
    try{
      const { url } = await apiFetch('/api/invites', { method:'POST', body: JSON.stringify({ roleInDeal, name, email }) });
      const linkInput = inviteCard.querySelector('#team-inv-link');
      linkInput.value = window.location.origin + url;
      inviteCard.querySelector('#team-inv-result').style.display = 'block';
    }catch(e){ errEl.textContent = e.message; }
  };
  inviteCard.querySelector('#team-inv-copy').onclick = () => {
    const linkInput = inviteCard.querySelector('#team-inv-link');
    linkInput.select();
    navigator.clipboard.writeText(linkInput.value);
  };

  const integrationsTitle = document.createElement('div');
  integrationsTitle.className = 'section-title'; integrationsTitle.textContent = t('integrationsTitle');
  wrap.appendChild(integrationsTitle);
  wrap.appendChild(buildIntegrationsSection());

  if(currentUser.role === 'admin'){
    const notaryTitle = document.createElement('div');
    notaryTitle.className = 'section-title'; notaryTitle.textContent = t('notaryPaymentNoteLabel');
    wrap.appendChild(notaryTitle);
    wrap.appendChild(buildNotaryPaymentNoteSection());
  }

  return wrap;
}

// Base de contactos de comprador/vendedor — separado del Equipo (que es
// staff: agentes/abogados/admin) porque un cliente no es parte del equipo,
// pero admin necesita poder volver a contactarlo (ej. recordatorio anual de
// predial) incluso después de que su operación ya cerró.
function buildClientsSection(){
  const wrap = document.createElement('div');
  const title = document.createElement('div');
  title.className = 'section-title'; title.textContent = t('navClients');
  wrap.appendChild(title);
  const card = document.createElement('div'); card.className = 'card';

  if(clientsCache === undefined){
    card.innerHTML = `<div class="field-hint" style="margin:0;">${t('loading')}</div>`;
    loadClients();
    wrap.appendChild(card);
    return wrap;
  }
  if(clientsCache.error){
    card.innerHTML = `<div class="field-hint" style="margin:0;">${escapeHtml(clientsCache.error)}</div>`;
    wrap.appendChild(card);
    return wrap;
  }

  const controls = document.createElement('div');
  controls.style.cssText = 'display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center;';
  controls.innerHTML = `
    <input type="text" id="clients-search" placeholder="${t('searchByName')}" value="${escapeHtml(clientsSearch)}" style="flex:1; min-width:180px; font-size:13px; padding:7px 10px;">
    <select id="clients-role-filter" style="font-size:13px; padding:7px 10px;">
      <option value="all" ${clientsRoleFilter==='all'?'selected':''}>${t('allRoles')}</option>
      <option value="buyer" ${clientsRoleFilter==='buyer'?'selected':''}>${t('buyerLabel2')}</option>
      <option value="seller" ${clientsRoleFilter==='seller'?'selected':''}>${t('sellerLabel2')}</option>
    </select>
    <button class="btn" id="clients-download"><i class="ti ti-download" aria-hidden="true"></i> ${t('downloadCsv')}</button>
  `;
  wrap.appendChild(controls);
  controls.querySelector('#clients-search').oninput = (e) => {
    clientsSearch = e.target.value;
    const cursor = e.target.selectionStart;
    render();
    // render() reconstruye todo el DOM (incluido este input) — sin esto, el
    // foco y la posición del cursor se pierden en cada tecla mientras buscas.
    const el = document.getElementById('clients-search');
    if(el){ el.focus(); el.setSelectionRange(cursor, cursor); }
  };
  controls.querySelector('#clients-role-filter').onchange = (e) => { clientsRoleFilter = e.target.value; render(); };

  const search = clientsSearch.trim().toLowerCase();
  const filtered = clientsCache.filter(c =>
    (clientsRoleFilter === 'all' || c.role === clientsRoleFilter) &&
    (!search || c.name.toLowerCase().includes(search))
  );
  controls.querySelector('#clients-download').onclick = () => downloadClientsCsv(filtered);

  if(!clientsCache.length){
    card.innerHTML = `<div class="field-hint" style="margin:0;">${t('noClientsYet')}</div>`;
    wrap.appendChild(card);
    return wrap;
  }
  if(!filtered.length){
    card.innerHTML = `<div class="field-hint" style="margin:0;">${t('noClientsMatch')}</div>`;

  return wrap;
