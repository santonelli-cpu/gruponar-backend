<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Nar — Crear cuenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
</head>
<body style="background:var(--stone); min-height:100vh;">
<div class="gate-wrap">
  <div class="gate-card">
    <div class="gate-mark">Grupo Nar Legal Consultants</div>
    <div class="gate-title" id="title">Crear tu cuenta</div>
    <div class="gate-sub" id="sub">Cargando invitación…</div>
    <div class="gate-error" id="error"></div>
    <div id="form" style="display:none;">
      <input type="password" id="password" placeholder="Contraseña (mínimo 8 caracteres)" autocomplete="new-password">
      <input type="password" id="password2" placeholder="Confirma tu contraseña" autocomplete="new-password">
      <button class="btn primary" id="submit" style="width:100%;">Crear cuenta y entrar</button>
    </div>
  </div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const titleEl = document.getElementById('title');
  const subEl = document.getElementById('sub');
  const errorEl = document.getElementById('error');
  const formEl = document.getElementById('form');
  const ROLE_LABEL = { buyer: 'comprador(a)', seller: 'vendedor(a)', agent: 'agente' };

  async function apiFetch(path, options={}){
    const res = await fetch(path, { credentials:'include', headers:{'Content-Type':'application/json'}, ...options });
    let body = null;
    try{ body = await res.json(); }catch(e){}
    if(!res.ok) throw new Error((body && body.error) || `Error ${res.status}`);
    return body;
  }

  async function init(){
    if (!token) {
      subEl.textContent = '';
      errorEl.textContent = 'Falta el token de invitación en el link.';
      return;
    }
    try {
      const invite = await apiFetch('/api/invites/' + token);
      subEl.textContent = `${invite.name}, te invitaron como ${ROLE_LABEL[invite.roleInDeal] || invite.roleInDeal} a la operación "${invite.dealProperty}". Pon una contraseña para tu cuenta (${invite.email}).`;
      formEl.style.display = 'block';
    } catch(e) {
      subEl.textContent = '';
      errorEl.textContent = e.message;
    }
  }

  document.getElementById('submit').onclick = async () => {
    errorEl.textContent = '';
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    if (password.length < 8) { errorEl.textContent = 'La contraseña debe tener al menos 8 caracteres.'; return; }
    if (password !== password2) { errorEl.textContent = 'Las contraseñas no coinciden.'; return; }
    try {
      await apiFetch('/api/invites/' + token + '/accept', { method:'POST', body: JSON.stringify({ password }) });
      window.location.href = '/';
    } catch(e) {
      errorEl.textContent = e.message;
    }
  };

  init();
</script>
</body>
</html>
