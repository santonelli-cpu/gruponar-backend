<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Nar — Crear cuenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
</head>
<body style="background:var(--stone); min-height:100vh;">
<div class="gate-wrap">
  <div class="gate-card">
    <button class="btn" id="lang-toggle" style="position:absolute; top:18px; right:18px; font-size:11px; padding:4px 12px;">EN</button>
    <div class="gate-mark">Grupo NAR Legal Consultants</div>
    <div class="gate-title" id="title">Crear tu cuenta</div>
    <div class="gate-sub" id="sub">Cargando invitación…</div>
    <div class="gate-error" id="error"></div>
    <div id="form" style="display:none;">
      <select id="agency" style="width:100%; margin-bottom:10px; display:none;">
        <option value="" id="agency-placeholder">Selecciona tu agencia...</option>
        <option value="LPR Luxury">LPR Luxury</option>
        <option value="Applegate Realtors">Applegate Realtors</option>
        <option value="JPM Real Estate">JPM Real Estate</option>
        <option value="Interamerican">Interamerican</option>
        <option value="Otro" id="agency-other-option">Otro</option>
      </select>
      <input type="text" id="agency-other" placeholder="¿Cuál agencia?" style="display:none;">
      <input type="password" id="password" placeholder="Contraseña (mínimo 8 caracteres)" autocomplete="new-password">
      <input type="password" id="password2" placeholder="Confirma tu contraseña" autocomplete="new-password">
      <button class="btn primary" id="submit" style="width:100%;">Crear cuenta y entrar</button>
    </div>
    <div id="totp-choice" style="display:none;">
      <p class="gate-sub" id="totp-choose-intro" style="margin-top:0;"></p>
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:6px;">
        <button class="btn primary" id="totp-choose-app" style="width:100%;"></button>
        <button class="btn primary" id="totp-choose-email" style="width:100%;"></button>
      </div>
    </div>
    <div id="totp-form" style="display:none;">
      <p class="gate-sub" id="totp-intro" style="margin-top:0;"></p>
      <div id="totp-qr-wrap" style="display:none; text-align:center; margin-bottom:12px;">
        <img id="totp-qr" style="width:180px; height:180px;" alt="QR">
        <div class="field-hint" id="totp-manual-label" style="margin-top:6px;"></div>
        <code id="totp-secret" style="font-size:13px; letter-spacing:1px;"></code>
      </div>
      <input type="text" id="totp-code" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" style="text-align:center; font-size:20px; letter-spacing:4px;">
      <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; margin:10px 0 0; cursor:pointer;">
        <input type="checkbox" id="totp-remember" checked> <span id="totp-remember-label"></span>
      </label>
      <button class="btn primary" id="totp-submit" style="width:100%; margin-top:10px;">Verificar</button>
      <div class="field-hint" style="text-align:center; margin-top:10px;">
        <a href="#" id="totp-resend" style="display:none;"></a>
        <a href="#" id="totp-change-method" style="display:none;"></a>
      </div>
    </div>
  </div>
</div>
<script src="js/invite.js"></script>
</body>
</html>
