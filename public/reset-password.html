<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Nar — Restablecer contraseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
</head>
<body style="background:var(--stone); min-height:100vh;">
<div class="gate-wrap">
  <div class="gate-card">
    <button class="btn" id="lang-toggle" style="position:absolute; top:18px; right:18px; font-size:11px; padding:4px 12px;">EN</button>
    <div class="gate-mark">Grupo NAR Legal Consultants</div>
    <div class="gate-title" id="title">Restablece tu contraseña</div>
    <div class="gate-sub" id="sub">Cargando…</div>
    <div class="gate-error" id="error"></div>
    <div id="form" style="display:none;">
      <input type="password" id="password" placeholder="Nueva contraseña (mínimo 8 caracteres)" autocomplete="new-password">
      <input type="password" id="password2" placeholder="Confirma tu nueva contraseña" autocomplete="new-password">
      <button class="btn primary" id="submit" style="width:100%;">Guardar y entrar</button>
    </div>
    <div id="success" style="display:none;">
      <div class="gate-sub" id="success-msg" style="margin-bottom:0;"></div>
      <a class="btn primary" href="/" style="width:100%; display:block; text-align:center; margin-top:14px; box-sizing:border-box;" id="login-link">Ir a iniciar sesión</a>
    </div>
  </div>
</div>
<script src="js/reset-password.js"></script>
</body>
</html>
